6-September 2027 (Timebound) 8 youth apprentices ages 15-18 will demonstrate increased leadership and workforce skills, self-efficacy and awareness of food system careers through successful completion of one of six interrelated apprenticeships (growing culturally-relevant products; school food menu development; statewide youth food justice coalition-building; youth food justice education; food assistance and distribution; and media and communications) at Grow Windham and partner organizations (CLiCK, and the CT Food Sovereignty Collective), in which they work alongside adult mentors to develop individual projects that advance their vision of food justice. (Strategic, Equitable, Ambitious) With mentor support, 100% of youth will: design a project workplan; set and track personal and project goals; and plan at least one workday that engages their peers in the development of their project, and 88% will meet or exceed personal goals. (Measurable, Realistic) Youth are 90% Latinx, all from low-wealth households (eligible for free and reduced lunch) and from Windham (versus surrounding towns), with priority recruiting immigrant and high-need youth who are referred through the schools. (Inclusive, Equitable)\nSuccess Measures\nWe will measure success by: Youth outcomes: Youth set and track personal and project goals, and adapt project workplans as needed Food system outcomes (by apprenticeship): *Two culturally-relevant products will be grown (growing apprentice), to be distributed to Community Table Shareholders (food assistance and distribution apprentice) and integrated into school food recipe development *One culturally-relevant, youth-inspired menu item will be added to the EASTCONN School Food Service Menu (school food menu development apprentice) *Two new “food roots” workshops will be created for the WYC (youth food justice education apprentice) *A youth food justice policy strategy and campaign, shared with other state-wide programs and coordinated by the Food Sovereignty Collective staff (statewide youth coalition building apprentice) *Two youth media campaigns, uplifting their local and state-wide food system work, will be posted on Grow Windham social media (media and communications apprentice) *Three focus groups of apprentices and mentors, as part of the annual retreat cycle, will articulate reflections and insights about barriers and challenges to local food system development, to be integrated into statewide food policy advocacy","smartie_goal_3":"From October 2026-September 2027 (Timebound) 60 statewide high-school aged youth (14-18) from 4 CT youth food justice programs will demonstrate growth in advocacy and leadership skills, increased understanding of the legislative and policy-making process, and growth in individual and collective self-efficacy, through active participation in intergenerational state food policy advocacy aligned with the CT Food Sovereignty Collective (Strategic, Ambitious, Inclusive, Equitable) involving: a (pre-project) Summer 2026 youth convening, at which they build trust and connection; Fall 2026 youth-led policy summit, at which they learn about and define priorities, based on the CT Food Sovereignty Policy Agenda; a Winter 2027 coordinated campaign, culminating in a day of advocacy at the state house; and Summer 2027 convening, where they reflect on their growth and outline next steps.(Realistic) Demographics of the youth in other programs are not known, but all programs are majority BILPOC from CT urban areas (Bridgeport, New London, New Britain) with high levels of food insecurity, and from organizations with food justice/equity mission and values. (Inclusive, Equitable)\nSuccess Measures\nWe will measure success by: Individual youth outcomes, through pre/post surveys at each gathering Collective impact, through a focus group of youth leaders, at the end of the legislative session, to reflect on changes in their definition of food justice, relationships formed with youth and adults across the state, and sense of individual and collective power Other outputs include: *60 youth attendees at two youth-led events *20 youth attendees at youth advocacy day *Shared food justice advocacy curriculum, developed by project leaders, to be implemented across programs leading up to and following the fall summit *A youth food justice policy strategy and campaign, coordinated by the Food Sovereignty Collective staff and youth apprentices *Number of legislators engaged by youth in this work","smartie_goals":["From October 2026 to August 2027 (Timebound), 25 unduplicated youth ages 14-18 will demonstrate increased foundational food system skills and food justice consciousness through successful completion of the Windham Youth CORE (“Cultivating Opportunity, Resources and Equity”) year-round service-learning program. (Strategic, Measurable, Realistic) 92% of the youth will demonstrate growth in their: ability to grow and process food; understanding about the components and types of different food systems (local, industrial, cooperative); and consciousness about the principles of food justice and how to manifest them through engagement in their local food system, (Ambitious, Strategic) with programming co-created and co-facilitated by adult staff and youth apprentices (program graduates from the previous year) (Ambitious, Strategic) Youth are 90% Latinx, all from low-wealth households (eligible for free and reduced lunch) and from Windham (versus surrounding towns), with priority recruiting immigrant and high need youth who are referred through the schools. (Inclusive, Equitable)\nSuccess Measures\nWe will measure youth development through portfolios in which they: * Set, track, and reflect on growth toward personal goals, based off of our “Community Leaders Profile” and Workforce and Community Standards * Independently design and complete an activity related to food production * Lead at least one community tabling event or activity, in which they articulate how their work promotes their vision of food justice * Complete an individual “photo voice” project at the end of each session (3 times a year) through which they highlight the work they have accomplished and explain how it impacts their lives, their food system, and their community; and reflect on their growth through the program (Because we do this project each trimester, it acts as a pre/post means to measure growth in knowledge and food justice consciousness.) Triannual (Jan, June, September) Youth Retreats provide feedback on program design and implementation, and identify projects and goals for the next program segment. (Inclusive, Equitable, Strategic)","From October 2026-September 2027 (Timebound) 8 youth apprentices ages 15-18 will demonstrate increased leadership and workforce skills, self-efficacy and awareness of food system careers through successful completion of one of six interrelated apprenticeships (growing culturally-relevant products; school food menu development; statewide youth food justice coalition-building; youth food justice education; food assistance and distribution; and media and communications) at Grow Windham and partner organizations (CLiCK, and the CT Food Sovereignty Collective), in which they work alongside adult mentors to develop individual projects that advance their vision of food justice. (Strategic, Equitable, Ambitious) With mentor support, 100% of youth will: design a project workplan; set and track personal and project goals; and plan at least one workday that engages their peers in the development of their project, and 88% will meet or exceed personal goals. (Measurable, Realistic) Youth are 90% Latinx, all from low-wealth households (eligible for free and reduced lunch) and from Windham (versus surrounding towns), with priority recruiting immigrant and high-need youth who are referred through the schools. (Inclusive, Equitable)\nSuccess Measures\nWe will measure success by: Youth outcomes: Youth set and track personal and project goals, and adapt project workplans as needed Food system outcomes (by apprenticeship): *Two culturally-relevant products will be grown (growing apprentice), to be distributed to Community Table Shareholders (food assistance and distribution apprentice) and integrated into school food recipe development *One culturally-relevant, youth-inspired menu item will be added to the EASTCONN School Food Service Menu (school food menu development apprentice) *Two new “food roots” workshops will be created for the WYC (youth food justice education apprentice) *A youth food justice policy strategy and campaign, shared with other state-wide programs and coordinated by the Food Sovereignty Collective staff (statewide youth coalition building apprentice) *Two youth media campaigns, uplifting their local and state-wide food system work, will be posted on Grow Windham social media (media and communications apprentice) *Three focus groups of apprentices and mentors, as part of the annual retreat cycle, will articulate reflections and insights about barriers and challenges to local food system development, to be integrated into statewide food policy advocacy","From October 2026-September 2027 (Timebound) 60 statewide high-school aged youth (14-18) from 4 CT youth food justice programs will demonstrate growth in advocacy and leadership skills, increased understanding of the legislative and policy-making process, and growth in individual and collective self-efficacy, through active participation in intergenerational state food policy advocacy aligned with the CT Food Sovereignty Collective (Strategic, Ambitious, Inclusive, Equitable) involving: a (pre-project) Summer 2026 youth convening, at which they build trust and connection; Fall 2026 youth-led policy summit, at which they learn about and define priorities, based on the CT Food Sovereignty Policy Agenda; a Winter 2027 coordinated campaign, culminating in a day of advocacy at the state house; and Summer 2027 convening, where they reflect on their growth and outline next steps.(Realistic) Demographics of the youth in other programs are not known, but all programs are majority BILPOC from CT urban areas (Bridgeport, New London, New Britain) with high levels of food insecurity, and from organizations with food justice/equity mission and values. (Inclusive, Equitable)\nSuccess Measures\nWe will measure success by: Individual youth outcomes, through pre/post surveys at each gathering Collective impact, through a focus group of youth leaders, at the end of the legislative session, to reflect on changes in their definition of food justice, relationships formed with youth and adults across the state, and sense of individual and collective power Other outputs include: *60 youth attendees at two youth-led events *20 youth attendees at youth advocacy day *Shared food justice advocacy curriculum, developed by project leaders, to be implemented across programs leading up to and following the fall summit *A youth food justice policy strategy and campaign, coordinated by the Food Sovereignty Collective staff and youth apprentices *Number of legislators engaged by youth in this work"],"strategy_1":"Youth training and development","strategy_2":"Direct Service and Education","scope_of_work":"State","target_age_range":"High School","special_populations":"Latine Youth","location":"Willimantic, CT","note":"Grow Windham cultivates intergenerational spaces that center youth to grow and build their power to problem solve and create new opportunities in Windham.   â€ We do this by using the garden as a hub to address systemic barriers, where youth are responsible for building community, leading projects, and taking action to accomplish their visions."},{"org":"La Colaborativa","app":"Growing, Cooking, and Connecting: A Youth Food Justice Initiative","name":"Growing, Cooking, and Connecting: A Youth Food Justice Initiative","application_link":"https://portal.justfund.us/f/application/40449","city":"Chelsea","state":"MA","region":"Northeast","finalist_type":"Kendall","portfolio":"Nutrition Education & School Food","label":"Nutrition Education & School Food","focus":"Economic Justice, Democracy & Civic Engagement, Human Rights / Civil Rights & Liberties","strategies":"Coalition Building, Direct Action, Healing / Restorative Justice, Leadership Development, Movement Building, Organizing","scope":"Regional, Local","bipoc":"Yes","tax":"501c3","communities":"Caribbean, Immigrant, Latino / Latina / Latinx, Refugees, Women, Youth","budget":"$9,000,000","annual_budget":"$9,000,000","budget_value":9000000,"budget_bucket":"$5M–$25M","grant_req":"$50,000","grant_request_value":50000,"mission":"immigrant communities in Greater Boston. Our mission is to empower Latinx immigrants to enhance the social and economic health of the community and their people, and to hold institutional decision-makers accountable to the community.   Founded in 1988 as the Chelsea Collaborative, La Colaborativa emerged during a period of significant challenges for the city of Chelsea, including near-bankruptcy and a large influx of immigrants seeking opportunity and stability. Over our 35+ year history, we have evolved from a traditional service organization to a community-driven force for systemic change. A pivotal transformation occurred under the leadership of current President & CEO Gladys Vega, who joined the organization in 1990. Gladys led efforts to increase representation of people of color on the board and ensure our programs directly reflected the needs and priorities identified by community members themselves. This shift toward authentic community leadership has been fundamental to our approach ever since.    For over 35 years, we have worked in true partnership with community members to design and deliver programs, initiatives, and community organizing campaigns that serve, protect, celebrate, and uplift our people. Our approach centers grassroots leadership development and community organizing as the foundation for creating lasting policy and system changes that foster just, equitable 21st-century cities.","year_est":"1988","additional_questions":"Question: Question 1: Program Focus     Please check which of the following focus areas are primary elements of the proposed program.      Select the one that is most relevant to your program's focus. This selection will help us with assigning reviewers. Note: All eligible projects must primarily focus on children under the age of 18.  Learn more in our FAQs . Answer: Nutrition Education & School Food: Projects and policy work supporting kids learning, growing, and cooking healthy and culturally relevant foods; eating nutritious and culturally relevant school meals and integrating local food in schools; or improving access to school meals.\n\nQuestion: Question 2: Innovation     How does your proposed project offer both an innovative and impactful approach that advances food justice for kids?      \"Innovative\" doesn't necessarily mean new technology or a novel approach. Whether rooted in traditional knowledge, adapted from successful models in other communities, or offering a novel approach to persistent challenges, we want to understand what makes your approach unique and why you believe it will create meaningful change.   Please also share any evidence of past results, related outcomes, and/or qualitative or quantitative indicators that demonstrate the promise of your approach. Answer: La Colaborativaâ€™s project advances food justice for youth by addressing not only access to healthy food, but also the structural barriers that limit who has the knowledge, resources, and agency to make healthy choices. In Chelseaâ€”an Environmental Justice communityâ€”many young people face limited access to fresh, culturally relevant foods, few opportunities for hands-on nutrition education, and systems that do not reflect their lived experiences.   Our project is innovative because it transforms nutrition education from passive learning into lived experience by integrating food production, hands-on cooking, and culturally relevant learning into a single, connected model. Through our Freight Farm and teaching kitchen, students actively grow, harvest, and prepare fresh foodâ€”building practical skills, confidence, and familiarity with healthy ingredients.   Rather than relying solely on school meal systems, which are often outside of community control, this approach gives youth direct, hands-on access to food and the knowledge to prepare it. Students are not just learning about nutritionâ€”they are actively shaping their relationship to food, influencing what they eat, and bringing those habits into their homes.   This model builds on La Colaborativaâ€™s proven ability to engage youth and families through trusted, community-based programming. Past efforts have shown strong participation and increased willingness among youth to try fresh foods, alongside high levels of family engagement in food distribution and nutrition activities.   The project is impactful because it extends beyond the classroom into the home and community. Students prepare culturally relevant meals, participate in taste tests, and bring fresh produce homeâ€”reinforcing healthy eating habits at the household level. By combining access, education, and empowerment, this model creates meaningful behavior change, builds lifelong skills, and shifts food habits at both the individual and household level.\n\nQuestion: Question 3: Community Power     How is your organization and/or project led by, collaborating with, and building power within the community you serve?     For example, how are children, caregivers, school leadership, and other relevant community leaders guiding your project and working in partnership in other aspects of your organizationâ€™s work? Answer: For example, how are children, caregivers, school leadership, and other relevant community leaders guiding your project and working in partnership in other aspects of your organizationâ€™s work? *   La Colaborativaâ€™s work is rooted in community leadership and co-creation. The organization was founded by Chelsea residents and continues to be led by staff and leadership who reflect the cultural and linguistic backgrounds of the community. This proximity and trust shape how programs are designed, implemented, and adapted over time.   This project is developed in close partnership with Chelsea Public Schools, including teachers, school leadership, and food service staff, who help shape curriculum integration, student engagement strategies, and program implementation. Students themselves play an active role through hands-on participation in the Freight Farm and teaching kitchen, as well as through leadership opportunities such as internships and peer engagement. Their feedback informs program design, ensuring that content remains relevant, culturally responsive, and engaging.   Caregivers and families are engaged through community events, cooking workshops, and food distributions, where they provide input on food preferences, cultural relevance, and access needs. This feedback directly informs the types of foods grown, prepared, and distributed through the program.   The project also includes a Farm-to-School Advisory Council composed of students, educators, La Colaborativa staff, and community partners. This group helps guide program direction, strengthen accountability, and ensure alignment with community priorities.   By centering community voices at every levelâ€”from design to implementation to evaluationâ€”La Colaborativa not only delivers services, but builds community power, ensuring that residents are active participants in shaping healthier, more equitable food systems.","website":"https://la-colaborativa.org/","smartie_summary":"This organization works at the intersection between culturally relevant foods, nutrition education, and access. It achieves its mission through community collaboration, student leadership development, and direct support.","smartie_goal_1":"Nutrition Education + Behavior Change \nFrom October 2026 to September 2027, La Colaborativa will engage at least 500 high school students (ages 14–18) in hands-on nutrition education through Freight Farm-based learning and teaching kitchen programming, with at least 75% of participants from low-income households. Students will participate in culturally responsive cooking classes and food systems education designed with youth input, resulting in a 25% increase in nutrition knowledge and confidence in preparing healthy meals.\nSuccess Measures\nWe will track student participation, attendance, and instructional hours delivered. Pre- and post-assessments will measure changes in nutrition knowledge, confidence in cooking, and willingness to try fresh foods. Student feedback surveys and focus groups will assess cultural relevance and program satisfaction. Participation in cooking demonstrations and recipe development will be tracked to measure engagement and skill-building.","smartie_goal_2":"Food Access + Family Impact \nFrom October 2026 to September 2027, La Colaborativa will increase access to fresh, locally grown food for at least 300 students (ages 14–18) and their families by integrating Freight Farm produce into educational programming and community food distribution, with a focus on culturally relevant foods identified by youth and caregivers. At least 70% of participating households will report increased access to fresh produce and improved confidence in preparing healthy meals at home.\nSuccess Measures\nWe will track pounds of produce grown and distributed, number of students and families receiving food, and frequency of distribution. Surveys will measure changes in household food access, cooking behaviors, and food consumption patterns. Family engagement at events and workshops will be tracked, and qualitative feedback will be collected to assess cultural relevance and accessibility.","smartie_goal_3":"Youth Leadership + Food Justice \nFrom October 2026 to September 2027, La Colaborativa will engage at least 30 high school students (ages 14–18) in youth leadership roles, including internships and participation in a Farm-to-School Advisory Council, where students will co-design programming, inform food production decisions, and lead peer engagement activities. At least 80% of participating youth will report increased leadership skills, confidence, and sense of agency in shaping food access and nutrition in their community.\nSuccess Measures\nWe will track participation in leadership roles, hours completed, and involvement in decision-making activities. Pre- and post-surveys will measure changes in leadership skills, confidence, and civic engagement. Meeting notes and documentation from the Advisory Council will capture youth contributions to program design. Focus groups will provide qualitative insights into youth experiences and perceived impact.","smartie_goals":["Nutrition Education + Behavior Change \nFrom October 2026 to September 2027, La Colaborativa will engage at least 500 high school students (ages 14–18) in hands-on nutrition education through Freight Farm-based learning and teaching kitchen programming, with at least 75% of participants from low-income households. Students will participate in culturally responsive cooking classes and food systems education designed with youth input, resulting in a 25% increase in nutrition knowledge and confidence in preparing healthy meals.\nSuccess Measures\nWe will track student participation, attendance, and instructional hours delivered. Pre- and post-assessments will measure changes in nutrition knowledge, confidence in cooking, and willingness to try fresh foods. Student feedback surveys and focus groups will assess cultural relevance and program satisfaction. Participation in cooking demonstrations and recipe development will be tracked to measure engagement and skill-building.","Food Access + Family Impact \nFrom October 2026 to September 2027, La Colaborativa will increase access to fresh, locally grown food for at least 300 students (ages 14–18) and their families by integrating Freight Farm produce into educational programming and community food distribution, with a focus on culturally relevant foods identified by youth and caregivers. At least 70% of participating households will report increased access to fresh produce and improved confidence in preparing healthy meals at home.\nSuccess Measures\nWe will track pounds of produce grown and distributed, number of students and families receiving food, and frequency of distribution. Surveys will measure changes in household food access, cooking behaviors, and food consumption patterns. Family engagement at events and workshops will be tracked, and qualitative feedback will be collected to assess cultural relevance and accessibility.","Youth Leadership + Food Justice \nFrom October 2026 to September 2027, La Colaborativa will engage at least 30 high school students (ages 14–18) in youth leadership roles, including internships and participation in a Farm-to-School Advisory Council, where students will co-design programming, inform food production decisions, and lead peer engagement activities. At least 80% of participating youth will report increased leadership skills, confidence, and sense of agency in shaping food access and nutrition in their community.\nSuccess Measures\nWe will track participation in leadership roles, hours completed, and involvement in decision-making activities. Pre- and post-surveys will measure changes in leadership skills, confidence, and civic engagement. Meeting notes and documentation from the Advisory Council will capture youth contributions to program design. Focus groups will provide qualitative insights into youth experiences and perceived impact."],"strategy_1":"Youth training and development","strategy_2":"Direct Service and Education","scope_of_work":"Local","target_age_range":"High School","special_populations":"All Youth","location":"Chelsea, MA","note":"immigrant communities in Greater Boston. Our mission is to empower Latinx immigrants to enhance the social and economic health of the community and their people, and to hold institutional decision-makers accountable to the community.   Founded in 1988 as the Chelsea Collaborative, La Colaborativa emerged during a period of significant challenges for the city of Chelsea, including near-bankruptcy and a large influx of immigrants seeking opportunity and stability. Over our 35+ year history, we have evolved from a traditional service organization to a community-driven force for systemic change. A pivotal transformation occurred under the leadership of current President & CEO Gladys Vega, who joined the organization in 1990. Gladys led efforts to increase representation of people of color on the board and ensure our programs directly reflected the needs and priorities identified by community members themselves. This shift toward authentic community leadership has been fundamental to our approach ever since.    For over 35 years, we have worked in true partnership with community members to design and deliver programs, initiatives, and community organizing campaigns that serve, protect, celebrate, and uplift our people. Our approach centers grassroots leadership development and community organizing as the foundation for creating lasting policy and system changes that foster just, equitable 21st-century cities."},{"org":"Girls Inc. of Worcester","app":"Active Families: A Food Access and Nutrition Program for Girls and Caregivers","name":"Active Families: A Food Access and Nutrition Program for Girls and Caregivers","application_link":"https://portal.justfund.us/f/application/40393","city":"Worcester","state":"MA","region":"Northeast","finalist_type":"Kendall","portfolio":"Nutrition Education & School Food","label":"Nutrition Education & School Food","focus":"Education, Economic Justice, Other","strategies":"Capacity Building / Org Development, Culture, Direct Service, Education, Healing / Restorative Justice, Leadership Development","scope":"Local","bipoc":"Yes","tax":"501c3","communities":"Black, Caribbean, Latino / Latina / Latinx, Women, Youth, Youth: High School","budget":"$2,615,468","annual_budget":"$2,615,468","budget_value":2615468,"budget_bucket":"$1M–$5M","grant_req":"$45,340","grant_request_value":45340,"mission":"To inspire all girls to be strong, smart, and bold. We put our mission into practice through the people, place, and programs that together provide opportunities for girls to build leadership skills and overcome challenges.   Girls Inc. of Worcesterâ€™s vision is   an equitable   world in which empowered girls can grow into adults who lead fulfilling and productive lives, break the cycle of poverty, and become role models in their community.","year_est":"1916","additional_questions":"Question: Question 1: Program Focus     Please check which of the following focus areas are primary elements of the proposed program.      Select the one that is most relevant to your program's focus. This selection will help us with assigning reviewers. Note: All eligible projects must primarily focus on children under the age of 18.  Learn more in our FAQs . Answer: Nutrition Education & School Food: Projects and policy work supporting kids learning, growing, and cooking healthy and culturally relevant foods; eating nutritious and culturally relevant school meals and integrating local food in schools; or improving access to school meals.\n\nQuestion: Question 2: Innovation     How does your proposed project offer both an innovative and impactful approach that advances food justice for kids?      \"Innovative\" doesn't necessarily mean new technology or a novel approach. Whether rooted in traditional knowledge, adapted from successful models in other communities, or offering a novel approach to persistent challenges, we want to understand what makes your approach unique and why you believe it will create meaningful change.   Please also share any evidence of past results, related outcomes, and/or qualitative or quantitative indicators that demonstrate the promise of your approach. Answer: Our approach is innovative because it recognizes that improving food justice for girls requires more than nutrition education or food access alone. By combining family-centered nutrition education, hands-on food experiences, community-based food access, and caregiver engagement, the program helps girls and families build healthier relationships with food in practical, sustainable ways. This approach addresses persistent challenges from multiple angles (i.e., knowledge, access, and daily habits), creating stronger long-term outcomes than isolated interventions. Early family feedback and participation trends demonstrate the promise of this integrated model in supporting healthier choices, stronger engagement, and meaningful change.\n\nQuestion: Question 3: Community Power     How is your organization and/or project led by, collaborating with, and building power within the community you serve?     For example, how are children, caregivers, school leadership, and other relevant community leaders guiding your project and working in partnership in other aspects of your organizationâ€™s work? Answer: Girls, caregivers, schools, and community partners all play an active role in shaping this program to ensure it reflects the real needs of families most impacted by food inequities:      Participants & Caregivers:  Youth surveys and caregiver feedback are conducted quarterly and annually, informing program design. Families also participate in focus groups that directly influence program design, family engagement strategies, and ongoing improvements.    Schools:  Partnership with Worcester Public Schools supports recruitment and student transportation, aligns programming with student needs, and contributes to ongoing evaluation and program improvement.    Community Partners:  Through the WooFridge community fridge network and broader community collaboration, families strengthen reliable food access while building shared ownership of community well-being.     By bringing families and community partners together, this approach creates stronger pathways to healthier food access and fosters lasting family well-being.","website":"http://www.girlsincofworcester.org","smartie_summary":"This organization aims to expand access to safe food storage and distribution practices, collaborating with young girls and their caregivers to strengthen family-centered nutrition education and sustainability practices. This organization achieves its mission through youth leadership development and consistent feedback loops.","smartie_goal_1":"By September 2027, 75 girls (ages 8–17) and their families will experience increased equitable access to nutritious food through sustained community fridge operations, safe food distribution practices, and reduced affordability barriers. Early implementation will prioritize infrastructure, including staff food safety training and community access systems, to ensure consistent and dignified food access throughout the grant period.\nSuccess Measures\nProgress will be tracked through monthly operational data, including pounds of food distributed, frequency of fridge restocking, inventory consistency, and staff completion of ServSafe certification to ensure safe food handling. Quarterly caregiver access surveys will measure whether families experience improved availability of healthy food, reduced food-related stress, and fewer barriers related to affordability or neighborhood access. Caregiver focus groups will provide qualitative insight into the dignity, reliability, and practical value of the food access model.","smartie_goal_2":"By the end of the grant period, 75 girls (ages 8–17) and their caregivers will strengthen household nutrition behaviors through family-centered nutrition education, gardening, and hands-on food experiences, with at least 65% of participating families reporting healthier meal routines and food choices, supported through culturally responsive, family-centered nutrition education.\nSuccess Measures\nFamily-level behavior change will be assessed through pre- and post-program nutrition assessments focused on household meal frequency, fruit and vegetable consumption, caregiver and youth confidence in preparing healthy meals, and application of gardening or food preparation skills at home. Attendance, gardening participation, and retention data will demonstrate engagement across educational components. Guided family reflections and end-of-program feedback will further capture changes in food knowledge, meal practices, and sustainable household behavior.","smartie_goal_3":"Across the grant year, girls (ages 8–17) and caregivers most impacted by food inequities will actively shape program delivery and future growth through structured feedback, milestone events, and community partnerships. Launch, mid-point feedback, and wrap-up engagement opportunities will ensure family and community voice remains central to program refinement.\nSuccess Measures\nCommunity leadership and shared power will be evaluated through participation in monthly participant voice check-ins, quarterly caregiver feedback surveys, launch and wrap-up event attendance, and family focus groups centered on program design and community relevance. Program staff will document specific program improvements or strategic adjustments informed by participant and caregiver input. Partnership indicators from Worcester Public Schools and WooFridge, alongside qualitative leadership feedback, will demonstrate how families and community stakeholders influence program direction, belonging, and long-term systems engagement.","smartie_goals":["By September 2027, 75 girls (ages 8–17) and their families will experience increased equitable access to nutritious food through sustained community fridge operations, safe food distribution practices, and reduced affordability barriers. Early implementation will prioritize infrastructure, including staff food safety training and community access systems, to ensure consistent and dignified food access throughout the grant period.\nSuccess Measures\nProgress will be tracked through monthly operational data, including pounds of food distributed, frequency of fridge restocking, inventory consistency, and staff completion of ServSafe certification to ensure safe food handling. Quarterly caregiver access surveys will measure whether families experience improved availability of healthy food, reduced food-related stress, and fewer barriers related to affordability or neighborhood access. Caregiver focus groups will provide qualitative insight into the dignity, reliability, and practical value of the food access model.","By the end of the grant period, 75 girls (ages 8–17) and their caregivers will strengthen household nutrition behaviors through family-centered nutrition education, gardening, and hands-on food experiences, with at least 65% of participating families reporting healthier meal routines and food choices, supported through culturally responsive, family-centered nutrition education.\nSuccess Measures\nFamily-level behavior change will be assessed through pre- and post-program nutrition assessments focused on household meal frequency, fruit and vegetable consumption, caregiver and youth confidence in preparing healthy meals, and application of gardening or food preparation skills at home. Attendance, gardening participation, and retention data will demonstrate engagement across educational components. Guided family reflections and end-of-program feedback will further capture changes in food knowledge, meal practices, and sustainable household behavior.","Across the grant year, girls (ages 8–17) and caregivers most impacted by food inequities will actively shape program delivery and future growth through structured feedback, milestone events, and community partnerships. Launch, mid-point feedback, and wrap-up engagement opportunities will ensure family and community voice remains central to program refinement.\nSuccess Measures\nCommunity leadership and shared power will be evaluated through participation in monthly participant voice check-ins, quarterly caregiver feedback surveys, launch and wrap-up event attendance, and family focus groups centered on program design and community relevance. Program staff will document specific program improvements or strategic adjustments informed by participant and caregiver input. Partnership indicators from Worcester Public Schools and WooFridge, alongside qualitative leadership feedback, will demonstrate how families and community stakeholders influence program direction, belonging, and long-term systems engagement."],"strategy_1":"Youth training and development","strategy_2":"Direct Service and Education","scope_of_work":"Local","target_age_range":"Elementary - High School","special_populations":"All Youth","location":"Worcester, MA","note":"To inspire all girls to be strong, smart, and bold. We put our mission into practice through the people, place, and programs that together provide opportunities for girls to build leadership skills and overcome challenges.   Girls Inc. of Worcesterâ€™s vision is   an equitable   world in which empowered girls can grow into adults who lead fulfilling and productive lives, break the cycle of poverty, and become role models in their community."},{"org":"Mashantucket Pequot Tribal Nation","app":"MPTN Child Development Center Garden","name":"MPTN Child Development Center Garden","application_link":"https://portal.justfund.us/f/application/40645","city":"Mashantucket","state":"CT","region":"Northeast","finalist_type":"Kendall","portfolio":"Indigenous Food Justice","label":"Indigenous Food Justice","focus":"Education, Racial Justice, Equitable Development","strategies":"Capacity Building / Org Development, Culture, Direct Action, Direct Service, Education, Healing / Restorative Justice","scope":"National, Local","bipoc":"Yes","tax":"Federally recognized tribe","communities":"Indigenous, People with Disabilities, Rural, Seniors, Workers, Youth","budget":"$1,000,000","annual_budget":"$1,000,000","budget_value":1000000,"budget_bucket":"$1M–$5M","grant_req":"$50,000","grant_request_value":50000,"mission":"The Mashantucket Pequot Tribal Nation shall promote spirituality, strong family values, education, social stability, economic independence, and the well-being of Tribal Members, employees, and guests in a healthy and supportive environment.   The ultimate goal is to protect and advance the sovereign rights of the Tribal Nation in order to build and preserve a cultural, social, and economic foundation that can never be undermined or destroyed.","year_est":"1983","additional_questions":"Question: Question 1: Program Focus     Please check which of the following focus areas are primary elements of the proposed program.      Select the one that is most relevant to your program's focus. This selection will help us with assigning reviewers. Note: All eligible projects must primarily focus on children under the age of 18.  Learn more in our FAQs . Answer: Indigenous Food Justice: Projects and policy work supporting kids advancing food sovereignty, or engaging with, gathering, growing, and cooking Indigenous foods.\n\nQuestion: Question 2: Innovation     How does your proposed project offer both an innovative and impactful approach that advances food justice for kids?      \"Innovative\" doesn't necessarily mean new technology or a novel approach. Whether rooted in traditional knowledge, adapted from successful models in other communities, or offering a novel approach to persistent challenges, we want to understand what makes your approach unique and why you believe it will create meaningful change.   Please also share any evidence of past results, related outcomes, and/or qualitative or quantitative indicators that demonstrate the promise of your approach. Answer: This will be the first dedicated program set up for teaching Mashantucket Pequot foodways to members of the Tribe in the 0-8 age range cohort. Prior to colonization, these foodways would have been something that everyone lived with and were immersed within, including during the period of intense cultural adoption that naturally occurs during the first few years of childhood. Disruption to this immersion played a key role in the cultural violence that disconnected members of the Tribe from these traditions. By reintroducing these foodways during the period of greatest cultural adoption in the human lifespan, MPTN will be able to better instill and preserve these traditions for generations to come.\n\nQuestion: Question 3: Community Power     How is your organization and/or project led by, collaborating with, and building power within the community you serve?     For example, how are children, caregivers, school leadership, and other relevant community leaders guiding your project and working in partnership in other aspects of your organizationâ€™s work? Answer: This project is being led by the Mashantucket Pequot community itself, guided by a longstanding mission to educate, revitalize and instill in future generations traditions that have stood the test of time. This initiative engages directly the children, development center staff, education department staff, agricultural department staff, cultural department staff, and Tribal government leaders to ensure that there is buy-in at every level. This widespread buy-in ensures the longevity of the project, not just for the period of the grant itself, but as a long-term endeavor that the community will want to see preserved moving forward.","website":"https://www.mptn-nsn.gov/default.aspx","smartie_summary":"This organization connects Native Youth with garden-centered education through curriculum construction and community collaboration.","smartie_goal_1":"Engage at least 100 Native youth ages 0–8 across the continuum during the 12-month period in a curriculum built around the construction and maintenance of the Children’s Development Center Garden.\nSuccess Measures\nMeasured by enrollment, attendance, and reported quarterly.","smartie_goal_2":"Develop, pilot, and deliver twelve age-stratified, culturally grounded early-childhood curriculum units (3 age bands × 4 seasons) focused on the Children’s Development Center Garden.\nSuccess Measures\nMeasured by number of completed curriculum documents.","smartie_goal_3":"Convene four quarterly Garden-to-Table family gatherings reaching at least 100 unique Pequot families utilizing fresh produce from the Children’s Development Center Garden. \nSuccess Measures\nMeasured by garden produce numbers, event attendance and pre/post family surveys.","smartie_goals":["Engage at least 100 Native youth ages 0–8 across the continuum during the 12-month period in a curriculum built around the construction and maintenance of the Children’s Development Center Garden.\nSuccess Measures\nMeasured by enrollment, attendance, and reported quarterly.","Develop, pilot, and deliver twelve age-stratified, culturally grounded early-childhood curriculum units (3 age bands × 4 seasons) focused on the Children’s Development Center Garden.\nSuccess Measures\nMeasured by number of completed curriculum documents.","Convene four quarterly Garden-to-Table family gatherings reaching at least 100 unique Pequot families utilizing fresh produce from the Children’s Development Center Garden. \nSuccess Measures\nMeasured by garden produce numbers, event attendance and pre/post family surveys."],"strategy_1":"Direct Service and Education","strategy_2":"","scope_of_work":"Local","target_age_range":"Early Childhood and Elementary School","special_populations":"Native Youth","location":"Mashantucket, CT","note":"The Mashantucket Pequot Tribal Nation shall promote spirituality, strong family values, education, social stability, economic independence, and the well-being of Tribal Members, employees, and guests in a healthy and supportive environment.   The ultimate goal is to protect and advance the sovereign rights of the Tribal Nation in order to build and preserve a cultural, social, and economic foundation that can never be undermined or destroyed."},{"org":"Hookuaaina","app":"Hookuaaina","name":"Hookuaaina","application_link":"https://portal.justfund.us/f/application/39537","city":"Kailua","state":"HI","region":"Western","finalist_type":"NOFHumanitix","portfolio":"Indigenous Food Justice","label":"Indigenous Food Justice","focus":"Environmental Justice / Climate Justice / Nature, Healthcare / Wellness / Public Health, Food Justice","strategies":"Culture, Direct Action, Direct Service, Education, Healing / Restorative Justice, Leadership Development","scope":"State, Local","bipoc":"Yes","tax":"501c3","communities":"Asian or Asian American / AAPI, Indigenous, Seniors, Youth, Youth: College, Youth: High School","budget":"$2,400,000","annual_budget":"$2,400,000","budget_value":2400000,"budget_bucket":"$1M–$5M","grant_req":"$50,000","grant_request_value":50000,"mission":"To cultivate a culture of individual well-being and community waiwai (abundance, resilience) through aloha â€˜Äina.","year_est":"2011","additional_questions":"Question: Question 1: Program Focus     Please check which of the following focus areas are primary elements of the proposed program.      Select the one that is most relevant to your program's focus. This selection will help us with assigning reviewers. Note: All eligible projects must primarily focus on children under the age of 18.  Learn more in our FAQs . Answer: Indigenous Food Justice: Projects and policy work supporting kids advancing food sovereignty, or engaging with, gathering, growing, and cooking Indigenous foods.\n\nQuestion: Question 2: Innovation     How does your proposed project offer both an innovative and impactful approach that advances food justice for kids?      \"Innovative\" doesn't necessarily mean new technology or a novel approach. Whether rooted in traditional knowledge, adapted from successful models in other communities, or offering a novel approach to persistent challenges, we want to understand what makes your approach unique and why you believe it will create meaningful change.   Please also share any evidence of past results, related outcomes, and/or qualitative or quantitative indicators that demonstrate the promise of your approach. Answer: At HoÊ»okuaÊ»Äina, children do not visit a farm. They become part of a loÊ»i Ê»ohana, rooted in traditional kalo cultivation, the staple food of Native Hawaiians. Our work centers Indigenous youth, who face disproportionately high rates of food insecurity due to the historical loss of land, culture, and food systems.   Through our Kupuohi and KÅ«kuluhou programs, youth return to the same Ê»Äina over time to plant, harvest, and prepare food, building identity, skills, and a deep sense of responsibility to their communities. Our innovation is continuity, cultural grounding, and long term relationships. We grow 30,000 pounds of kalo annually, sharing over 20 percent with families and kÅ«puna, while providing paid internships and scholarships that create real educational and career pathways.   At PÄlÄwai, a 116 acre former agricultural region being restored for community food production, we are scaling this model to reach more Native Hawaiian youth and strengthen the next generation of food leaders.\n\nQuestion: Question 3: Community Power     How is your organization and/or project led by, collaborating with, and building power within the community you serve?     For example, how are children, caregivers, school leadership, and other relevant community leaders guiding your project and working in partnership in other aspects of your organizationâ€™s work? Answer: HoÊ»okuaÊ»Äina is Native Hawaiian led and grounded in deep relationships across the Windward OÊ»ahu community. We partner with public and private schools to co-create place based learning that reflects the needs of students, teachers, and families. Our work is further guided by collaborations with Ê»Äina based organizations including Kauluakalana and Hui MÄlama o Ke Kai, and by kÅ«puna such as Uncle Earl Kawaa, who share Ê»ike and help keep our practices rooted in culture.   Community leadership is built from within. Many of our staff first came as students, became interns, and now lead programs as educators and mentors. Youth help shape daily work and guide younger peers.   We also serve farmers, first responders, and families impacted by trauma, creating space for healing through Ê»Äina. We build power by growing leaders, restoring relationships, and caring for community together.","website":"https://hookuaaina.org","smartie_summary":"This organization collaborates with local school districts to disseminate culturally-responsive nutrition education to Indigenous youth, prioritizing student leadership development and sustainable food production/harvesting.","smartie_goal_1":"From October 2026 to April 2027 (Time bound), Hoʻokuaʻāina will engage at least 1,200 K to 12 students ages 5 to 17 (Measurable, Ambitious) from 15 or more Windward Oʻahu public schools in a four quarter Kupuohi program grounded in Indigenous food systems and cultural values (Strategic). At least 75 percent of participants will come from Native Hawaiian, Pacific Islander, or low income communities (Equitable), with programming co developed with teachers and adapted to meet diverse learning needs (Inclusive).\nSuccess Measures\nWe will track total student participation, number of schools served, and completion of all four quarterly visits per cohort (Measurable, Realistic). Pre and post reflections each quarter will assess growth in knowledge of food systems, cultural connection, and student engagement. Teacher feedback and participation rates will be collected to evaluate program quality and accessibility.","smartie_goal_2":"From October 2026 to September 2027 (Time bound), Hoʻokuaʻāina will engage up to 30 youth ages 12 to 17 in the Kūkuluhou mentorship program (Measurable, Realistic), with at least 15 receiving paid stipends and 75 percent from Native Hawaiian, Pacific Islander, or low income households (Equitable). Youth will participate in weekly ʻāina based mentorship and leadership development (Strategic), with at least 2 alumni serving in paid educator roles to strengthen a community led leadership pipeline (Ambitious, Inclusive).\n\nSuccess Measures\nWe will track weekly participation, stipend distribution, and retention rates (Measurable). Leadership growth will be assessed through mentor evaluations, youth self assessments, and documentation of youth led activities. We will also track the number of alumni transitioning into paid leadership roles (Realistic).","smartie_goal_3":"From October 2026 to April 2027 (Time bound), Hoʻokuaʻāina will distribute at least 3,000 pounds of kalo and fresh poi to Windward Oʻahu families through community partners (Measurable, Realistic), prioritizing Native Hawaiian and Pacific Islander households with children under 18 experiencing food insecurity (Equitable). This work connects youth grown food back to their communities, strengthening access to culturally relevant, nutritious food (Strategic) through trusted partner networks (Inclusive, Ambitious).\nSuccess Measures\nWe will track total pounds of kalo products distributed, partner pickup logs, and estimated number of households served, including those with children (Measurable). Quarterly partner reports will provide data on reach and need. Qualitative feedback from partners and recipients will assess accessibility, cultural relevance, and overall impact (Realistic).","smartie_goals":["From October 2026 to April 2027 (Time bound), Hoʻokuaʻāina will engage at least 1,200 K to 12 students ages 5 to 17 (Measurable, Ambitious) from 15 or more Windward Oʻahu public schools in a four quarter Kupuohi program grounded in Indigenous food systems and cultural values (Strategic). At least 75 percent of participants will come from Native Hawaiian, Pacific Islander, or low income communities (Equitable), with programming co developed with teachers and adapted to meet diverse learning needs (Inclusive).\nSuccess Measures\nWe will track total student participation, number of schools served, and completion of all four quarterly visits per cohort (Measurable, Realistic). Pre and post reflections each quarter will assess growth in knowledge of food systems, cultural connection, and student engagement. Teacher feedback and participation rates will be collected to evaluate program quality and accessibility.","From October 2026 to September 2027 (Time bound), Hoʻokuaʻāina will engage up to 30 youth ages 12 to 17 in the Kūkuluhou mentorship program (Measurable, Realistic), with at least 15 receiving paid stipends and 75 percent from Native Hawaiian, Pacific Islander, or low income households (Equitable). Youth will participate in weekly ʻāina based mentorship and leadership development (Strategic), with at least 2 alumni serving in paid educator roles to strengthen a community led leadership pipeline (Ambitious, Inclusive).\n\nSuccess Measures\nWe will track weekly participation, stipend distribution, and retention rates (Measurable). Leadership growth will be assessed through mentor evaluations, youth self assessments, and documentation of youth led activities. We will also track the number of alumni transitioning into paid leadership roles (Realistic).","From October 2026 to April 2027 (Time bound), Hoʻokuaʻāina will distribute at least 3,000 pounds of kalo and fresh poi to Windward Oʻahu families through community partners (Measurable, Realistic), prioritizing Native Hawaiian and Pacific Islander households with children under 18 experiencing food insecurity (Equitable). This work connects youth grown food back to their communities, strengthening access to culturally relevant, nutritious food (Strategic) through trusted partner networks (Inclusive, Ambitious).\nSuccess Measures\nWe will track total pounds of kalo products distributed, partner pickup logs, and estimated number of households served, including those with children (Measurable). Quarterly partner reports will provide data on reach and need. Qualitative feedback from partners and recipients will assess accessibility, cultural relevance, and overall impact (Realistic)."],"strategy_1":"Direct Service and Education","strategy_2":"Youth training and development","scope_of_work":"Local","target_age_range":"Elementary - High School","special_populations":"Native Youth","location":"Kailua, HI","note":"To cultivate a culture of individual well-being and community waiwai (abundance, resilience) through aloha â€˜Äina."},{"org":"Yurok Tribe","app":"Kee 'ey'-gah mehl hey-goo-lehl (â€œwe eat together, what we plant togetherâ€), Yurok Tribe Food Sovereignty Program- Indigenous Food Justice Youth Program","name":"Kee 'ey'-gah mehl hey-goo-lehl (â€œwe eat together, what we plant togetherâ€), Yurok Tribe Food Sovereignty Program- Indigenous Food Justice Youth Program","application_link":"https://portal.justfund.us/f/application/40022","city":"Klamath","state":"CA","region":"Western","finalist_type":"NOFHumanitix","portfolio":"Indigenous Food Justice","label":"Indigenous Food Justice","focus":"Criminal Justice, Racial Justice, Human Rights / Civil Rights & Liberties","strategies":"Advocacy, Culture, Direct Service, Healing / Restorative Justice, Policy","scope":"National, State","bipoc":"Yes","tax":"Federally recognized tribe","communities":"Indigenous, Rural, Seniors, Veterans, Women, Youth","budget":"$130,000,000","annual_budget":"$130,000,000","budget_value":130000000,"budget_bucket":"$25M+","grant_req":"$100,000","grant_request_value":100000,"mission":"Yurok Constitution: The Last Paragraph of the Preamble:   The Yurok Tribe is the largest Indian Tribe in California, and while much land has been lost, the spirit of the Creator and our inherent Tribal sovereignty still thrives in the hearts and minds of our people as well as in the strong currents, deep canyons, thick forests, and high mountains of our ancestral lands. Therefore, in order to exercise the inherent sovereignty of the Yurok Tribe, we adopt this Constitution in order to: 1) Preserve forever the survival of our Tribe and protect it from forces which may threaten its existence 2) Uphold and protect our Tribal sovereignty which has existed from time immemorial and which remains undiminished 3) Reclaim the Tribal land base within the Yurok reservation and enlarge the Reservation boundaries to the maximum extent possible within the ancestral lands of our Tribe and/or within any compensatory land area 4) Preserve and promote our culture, language, and religious beliefs and practices, and pass them on to our children, our grandchildren, and to their children and grandchildren on, forever; 5) Provide for the health, education, economy and social well-being of our members and future members; 6) Restore, enhance, and manage the Tribal fishery, Tribal water rights, Tribal forests, and all other natural resources, and 7) Insure peace, harmony, and protection of individual human rights among our members and among others who may come within the jurisdiction of our Tribal government","year_est":"1993","additional_questions":"Question: Question 1: Program Focus     Please check which of the following focus areas are primary elements of the proposed program.      Select the one that is most relevant to your program's focus. This selection will help us with assigning reviewers. Note: All eligible projects must primarily focus on children under the age of 18.  Learn more in our FAQs . Answer: Indigenous Food Justice: Projects and policy work supporting kids advancing food sovereignty, or engaging with, gathering, growing, and cooking Indigenous foods.\n\nQuestion: Question 2: Innovation     How does your proposed project offer both an innovative and impactful approach that advances food justice for kids?      \"Innovative\" doesn't necessarily mean new technology or a novel approach. Whether rooted in traditional knowledge, adapted from successful models in other communities, or offering a novel approach to persistent challenges, we want to understand what makes your approach unique and why you believe it will create meaningful change.   Please also share any evidence of past results, related outcomes, and/or qualitative or quantitative indicators that demonstrate the promise of your approach. Answer: Our proposed project advances Indigenous food justice, food sovereignty, and culturally rooted education for youth in Yurok Ancestral Territory in Humboldt County and Del Norte County. Our project is innovative because it restores what was intentionally disrupted for Yurok people and Yurok youth, our relationships to land, water, food, and one another, by weaving food sovereignty education, cultural revitalization, youth leadership, and systems advocacy into a place-based model. Rather than treating food insecurity as an isolated issue, we center Yurok knowledge, seasonal lifeways, and intergenerational teaching as the foundation for community wellness. By bringing traditional foods back into schools and daily life, elevating youth voice, and strengthening Tribal-led food systems, we are rebuilding the ecological, cultural, and economic foundations that have sustained our people and ensuring youth are nourished and prepared to carry forward sovereignty.\n\nQuestion: Question 3: Community Power     How is your organization and/or project led by, collaborating with, and building power within the community you serve?     For example, how are children, caregivers, school leadership, and other relevant community leaders guiding your project and working in partnership in other aspects of your organizationâ€™s work? Answer: Our Yurok Tribe Food Sovereignty Department and Youth Food Sovereignty project are guided by the people whose lands, waters, and foods we serve. Leadership comes from within the Yurok community; elders, cultural practitioners, parents, youth, and Tribal leadership hold authority in shaping the work through relationship-based guidance grounded in our responsibilities to the land and ancestors. By giving youth meaningful roles in decision-making, we strengthen leadership for the next generation. School leadership works in partnership with our program and community knowledge holders to create space for traditional foods, medicines, and ecological teachings within the school day. Elders and cultural practitioners guide protocols and mentor youth as stewards of Yurok lifeways. Through this network, authority remains within the community, and we sustain food sovereignty and community power.","website":"https://www.yuroktribe.org","smartie_summary":"This organization offers traditional food sovereignty education to indigenous youth, mitigating barriers to access and disseminating programming to local schools and Native clubs -- all of which aim to minimize local food insecurity and foster cultural traditions.","smartie_goal_1":"From October 2026 to September 2027 (Timebound), our program will provide hands-on traditional foods/healthy foods education and food sovereignty curriculum to 100 Tribal K–12 students (ages 5–18) in low-income Tribal communities in Humboldt and Del Norte Counties. By the end of the grant period, 90% of participants will demonstrate increased knowledge of Indigenous food systems, cultural food practices, healthy foods and local food access strategies. (Strategic, Measurable, Ambitious) Programming will be co-designed and guided by Tribal elders, cultural knowledge keepers, program staff, youth, families, and Tribal teachers to ensure curriculum, harvesting practices, and evaluation methods reflect community- identified priorities and intergenerational knowledge systems. Barriers to participation—including transportation, cost, and limited access to culturally relevant materials and gathering spaces—will be addressed by delivering programming directly at local schools and Native clubs/classes on campus; utilizing local and school gardens as learning spaces; providing the program at no cost; supplying traditional foods, medicines, harvesting tools, and cooking/processing materials; and transporting youth to culturally significant gathering and harvesting sites. These strategies ensure equitable access and meaningful participation for youth most impacted by food insecurity, geographic isolation, and historical disinvestment. (Inclusive, Equitable)\nSuccess Measures\nMeasuring success will include structured Pre/Post Knowledge demonstrations. Assessments will include traditional food identification exercises (plants, preparation methods, and seasonal harvesting protocols); healthy local grown foods identification; demonstrations of safe harvesting and preparation skills; accurate use of Yurok language words for traditional foods; and the ability to explain Yurok cultural teachings and food sovereignty concepts in their own words. By program completion, at least 80% of students will correctly identify five or more native foods and know their cultural significance within Yurok food systems.(Realistic)","smartie_goal_2":"From October 2026 to September 2027 (Timebound), our program will advance the integration of traditional foods practices, locally grown healthy foods, land stewardship, and Indigenous ecological knowledge into classroom instruction and on-campus programming in at least 4 schools across Humboldt and Del Norte Counties that have historically excluded Indigenous knowledge systems from formal curriculum. By the end of the grant period, at least 10 classroom teachers will collaborate with Tribal educators, elders, program staff, and cultural knowledge keepers to co-develop and implement a minimum of three culturally grounded lesson units, and 80% of participating teachers will integrate at least one traditional food, locally grown healthy food, or land-based activity into ongoing classroom or campus instruction. At least 70% of participating students will verbally demonstrate increased interest in traditional ecological knowledge and food sovereignty during reflection circles or workshop discussions, and at least six teachers or school sites will formally request continued or expanded programming for the following academic year. (Strategic, Measurable, Ambitious, Realistic) Curriculum development and delivery will be co-led by Tribal elders, cultural practitioners, youth leaders, program staff, and Tribal educators to ensure authenticity, cultural integrity, and community-defined priorities guide classroom integration. This goal embeds Indigenous food systems, locally grown healthy foods, and land stewardship knowledge into schools that have historically marginalized Native perspectives, directly addressing educational inequities and food access barriers while creating culturally affirming spaces for Tribal youth (Inclusive, Equitable)\nSuccess Measures\nProgress will be seen in the ways teachers and schools embrace and continue traditional foods, locally grown healthy foods and land stewardship lessons, through their active participation, requests for ongoing curriculum support, and willingness to bring these teachings into their classrooms regularly. Teachers’ reflections and expressions of appreciation during gatherings and meetings will highlight the value they place on learning from Tribal elders and cultural knowledge keepers. Student engagement and excitement will be observed through their questions, stories, sharing in workshops, and participation in hands-on activities, reflecting deeper connection to traditional ecological knowledge, food sovereignty, and Yurok cultural teachings. (Realistic)","smartie_goal_3":"From October 2026 to September 2027 (Timebound), our program will help reduce food insecurity among 100 Tribal K–12 students in Humboldt and Del Norte Counties by providing opportunities for youth to harvest, prepare, and process traditional foods and locally grown healthy foods during workshops and classroom lessons, and then take these foods home to share with their families. By program end, at least 75% of participating families will receive traditional foods or culturally significant ingredients, and locally grown healthy foods, strengthening household access to healthy, culturally meaningful foods. (Strategic, Measurable, Ambitious) Through hands-on lessons, youth will deepen their connection to Yurok cultural practices, locally grown healthy foods, seasonal harvesting, and food sovereignty, while verbal reflections, family stories, and participation in food-based activities will demonstrate engagement and growing cultural pride. Programming will be co-designed with Tribal elders, cultural knowledge keepers, program staff, and families to ensure youth learning supports both food security and the continuation of intergenerational cultural knowledge. (Inclusive, Equitable)\nSuccess Measures\nProgress will be reflected in the number of youth who actively harvest, prepare, and process traditional foods and locally grown healthy foods during workshops and classroom lessons, and in the proportion of families (at least 75%) receiving these foods to use at home. Student and family engagement will be observed through participation in hands-on activities, sharing stories about using foods at home, and verbal reflections expressing excitement, cultural pride, or connection to Yurok traditions. Additional indicators of impact will include repeated participation in workshops, requests for continued lessons, and youth-led sharing of traditional food knowledge with peers or family members, demonstrating both increased access to healthy foods and strengthened cultural learning. (Realistic)"
