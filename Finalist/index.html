dren under the age of 18.  Learn more in our FAQs . Answer: Indigenous Food Justice: Projects and policy work supporting kids advancing food sovereignty, or engaging with, gathering, growing, and cooking Indigenous foods.\n\nQuestion: Question 2: Innovation     How does your proposed project offer both an innovative and impactful approach that advances food justice for kids?      \"Innovative\" doesn't necessarily mean new technology or a novel approach. Whether rooted in traditional knowledge, adapted from successful models in other communities, or offering a novel approach to persistent challenges, we want to understand what makes your approach unique and why you believe it will create meaningful change.   Please also share any evidence of past results, related outcomes, and/or qualitative or quantitative indicators that demonstrate the promise of your approach. Answer: Wozu advances youth food justice by restoring Indigenous foodways and practical self-sufficiency. Youth learn to cook simple meals, budget and shop, grow and preserve produce, care for bees and chickens, steward buffalo, fish, hunt, process meat, and identify edible plants. Our model reconnects children to the full food cycleâ€”food as relative, not commodityâ€”strengthening cultural identity and responsibility to land.   In the past year, 150+ youth participated in 40+ classes, camps, and field days; 70% returned for multiple sessions. Youth helped harvest 1,000+ pounds of produce, process buffalo and wild game, collect eggs, and preserve meat and honey. Families report increased home cooking, healthier food choices, and greater confidence in traditional practices.\n\nQuestion: Question 3: Community Power     How is your organization and/or project led by, collaborating with, and building power within the community you serve?     For example, how are children, caregivers, school leadership, and other relevant community leaders guiding your project and working in partnership in other aspects of your organizationâ€™s work? Answer: Wozu is community-led and place-based in Cannon Ball, serving the Standing Rock Nation. Our Board is primarily local, and youth, parents, and elders actively shape programming through feedback, participation, and cultural guidance. Children help decide activities, recipes, and land-based learning priorities. Caregivers volunteer, attend classes, and reinforce skills at home. We collaborate with local schools, tribal programs, and community leaders to align youth engagement with cultural values and seasonal practices.   We build power by hiring community members, training youth in leadership roles, and creating workforce pathways in food sovereignty. Rather than delivering services to the community, we develop skills, confidence, and ownership within itâ€”strengthening long-term self-determination.","website":"https://www.wozu.net","smartie_summary":"This organization aims to connect Native youth to culturally-relevant nutrition education through local school partnerships, garden education, and exposure to healthy food.","smartie_goal_1":"Indigenous Food Access & Cultural Nutrition Education \nGoal Statement: From October 2026 to September 2027, Wozu will strengthen Indigenous food justice for children ages 5–14 in Cannon Ball and across Standing Rock by integrating buffalo meat, locally grown produce, and culturally grounded nutrition education into afterschool and community programming. Programming will prioritize Native children from low-income households and will be shaped by youth and caregiver input to ensure cultural relevance and accessibility. \nSuccess Measures: \n• Track youth participation and program consistency across the grant period. \n• Document integration of buffalo and garden produce into programming. \n• Pre- and post-reflection surveys measuring youth understanding of Indigenous food systems, cultural connection to food, and confidence in making healthy food choices. \n• Conduct one community listening session with caregivers and youth to gather qualitative feedback and guide program refinement.","smartie_goal_2":"School & Community Nutrition Partnership Strengthening \nGoal Statement: By September 2027, Wozu will deepen collaboration with local schools and community partners to increase visibility and inclusion of culturally relevant Indigenous foods and food knowledge for children ages 6–17, advancing more equitable school and community food environments. \nSuccess Measures: \n• Document collaborative meetings and shared planning efforts with school or community partners. \n• Track at least two culturally grounded food education events or demonstrations held in partnership settings. \n• Collect qualitative feedback from educators and youth on increased awareness of Indigenous food traditions and healthier food options. \n• Record emerging opportunities or commitments toward longer-term integration of Indigenous foods in school or community settings.","smartie_goal_3":"Regenerative Garden Education & Healthy Food Exposure \nGoal Statement: From October 2026 to September 2027, Wozu will provide hands-on regenerative garden education experiences for children ages 6–16, increasing exposure to fresh fruits and vegetables while reinforcing Indigenous ecological values that position land as relative rather than resource. Programming will center historically underserved Native youth and reduce barriers to culturally affirming food access. \nSuccess Measures: \n• Track number of garden-based educational sessions delivered. \n• Document produce grown and used in youth programming. \n• Pre- and post-participation reflections assessing youth willingness to try fresh foods and understanding of regenerative growing practices. \n• Capture qualitative stories demonstrating increased connection to land, culture, and healthy food.","smartie_goals":["Indigenous Food Access & Cultural Nutrition Education \nGoal Statement: From October 2026 to September 2027, Wozu will strengthen Indigenous food justice for children ages 5–14 in Cannon Ball and across Standing Rock by integrating buffalo meat, locally grown produce, and culturally grounded nutrition education into afterschool and community programming. Programming will prioritize Native children from low-income households and will be shaped by youth and caregiver input to ensure cultural relevance and accessibility. \nSuccess Measures: \n• Track youth participation and program consistency across the grant period. \n• Document integration of buffalo and garden produce into programming. \n• Pre- and post-reflection surveys measuring youth understanding of Indigenous food systems, cultural connection to food, and confidence in making healthy food choices. \n• Conduct one community listening session with caregivers and youth to gather qualitative feedback and guide program refinement.","School & Community Nutrition Partnership Strengthening \nGoal Statement: By September 2027, Wozu will deepen collaboration with local schools and community partners to increase visibility and inclusion of culturally relevant Indigenous foods and food knowledge for children ages 6–17, advancing more equitable school and community food environments. \nSuccess Measures: \n• Document collaborative meetings and shared planning efforts with school or community partners. \n• Track at least two culturally grounded food education events or demonstrations held in partnership settings. \n• Collect qualitative feedback from educators and youth on increased awareness of Indigenous food traditions and healthier food options. \n• Record emerging opportunities or commitments toward longer-term integration of Indigenous foods in school or community settings.","Regenerative Garden Education & Healthy Food Exposure \nGoal Statement: From October 2026 to September 2027, Wozu will provide hands-on regenerative garden education experiences for children ages 6–16, increasing exposure to fresh fruits and vegetables while reinforcing Indigenous ecological values that position land as relative rather than resource. Programming will center historically underserved Native youth and reduce barriers to culturally affirming food access. \nSuccess Measures: \n• Track number of garden-based educational sessions delivered. \n• Document produce grown and used in youth programming. \n• Pre- and post-participation reflections assessing youth willingness to try fresh foods and understanding of regenerative growing practices. \n• Capture qualitative stories demonstrating increased connection to land, culture, and healthy food."],"strategy_1":"Direct Service and Education","strategy_2":"","scope_of_work":"Local","target_age_range":"Elementary - Middle School","special_populations":"Native Youth","location":"Cannon Ball, ND","note":"As a place-based entity, we preserve, nourish and advance the quality of the earth and life for all people and communities, we are planting seeds of change."},{"org":"RurAL CAP","app":"Rural Alaska Food Sovereignty Education Project","name":"Rural Alaska Food Sovereignty Education Project","application_link":"https://portal.justfund.us/f/application/39399","city":"Anchorage","state":"AK","region":"Western","finalist_type":"NOFHumanitix","portfolio":"Indigenous Food Justice","label":"Indigenous Food Justice","focus":"Education, Healthcare / Wellness / Public Health, Housing / Homelessness","strategies":"","scope":"","bipoc":"Yes","tax":"501c3","communities":"","budget":"$49,000,000","annual_budget":"$49,000,000","budget_value":49000000,"budget_bucket":"$25M+","grant_req":"$49,212","grant_request_value":49212,"mission":"To empower low-income Alaskans through advocacy, education, affordable housing, and direct services that respect our unique values and cultures","year_est":"1965","additional_questions":"Question: Question 1: Program Focus     Please check which of the following focus areas are primary elements of the proposed program.      Select the one that is most relevant to your program's focus. This selection will help us with assigning reviewers. Note: All eligible projects must primarily focus on children under the age of 18.  Learn more in our FAQs . Answer: Indigenous Food Justice: Projects and policy work supporting kids advancing food sovereignty, or engaging with, gathering, growing, and cooking Indigenous foods.\n\nQuestion: Question 2: Innovation     How does your proposed project offer both an innovative and impactful approach that advances food justice for kids?      \"Innovative\" doesn't necessarily mean new technology or a novel approach. Whether rooted in traditional knowledge, adapted from successful models in other communities, or offering a novel approach to persistent challenges, we want to understand what makes your approach unique and why you believe it will create meaningful change.   Please also share any evidence of past results, related outcomes, and/or qualitative or quantitative indicators that demonstrate the promise of your approach. Answer: The statewide     Rural Alaska Food Sovereignty Education Pro  ject (RAFSEP)       will   impact   over 400 children ages   3  -18 in approximately 30 communities across Alaska; including Head Start sites, a Child Development Center in Anchorage, and RAY mentee sites. Th  rough this project,   children from   varying communities   will be connected through   a fun, hands-on  , community-based   learning experience that relates to youthâ€™s interests and passions   surrounding   traditional indigenous foods.               RAY y  outh mentees, ages 10-18,   will work closely with their local YAC to design and lead after-school activities, events, or community projects that engage peers and community members.     Project activities may include growing, harvesting, and preparing traditional foods; learning about specific food groups and their local and cultural significance; and creating educational materials for use in Head Start classrooms with younger children.               This project   will   simultaneously   support the development and creation of traditional play food kits     and aligning cultural play   materials for various     Head Start   and childcare   classrooms. RAY youth mentees will be given the opportunity to collaborate on the traditional play foods project as one of their community service focused projects.               This dual-pronged approach allows older youth to choose what their traditional food interests are, encourages them to take on a leadership role within their community, while also encouraging younger, upcoming youth to explore their traditional cultures through play. Providing representative cultural play materials promotes healthy traditional lifestyles and the consumption of subsistence foods which are aligned with   RurAL   CAPâ€™s vision of Healthy People, Sustainable Communities, Vibrant Cultures.\n\nQuestion: Question 3: Community Power     How is your organization and/or project led by, collaborating with, and building power within the community you serve?     For example, how are children, caregivers, school leadership, and other relevant community leaders guiding your project and working in partnership in other aspects of your organizationâ€™s work? Answer: RurAL   CAP   maintains   a strong partnership   and community driven programming with   e  ach commu  nity it serves through consist  ent o  utreach, training and technical   assistance  , and regular travel to rural communities  . Head Start   staff  , from various sites, requested implementing traditional play food kits into their classrooms  .     Based on   RurAL   CAPâ€™s Yupik cultural curriculum and subsistence classroom meals project,   s  taff     provided guidance for the first play food kit   and   included: dried salmon, seal oil, gull eggs, muktuk, clams, and akutaq  .     During   the   February   Head Start In-Services Conference     staff requested more    â€“    or development   of   â€˜phase   twoâ€™     of the     play food kits  . Phase two   kits     will   include   more     food items   and   tools such as ulus, fishing hooks, and baskets to increase dramatic play   and     reflect     traditional local   foods and subsistence activities  .              Interested   RAY program   mentees may   choose to   focus   their quarterly community service project on tra  ditional food and subsistence   efforts  .     As   a part of developing individual   youth mentorship   plans, participants complete an interest form   expressing   their goals and focus   areas. Youth mentees   identified   a strong interest in leading food sovereignty and food security   related     community projects   that addressed their local   needs  .      This   dual serving     project     will   enable     RurAL   CAP to   provide   food sovereignty educational opportunities to each community  .","website":"","smartie_summary":"This organization facilitates youth-led food security projects in rural communities and develops food kits for 21 rural Head Start and Childcare cites.","smartie_goal_1":"RAY program youth mentees will gain a sense of ownership by completing a food security project in their community.\nSuccess Measures\nYouth mentees will identify a food security/sovereignty need in their community that meets their interests. By completing a community project, youth will experience increased confidence, interest, and knowledge related to their traditional foods. RurAL CAP staff will measure success through quarterly assessments with youth mentees and YACs that assess participation, learning, and sense of ownership. Project documentation, including photos, summaries, and feedback, will further measure outcomes and impact.","smartie_goal_2":"Develop phase two play food kits with at least 5 new play foods/cultural play items and distribute to all 21 Rural CAP Head Start and Childcare sites.\nSuccess Measures\nDevelop and design phase two of play kits to include 5 new play foods and/or cultural play items. Survey Head Start staff in the winter of 2026 to ensure that play kits accurately depict local cultures. RurAL CAP’s 21 Head Start sites will receive and incorporate phase two play food and cultural material kits into their classrooms during the 2027 school year. Observation of student interest, product durability, and longevity of food play kits will be kept by RurAL CAP Head Start staff and relayed to Head Start Managers as needed. Any extra or additional materials we will make available to partner organizations like Association of Village Council Presidents (AVCP) Head Starts or Central Council of the Tlingit and Haida Indian Tribes of Alaska (CCTH) Head Starts.","smartie_goal_3":"","smartie_goals":["RAY program youth mentees will gain a sense of ownership by completing a food security project in their community.\nSuccess Measures\nYouth mentees will identify a food security/sovereignty need in their community that meets their interests. By completing a community project, youth will experience increased confidence, interest, and knowledge related to their traditional foods. RurAL CAP staff will measure success through quarterly assessments with youth mentees and YACs that assess participation, learning, and sense of ownership. Project documentation, including photos, summaries, and feedback, will further measure outcomes and impact.","Develop phase two play food kits with at least 5 new play foods/cultural play items and distribute to all 21 Rural CAP Head Start and Childcare sites.\nSuccess Measures\nDevelop and design phase two of play kits to include 5 new play foods and/or cultural play items. Survey Head Start staff in the winter of 2026 to ensure that play kits accurately depict local cultures. RurAL CAP’s 21 Head Start sites will receive and incorporate phase two play food and cultural material kits into their classrooms during the 2027 school year. Observation of student interest, product durability, and longevity of food play kits will be kept by RurAL CAP Head Start staff and relayed to Head Start Managers as needed. Any extra or additional materials we will make available to partner organizations like Association of Village Council Presidents (AVCP) Head Starts or Central Council of the Tlingit and Haida Indian Tribes of Alaska (CCTH) Head Starts."],"strategy_1":"Direct Service and Education","strategy_2":"Youth training and development","scope_of_work":"Local","target_age_range":"All Children Under 18","special_populations":"All Youth","location":"Anchorage, AK","note":"To empower low-income Alaskans through advocacy, education, affordable housing, and direct services that respect our unique values and cultures"},{"org":"Alaska Food Policy Council","app":"Farm to Tray, Fish to Fork: Stories, Procurement Tools, and Policy Solutions for Alaska Students","name":"Farm to Tray, Fish to Fork: Stories, Procurement Tools, and Policy Solutions for Alaska Students","application_link":"https://portal.justfund.us/f/application/40025","city":"Homer","state":"AK","region":"Western","finalist_type":"NOFHumanitix","portfolio":"Nutrition Education & School Food","label":"Nutrition Education & School Food","focus":"Economic Justice, Equitable Development, Food Justice","strategies":"Advocacy, Capacity Building / Org Development, Convening, Culture, Policy, Research","scope":"Regional, State","bipoc":"No","tax":"501c3","communities":"Indigenous, People who are Justice-involved, Rural, Other","budget":"$550,000","annual_budget":"$550,000","budget_value":550000,"budget_bucket":"$500K–$1M","grant_req":"$50,000","grant_request_value":50000,"mission":"The Alaska Food Policy Council connects, advocates, and informs, to strengthen food systems for all Alaskans.    We envision healthy, secure, abundant food systems that feed all Alaskans.     We value integrity and seek to uphold this value as a trustworthy source of information as a nonpartisan organization representing a large network of organizations across the food system.   We value diversity in fostering a culture of inclusion, respect, expanding ideas and perspectives, and minimizing barriers to connection.   We value community and connection: through community-led conversations, we can develop community-led solutions that overcome differences and advance a common good.    We value the ability of Alaskans to make choices about what they eat that support their health and well-being.   We value learning from our past for a better future and learning from others to better ourselves.   We value the abundance of Alaska-grown, harvested, caught, and prepared foods available to all Alaskans.   We value sustainability so that future generations may also experience that abundance.    We value justice and seek to improve equity in the food systems, because everybody eats & everybody deserves full access to food that nourishes both body & soul.    We value the economic development opportunities that food can provide to Alaskan Communities.","year_est":"2014","additional_questions":"Question: Question 1: Program Focus     Please check which of the following focus areas are primary elements of the proposed program.      Select the one that is most relevant to your program's focus. This selection will help us with assigning reviewers. Note: All eligible projects must primarily focus on children under the age of 18.  Learn more in our FAQs . Answer: Nutrition Education & School Food: Projects and policy work supporting kids learning, growing, and cooking healthy and culturally relevant foods; eating nutritious and culturally relevant school meals and integrating local food in schools; or improving access to school meals.\n\nQuestion: Question 2: Innovation     How does your proposed project offer both an innovative and impactful approach that advances food justice for kids?      \"Innovative\" doesn't necessarily mean new technology or a novel approach. Whether rooted in traditional knowledge, adapted from successful models in other communities, or offering a novel approach to persistent challenges, we want to understand what makes your approach unique and why you believe it will create meaningful change.   Please also share any evidence of past results, related outcomes, and/or qualitative or quantitative indicators that demonstrate the promise of your approach. Answer: This project is innovative because it connects three forms of change that are often separated: community storytelling, practical resources, and nonpartisan policy solutions. Alaska does not need a generic farm-to-school model; it needs tools and recommendations shaped by distance, seasonality, fisheries, Tribal and rural food systems, school kitchen capacity, and local supply. AFPC will use trusted statewide networks, including the School Nutrition Working Group, Advocacy Working Group, and Alaska Food Festival & Conference, to gather input, document stories, and turn that knowledge into resources schools and producers can use. This approach builds on AFPCâ€™s proven strategies: shared knowledge repositories, accessible public resources, regular communication spaces, and solutions developed from community expertise. The expected impact is a stronger foundation for schools to buy, serve, and support expanded access to foods that reflect Alaskaâ€™s communities.\n\nQuestion: Question 3: Community Power     How is your organization and/or project led by, collaborating with, and building power within the community you serve?     For example, how are children, caregivers, school leadership, and other relevant community leaders guiding your project and working in partnership in other aspects of your organizationâ€™s work? Answer: AFPC is Alaskaâ€™s only statewide food systems organization working across sectors, geographies, and food system roles. Our working groups include more than 450 members and create spaces where school nutrition professionals, producers, Tribal and rural food systems leaders, agencies, advocates, families, and partners identify priorities, lessons, and action steps. This project will use AFPCâ€™s School Nutrition, Advocacy, and Value Chain Coordination working groups, conference sessions, and listening activities to guide stories, procurement resources, and practical policy solutions. Rather than creating recommendations  for  communities, AFPC will create tools and messages  with  the people closest to school food challenges and opportunities. The project builds power by making knowledge public and usable: stories elevate lived experience, tools help schools and producers act, and recommendations give partners shared language for healthier, more local, and culturally relevant school meals.","website":"https://www.akfoodpolicycouncil.org/","smartie_summary":"This organization employs technical training to provide quality school nutrition education in the state of Alaska -- it does so through stakeholder engagement, resource curation and dissemination, and storytelling.","smartie_goal_1":"Community-informed policy solutions \nFrom October 2026 to September 2027, AFPC will engage at least 75 stakeholders across Alaska, including school nutrition staff, producers, Tribal and rural food systems leaders, caregivers, students where possible, public agency partners, and advocates, to identify barriers and solutions for increasing healthy, local, and culturally relevant foods in school meals for Alaska students ages 5–18. \nInput will be gathered through AFPC working groups, including 10 School Nutrition Working Group sessions, 6 Advocacy Working Group sessions, and 2 Value Chain Coordination sessions; 4 small group listening sessions; and conference-based engagement. AFPC will use this feedback to develop practical, nonpartisan policy recommendations for state and federal school food programs and decision-makers.\nSuccess Measures\nAFPC will track the number and type of participants engaged, geographic representation, number of working group sessions and listening sessions held, major barriers and solutions identified, and completion of a written policy recommendations brief by September 2027. AFPC will also collect participant feedback to assess whether the recommendations reflect community-identified needs, barriers, and opportunities.","smartie_goal_2":"Practical procurement tools \nBy September 2027, AFPC will create or adapt at least 10 practical procurement resources that help Alaska schools and local producers better understand how to buy, sell, and serve local foods in school meals for Alaska students ages 5–18. Resources may include vendor onboarding guidance, sample procurement language, seasonal availability guidance, local fish and seafood procurement considerations, culturally relevant foods considerations, and a “how to buy local food for school meals in Alaska” explainer. These tools will be informed by stakeholder input gathered through working groups, listening sessions, and conference engagement, reviewed by school nutrition and producer partners, and shared publicly through AFPC’s website and partner networks so they can be used across Alaska’s urban, rural, and off-road communities.\nSuccess Measures\nAFPC will track the number and type of tools created or adapted, number of stakeholders who review draft materials, number of tools published or shared publicly, and distribution through AFPC and partner channels. AFPC will also collect feedback from school nutrition staff, producers, and Tribal and rural food systems partners on whether the tools are clear, useful, culturally responsive, and applicable to Alaska’s diverse school and producer contexts.","smartie_goal_3":"Community storytelling for school food change \nBy September 2027, AFPC will produce and share at least 4 community stories or case examples using written narratives, photos, and film to highlight Alaska school food efforts, barriers, and opportunities, with attention to local foods, fish and seafood, culturally relevant foods, and rural or Tribal food systems serving children ages 5–18. These stories will elevate and celebrate lived experience while helping partners, schools, and decision-makers better understand what is needed to expand healthy, local, and culturally relevant school meals.\nSuccess Measures\nAFPC will measure success by tracking the number of stories or case examples completed; the formats produced, including written narratives, photos, and film; the communities, regions, and stakeholder groups represented; and whether stories include local foods, fish and seafood, culturally relevant foods, and rural or Tribal food systems. AFPC will also track distribution through its website, newsletter, social media, conference sessions, working groups, and partner networks. Qualitative feedback from featured participants, school nutrition partners, and community stakeholders will be collected to assess whether the stories accurately reflect lived experience and increase understanding of the barriers, successes, and opportunities for expanding healthy, local, and culturally relevant school meals.","smartie_goals":["Community-informed policy solutions \nFrom October 2026 to September 2027, AFPC will engage at least 75 stakeholders across Alaska, including school nutrition staff, producers, Tribal and rural food systems leaders, caregivers, students where possible, public agency partners, and advocates, to identify barriers and solutions for increasing healthy, local, and culturally relevant foods in school meals for Alaska students ages 5–18. \nInput will be gathered through AFPC working groups, including 10 School Nutrition Working Group sessions, 6 Advocacy Working Group sessions, and 2 Value Chain Coordination sessions; 4 small group listening sessions; and conference-based engagement. AFPC will use this feedback to develop practical, nonpartisan policy recommendations for state and federal school food programs and decision-makers.\nSuccess Measures\nAFPC will track the number and type of participants engaged, geographic representation, number of working group sessions and listening sessions held, major barriers and solutions identified, and completion of a written policy recommendations brief by September 2027. AFPC will also collect participant feedback to assess whether the recommendations reflect community-identified needs, barriers, and opportunities.","Practical procurement tools \nBy September 2027, AFPC will create or adapt at least 10 practical procurement resources that help Alaska schools and local producers better understand how to buy, sell, and serve local foods in school meals for Alaska students ages 5–18. Resources may include vendor onboarding guidance, sample procurement language, seasonal availability guidance, local fish and seafood procurement considerations, culturally relevant foods considerations, and a “how to buy local food for school meals in Alaska” explainer. These tools will be informed by stakeholder input gathered through working groups, listening sessions, and conference engagement, reviewed by school nutrition and producer partners, and shared publicly through AFPC’s website and partner networks so they can be used across Alaska’s urban, rural, and off-road communities.\nSuccess Measures\nAFPC will track the number and type of tools created or adapted, number of stakeholders who review draft materials, number of tools published or shared publicly, and distribution through AFPC and partner channels. AFPC will also collect feedback from school nutrition staff, producers, and Tribal and rural food systems partners on whether the tools are clear, useful, culturally responsive, and applicable to Alaska’s diverse school and producer contexts.","Community storytelling for school food change \nBy September 2027, AFPC will produce and share at least 4 community stories or case examples using written narratives, photos, and film to highlight Alaska school food efforts, barriers, and opportunities, with attention to local foods, fish and seafood, culturally relevant foods, and rural or Tribal food systems serving children ages 5–18. These stories will elevate and celebrate lived experience while helping partners, schools, and decision-makers better understand what is needed to expand healthy, local, and culturally relevant school meals.\nSuccess Measures\nAFPC will measure success by tracking the number of stories or case examples completed; the formats produced, including written narratives, photos, and film; the communities, regions, and stakeholder groups represented; and whether stories include local foods, fish and seafood, culturally relevant foods, and rural or Tribal food systems. AFPC will also track distribution through its website, newsletter, social media, conference sessions, working groups, and partner networks. Qualitative feedback from featured participants, school nutrition partners, and community stakeholders will be collected to assess whether the stories accurately reflect lived experience and increase understanding of the barriers, successes, and opportunities for expanding healthy, local, and culturally relevant school meals."],"strategy_1":"Technical Assistance and Capacity Building","strategy_2":"Direct Service and Education","scope_of_work":"State","target_age_range":"Adults Serving Children Under 18","special_populations":"All Youth","location":"Homer, AK","note":"The Alaska Food Policy Council connects, advocates, and informs, to strengthen food systems for all Alaskans.    We envision healthy, secure, abundant food systems that feed all Alaskans.     We value integrity and seek to uphold this value as a trustworthy source of information as a nonpartisan organization representing a large network of organizations across the food system.   We value diversity in fostering a culture of inclusion, respect, expanding ideas and perspectives, and minimizing barriers to connection.   We value community and connection: through community-led conversations, we can develop community-led solutions that overcome differences and advance a common good.    We value the ability of Alaskans to make choices about what they eat that support their health and well-being.   We value learning from our past for a better future and learning from others to better ourselves.   We value the abundance of Alaska-grown, harvested, caught, and prepared foods available to all Alaskans.   We value sustainability so that future generations may also experience that abundance.    We value justice and seek to improve equity in the food systems, because everybody eats & everybody deserves full access to food that nourishes both body & soul.    We value the economic development opportunities that food can provide to Alaskan Communities."},{"org":"Frankfort Independent Schools","app":"Embedding Food Literacy Education in a KY Public Elementary School: Nourising our Students through Classroom, Cafeteria, and Community Collaboration","name":"Embedding Food Literacy Education in a KY Public Elementary School: Nourising our Students through Classroom, Cafeteria, and Community Collaboration","application_link":"https://portal.justfund.us/f/application/40157","city":"Frankfort","state":"KY","region":"Southeast","finalist_type":"NOFHumanitix","portfolio":"Nutrition Education & School Food","label":"Nutrition Education & School Food","focus":"Education","strategies":"Education","scope":"Local","bipoc":"No","tax":"Public School / Government Entity","communities":"Black, Immigrant, Latino / Latina / Latinx, People with Disabilities, Youth, Youth: High School","budget":"$19,150,000","annual_budget":"$19,150,000","budget_value":19150000,"budget_bucket":"$5M–$25M","grant_req":"$50,000","grant_request_value":50000,"mission":"Frankfort Independent Schools is a community-based school district, committed to academic excellence, personal achievement, and professional integrity. We provide learning opportunities in a caring, safe, and healthy environment responsive to each student in collaboration with families and community.","year_est":"1867","additional_questions":"Question: Question 1: Program Focus     Please check which of the following focus areas are primary elements of the proposed program.      Select the one that is most relevant to your program's focus. This selection will help us with assigning reviewers. Note: All eligible projects must primarily focus on children under the age of 18.  Learn more in our FAQs . Answer: Nutrition Education & School Food: Projects and policy work supporting kids learning, growing, and cooking healthy and culturally relevant foods; eating nutritious and culturally relevant school meals and integrating local food in schools; or improving access to school meals.\n\nQuestion: Question 2: Innovation     How does your proposed project offer both an innovative and impactful approach that advances food justice for kids?      \"Innovative\" doesn't necessarily mean new technology or a novel approach. Whether rooted in traditional knowledge, adapted from successful models in other communities, or offering a novel approach to persistent challenges, we want to understand what makes your approach unique and why you believe it will create meaningful change.   Please also share any evidence of past results, related outcomes, and/or qualitative or quantitative indicators that demonstrate the promise of your approach. Answer: FoodPrints at Second Street School builds on the documented success of the FRESHFARM FoodPrints model to provide joyful hands-on cooking, eating and gardening experiences for students while increasing their food literacy.    In FoodPrints class at Second Street School, food is a lens through which we explore nutrition, biology, geoscience, geography, economics, history, chemistry, math and more. In addition to growing, cooking and eating together, we examine the food prints - the evidence of the many ways that food has shaped and been shaped by our world and ourselves - so that we can better understand our past and present and work together to create a future in which we can all thrive.    One of the strengths of Frankfort Independentâ€™s farm to school work and the districtâ€™s FoodPrints at Second Street School is its integration with our community and local food system.   In 2019, as our community faced the closure of Frankfortâ€™s only downtown grocery store and a new downtown master plan that displaced the local farmers market, concerned citizens and community leaders gathered for a two-day Local Foods, Local Places action planning session. A shared focus on keeping the farmers market downtown, establishing school gardens, and making fresh foods more accessible in local schools and for local residents of all income levels emerged from these conversations. These priorities have served as a throughline for local farmers and farmers market organizers, city officials, school leaders, and a diverse range of local organizations.   In the intervening seven years, through the detours, creative collaboration, and tensions that come with doing real work in real community, Frankfort has built a more robust local food system:       As of April 2026, the local farmers market relocated to a brand new, larger pavilion that is even more accessible to downtown residents with limited income. Frankfortâ€™s farmers market is a statewide leader in expanding fresh food access, connecting with local workplaces through weekly online sales and deliveries, and facilitating local food purchasing for local schools. The market is a source of over $500,000 in annual sales for local producers and provides over $60,000 of fresh food each year to community members with limited income through a range of fresh food access programs.       Local food entrepreneurs opened Locals Food Hub and Pizza Pub in downtown Frankfort in 2021 to build a model for a combined restaurant and local grocery that grows the market for local farmers while expanding fresh food access. Since 2021, Locals has opened a second location, spent over 2 million dollars with over 240 Kentucky producers, and offered a range of fresh food access programs for community members with limited income.       The 525 Kitchen, a local non-profit community kitchen, opened in downtown Frankfort in 2021 with the mission of growing Kentucky food businesses through providing incubator space and business start-up support. The 525 Kitchen also provides cooking classes for youth and adults.       Local organizations collaborated to bring opioid settlement funds to Frankfort. Fresh food access was included as one element of the ecosystem of community support. The local farmers market currently works with local organizations to use Franklin County ASAP funds to provide fresh food vouchers to connect people impacted by the opioid epidemic to local food and community.       The farmers market and Locals Food Hub partner with the statewide food and farming non-profit organization, Community Farm Alliance, to pilot a community â€˜food as medicineâ€™ FreshRX program where expectant moms with WIC or Medicaid get funds each week to shop for fresh produce and more at either Locals Food Hub or the farmers market.       Frankfort Independent Schoolsâ€™ farm to school efforts have developed alongside Frankfortâ€™s broader food system work. This on-going collaboration extends FISâ€™ capacity to source local foods from a diverse range of small and mid-scale producers and connects FIS students and families with the local food system and fresh food access opportunities. Our students take field trips to local farms and the farmers market and then eat the food from those farms in the cafeteria. Some of them walk to the Farmers Market on Kids Day Saturdays to engage in fun activities and shop with their $2 of kids tokens - or they stop by Locals Food Hub with their grown-up to pick up FreshRX tokens and perhaps enjoy a free slice of locally-sourced pizza courtesy of a generous community member. They can use their Yes Cards to take cooking classes at the 525 Kitchen or attend 4-H Camp.   Starting in 2021, FIS engaged students to install school gardens at both Frankfort High School and Second Street School. FIS also started sourcing fresh fruits and vegetables from local farms to serve in the cafeteria. Now, each year, students look forward to shucking fresh corn on the cob and then eating it in the cafeteria. Local watermelon, lettuce, peppers, cilantro, and cherry tomatoes are favorite staples in the cafeteria when they are in season.    Second Street School began offering an afterschool garden club in 2022, and it grew to become one of the most popular clubs at the school. The studentsâ€™ enthusiasm for fresh, local foods and for cooking classes and â€œgarden club every dayâ€ demonstrated their hunger for more experiences like these. FoodPrints class at Second Street School grew from this student engagement.   Starting in the 2024-2025 school year, Second Street School added FoodPrints class to the extension rotation along with art, music, Chinese, gym, and library. Now, 95% of K-8 Second Street School students participate in almost weekly FoodPrints classes each year. The FoodPrints team engages students to grow food in school gardens, cook & eat nutritious food, and learn through lessons tied to math, science, writing, and social studies. Second Street School students are building the skills to grow, cook, eat, and enjoy nutritious foods, deepening their knowledge of food systems, and regularly sharing food with each other in a joyful, low-pressure environment. See the attached  25-26 FoodPrints at SSS info sheet  for more details.   Through this project, we aim to build on these successes to further expand the use of local foods in school meals by:       Continuing to adapt the FRESHFARM FoodPrints curriculum to fit Second Street Schoolâ€™s extension schedule while we engage 470 K-8 students in 25 hours of hands-on nutrition and food literacy education through a third and into a fourth year of FoodPrints at Second Street School classes.        Including scratch-cooked menu items developed by students through FoodPrints class in school breakfast and lunch one day each week from January 2027 through September 2027.       Collaborating with the Just Say Yes coalition to share the joy of eating nutritious and delicious locally-sourced meals together with families at monthly Parent Cafes.        1. We will build on the strong foundation provided by FRESHFARM FoodPrints work and our regionâ€™s strengths to provide joyful day to day classroom experiences for our students while growing their capacity to understand the world and make nourishing choices. At Second Street School, we are leaning on and learning from the 20 years of work that FRESHFARM in Washington, DC, has invested in developing and implementing the FRESHFARM FoodPrints model. Students with high levels of food literacy demonstrate confidence in their food-related knowledge and skills and thoughtfulness around their food practicesâ€”which equip them to choose, cook, and eat nutritious food in the long run. FRESHFARM and their research partners at George Washington University have demonstrated that the FoodPrints program builds food literacy and increases consumption of fresh fruits and vegetables. See attached  2026 FRESHFARM Food Literacy Research Results .    K-5 FoodPrints at Second Street School classes meet for an hour every sixth day, which is a shorter and more frequent class schedule than the FRESHFARM FoodPrints classes in Washington, DC. This school year, we chose one FRESHFARM FoodPrints lesson or Big Idea, and explored that as a unit that included several class periods and additional science and social studies content that aligned with topics that students were studying in their other classes. For example, our adaptation of the Evolving Foodways lesson included more mapping and study of where foods were first farmed around the world. For the 2026-2027 school year, we will continue to adapt the FoodPrints curriculum to fit Second Street Schoolâ€™s schedule, pacing, and location in the Bluegrass region of central Kentucky. Kentucky has a rich agricultural history and ranks seventh in the number of farms and third in the percentage of those farms that are family owned and operated. Farmer and poet Wendell Berry lives in neighboring Henry County, and Frankfort is the home of Kentucky State University (KSU), an 1890 HBCU land grant institution, which has a legacy of providing agricultural and educational support to Kentuckians with limited access and resources. We will continue to work with KSU and the Kentucky Department of Agriculture, Franklin County Agricultural Extension, and Kentucky Farm to School Network to deepen our programming.   2. Students are tasting and enjoying many different foods in FoodPrints class and asking to eat them in the cafeteria. This project takes a step towards making that a reality. Shifting school food programs towards local sourcing and scratch cooking is hard. Since 2020, Frankfort Independent Schools has worked to incorporate more local foods and scratch cooking in school meals. Food service staff have washed and sorted potatoes of all shapes and sizes, worried that a kid might find a worm in their corn, driven to farms in the half-light of dawn to pick up produce, and explained to students â€“ and staff - why the watermelon is yellow instead of red. The farm to school team has learned what is feasible in district kitchens during the 6 am â€“ 1 pm window each school day when food service staff are busy serving 1100+ meals. We know the complexity that comes with purchasing from 11+ local farms during the year and have repeatedly seen that local produce lasts longer and is appreciated more by the school community. The district has leaned on community partners ranging from land grant universities to non-profit organizations to the parent teacher student association to piece together a patchwork of funding sources to keep charting a better, but often more challenging, course to include more local and fresh foods in the meals the district feeds our kids.    This project grows from these experiences. It reflects our best vision, rooted in local kitchens, farms, classrooms, and past experience to increase student participation and well-being through regularly serving fresh, locally sourced menu items in the cafeteria. Through this project, we will pilot a new part-time staff position, FIS FoodPrints Chef, to support local sourcing and hands-on cooking in the FoodPrints classroom and to connect that work to the school cafeteria by offering scratch-cooked menu items (developed in the FoodPrints classroom) for breakfast and lunch one day every week from January 2027 through September 2027. Food service staff finish work in the school kitchens by 1:30 PM each day; the FIS FoodPrints Chef, with support from food service staff as needed and students when possible, will use existing kitchen infrastructure in the later afternoon to prepare scratch-cooked menu items to serve during each Local Feast Friday. Student feedback and data about student meal participation will be collected to assess the impact of connecting classroom and cafeteria to provide locally sourced scratch-cooked meals and shape the ongoing development of this aspect of the project.   3. We will integrate fresh, locally sourced community meals that highlight the work being done in our FoodPrints classroom and SSS Cafeteria into eight monthly Parent CafÃ©s that will be hosted at Second Street School during the 2026-2027 school year.   Second Street Schoolâ€™s  Parent CafÃ©s  are designed to create meaningful opportunities for families to come together, build relationships, and strengthen connections within our school community. Using a model that was first developed in 2007 and is now implemented around the country, Parent CafÃ©s are a structured, peer-based support model using research-informed frameworks to build family strength, connection, and resilience. Research shows that Parent CafÃ©s strengthen family resilience, reduce social isolation, and build the protective factors that support healthy child development.   FIS partner, the Just Say Yes coalition, headquartered at the Franklin County Health Department, initiated Parent Cafes in 2021 in response to local data and parent input. Just Say Yes leads the communityâ€™s implementation of the gold-standard Icelandic Prevention Model, which utilizes data from annual youth surveys to engage and unite community members, youth-serving professionals, policy-makers and researchers in collaborative actions to prevent youth substance use and improve wellbeing. Data from the inaugural youth survey in 2020 revealed that one of the weakest protective factors within local families was parent-to-parent connection and collaboration. Research shows that such collaboration is protective against substance use and a range of other adverse youth behaviors and outcomes. When Just Say Yes staff shared the survey data with parent groups - including the SSS Parent Teacher Student Association (PTSA) - many caregivers expressed a desire for more opportunities to connect with the caregivers of their childrenâ€™s peers. Four members of the SSS PTSA were among the group of 30 local caregivers and youth-serving professionals that were trained by national experts invited by Just Say Yes in December 2021, and the group has been hosting Parent Cafes at SSS ever since. Participant evaluation surveys show that well over 90% of SSS Cafe attendees report that they felt safe sharing with others, met someone they plan to stay in touch with, learned a new way to handle stress or challenges, and learned something that would help them deal positively with a current parenting challenge.    Just Say Yes has recently secured opioid abatement funding to train more peer facilitators and expand Parent CafÃ©s to monthly grade-level gatherings during the 2026â€“2027 school year. These CafÃ©s will provide a welcoming space for parents and caregivers to engage in guided conversations around topics that matter most to families. This project will build on the momentum of our communityâ€™s Parent CafÃ©s to bring parents and children together around a fresh, locally sourced meal before the CafÃ©. Recipes for all of the menu items will be available for families to take home to support families in cooking and eating together.By combining shared meals with structured dialogue, Parent CafÃ©s will foster a sense of belonging, elevate family voice, and support the well-being of both students and caregivers.   Sustainable and impactful farm to school programs connect classrooms, cafeterias, and the community. These shared meals at the Parent CafÃ©s will showcase menu items that students have developed in the FoodPrints classroom and enjoy in the cafeteria. They will provide a space for families to sit down and share a meal together while embodying the FoodPrints approach to sharing food with each other. This partnership between Second Street Schoolâ€™s FoodPrints program and the Just Say Yes Coalitionâ€™s Parent CafÃ©s highlights Frankfortâ€™s community-based approach to supporting families and kids and building a more just and sustainable local food system.\n\nQuestion: Question 3: Community Power     How is your organization and/or project led by, collaborating with, and building power within the community you serve?     For example, how are children, caregivers, school leadership, and other relevant community leaders guiding your project and working in partnership in other aspects of your organizationâ€™s work? Answer: As we described in our answer to question 2, Frankfortâ€™s farm to school and local food system work is rooted in the communityâ€™s expressed desire for and support of vibrant local farms and school gardens and equitable access to fresh food. The previous answer also describes the role of both youth survey data and parent and caregiver voices in the initiation and implementation of Parent Cafes at SSS. The expansion of Parent Cafes likewise draws on community leadership; experienced Parent Cafe hosts will serve as mentors to the newly-trained caregivers; grade-level teacher leads will work alongside parent hosts on Cafe communications and logistics; and childcare during the Cafes will be provided by school-based club and team coaches/sponsors, thereby introducing younger students to various healthy outlets while providing a fundraising opportunity to support team and club expenses.    Second Street School also focuses on student engagement and agency. Our FoodPrints class was developed in response to student interest. Every day in class, we are exploring the world together with students and supporting them in finding what is nutritious and delicious for them. Through this project, we will engage and empower students with the FRESHFARM FoodPrints model of food education, work with students to develop menu items to serve on Local Feast Fridays, and give students the opportunity to share these foods and their FoodPrints experiences with their families through the Parent CafÃ© meals. The Parent CafÃ© model itself is led by community members and builds community power by connecting parents with each other in physically and emotionally safe spaces where people talk and listen to each other on topics that matter to them. Here in Frankfort, we are working together, in community, to weave a more just and sustainable world where all children can thrive.","website":"https://www.frankfort.kyschools.us/","smartie_summary":"This organization aims to connect youth with nutrition and food literacy education through FoodPrints' Second Street School classes -- these classes offer opportunities for students to prepare, taste, and receive feedback on their own meals to motivate student-led cafeteria menu production.","smartie_goal_1":"From October 2026 through September 2027, continue to adapt the FRESHFARM FoodPrints curriculum to fit Second Street School’s extension schedule and location in Central Kentucky while engaging 470 K-8 students in 25 hours each of hands-on nutrition and food literacy education through a third and into fourth year of FoodPrints at Second Street School classes. Offering on-going FoodPrints at Second Street School classes is an essential piece of accomplishing Goals 2 & 3 of this project.\nSuccess Measures\nWe will maintain a record of FoodPrints class activities and attendance during the project period. Recipes prepared and foods tasted will be tracked by grade level and class. The Building Informed, Thoughtful, Empowered Eaters (BITE) food literacy questionnaire developed and validated by researchers at the George Washington University Milken Institute School of Public Health measures four dimensions of food literacy in children: food systems and nutrition knowledge, confidence in everyday food skills, valuing shared food experiences, and purposeful engagement with food. Second Street School students answered this questionnaire at the beginning and end of the 2024-2025 school year. We look for students’ scores in all four dimensions to increase over the course of this project, and we will administer the questionnaire at the beginning and end of the 2026-2027 school year to assess any changes in these scores. All K-5 students, and all middle school students who are not otherwise engaged in Band or Choir, at Second Street School participate in FoodPrints class. A variety of hands-on & minds-on activities allow a wide range of students to have positive experiences in the class.","smartie_goal_2":"From January 2027 through September 2027, offer weekly Local Feast Fridays in the Second Street School cafeteria (which serves 600 preK-8th grade students) by serving at least one scratch-cooked breakfast menu item (such as butternut squash muffins) and another scratch-cooked lunch menu item (such as quinoa veggie bowls) featuring locally produced produce and proteins with the goal of increasing student meal participation by at least 10% on Local Feast Fridays. K-8th grade students will prepare and taste and provide feedback on these menu items in FoodPrints class before they are introduced in the cafeteria. Students will also create signage and other outreach materials to encourage participation.\nSuccess Measures\nWe will track meal participation rates for each grade level and will also track how many students chose the scratch-cooked menu items. Student reflections on Local Feast Friday menu items will be regularly gathered during FoodPrints classes. At least once a month, student feedback in the cafeteria will be collected by asking students to indicate whether they “loved it”, “liked it ok”, or if it was “not for me today” by disposing of the serving container in the corresponding receptacle. Middle school FoodPrints students and Frankfort High School interns will help tally and track this data. Students regularly ask if their FoodPrints favorites can be served in the cafeteria and accomplishing this goal will demonstrate that the adults in the school are honoring their input. Students will continue to engage in seasonally-aligned cooking and eating activities in FoodPrints class to help adjust and build enthusiasm for existing scratch-cooked menu items and develop new ones to serve on Local Feast Fridays. Students will also be updated on progress towards accomplishing this goal. Frankfort Independent Schools is a CEP district where all students eat breakfast and lunch for free. Increasing participation in school meals, particularly breakfast where current student participation is about 40%, will help ensure that all students are getting adequate nourishment to thrive. Increased participation, especially if school staff choose to buy meals at a higher rate on Local Feast Fridays, will also help bring in additional funds that can be invested in improving school meals.","smartie_goal_3":"From October 2026 - September 2027, the Second Street School FoodPrints team will collaborate with the Just Say Yes coalition to provide accessible, scratch-cooked, locally-sourced meals before eight evening Parent Cafés. The FoodPrints team will engage with students to plan the menu for each grade-level Café and build family interest in attending the Café with the goal of having 10 percent of SSS FoodPrints students attend a Café during the project period. The meals will be structured to give students opportunities to introduce their families to the foods being served and the ways we approach sharing food with each other in FoodPrints class.\n\nSuccess Measures\nWe will track student and family attendance at the Parent Cafés. We will also document examples of students’ demonstration of their developing food literacy through participation in these meals. The Building Informed, Thoughtful, Empowered Eaters (BITE) food literacy questionnaire developed and validated by researchers at the George Washington University Milken Institute School of Public Health measures four dimensions of food literacy in children. Second Street School students answered this questionnaire at the beginning and end of the 2024-2025 school year. One dimension of food literacy evaluated in this questionnaire is valuing shared food experiences. We expect students’ scores in this dimension to increase over the course of this project, and we will administer the questionnaire at the beginning and end of the 2026-2027 school year to assess any changes in these scores. There is no charge for families to attend Parent Cafés or share in the community meal. Th eJust Say Yes Coalition works to train a diverse group of parent facilitators to help all parents feel welcome at Parent Cafés. Free child care is also provided to make the evening gatherings more accessible for families.","smartie_goals":["From October 2026 through September 2027, continue to adapt the FRESHFARM FoodPrints curriculum to fit Second Street School’s extension schedule and location in Central Kentu h grade students will prepare and taste and provide feedback on these menu items in FoodPrints class before they are introduced in the cafeteria. Students will also create signage and other outreach materials to encourage participation.\nSuccess Measures\nWe will track meal participation rates for each grade level and will also track how many students chose the scratch-cooked menu items. Student reflections on Local Feast Friday menu items will be regularly gathered during FoodPrints classes. At least once a month, student feedback in the cafeteria will be collected by asking students to indicate whether they “loved it”, “liked it ok”, or if it was “not for me today” by disposing of the serving container in the corresponding receptacle. Middle school FoodPrints students and Frankfort High School interns will help tally and track this data. Students regularly ask if their FoodPrints favorites can be served in the cafeteria and accomplishing this goal will demonstrate that the adults in the school are honoring their input. Students will continue to engage in seasonally-aligned cooking and eating activities in FoodPrints class to help adjust and build enthusiasm for existing scratch-cooked menu items and develop new ones to serve on Local Feast Fridays. Students will also be updated on progress towards accomplishing this goal. Frankfort Independent Schools is a CEP district where all students eat breakfast and lunch for free. Increasing participation in school meals, particularly breakfast where current student participation is about 40%, will help ensure that all students are getting adequate nourishment to thrive. Increased participation, especially if school staff choose to buy meals at a higher rate on Local Feast Fridays, will also help bring in additional funds that can be invested in improving school meals.","From October 2026 - September 2027, the Second Street School FoodPrints team will collaborate with the Just Say Yes coalition to provide accessible, scratch-cooked, locally-sourced meals before eight evening Parent Cafés. The FoodPrints team will engage with students to plan the menu for each grade-level Café and build family interest in attending the Café with the goal of having 10 percent of SSS FoodPrints students attend a Café during the project period. The meals will be structured to give students opportunities to introduce their families to the foods being served and the ways we approach sharing food with each other in FoodPrints class.\n\nSuccess Measures\nWe will track student and family attendance at the Parent Cafés. We will also document examples of students’ demonstration of their developing food literacy through participation in these meals. The Building Informed, Thoughtful, Empowered Eaters (BITE) food literacy questionnaire developed and validated by researchers at the George Washington University Milken Institute School of Public Health measures four dimensions of food literacy in children. Second Street School students answered this questionnaire at the beginning and end of the 2024-2025 school year. One dimension of food literacy evaluated in this questionnaire is valuing shared food experiences. We expect students’ scores in this dimension to increase over the course of this project, and we will administer the questionnaire at the beginning and end of the 2026-2027 school year to assess any changes in these scores. There is no charge for families to attend Parent Cafés or share in the community meal. Th eJust Say Yes Coalition works to train a diverse group of parent facilitators to help all parents feel welcome at Parent Cafés. Free child care is also provided to make the evening gatherings more accessible for families."],"strategy_1":"Youth training and development","strategy_2":"Direct Service and Education","scope_of_work":"Local","target_age_range":"Elementary - Middle School","special_populations":"All Youth","location":"Frankfort, KY","note":"Frankfort Independent Schools is a community-based school district, committed to academic excellence, personal achievement, and professional integrity. We provide learning opportunities in a caring, safe, and healthy environment responsive to each student in collaboration with families and community."},{"org":"FEAST","app":"Early Roots: Community-Led Nutrition for Young Families","name":"Early Roots: Community-Led Nutrition for Young Families","application_link":"https://portal.justfund.us/f/application/39147","city":"Los Angeles","state":"CA","region":"Western","finalist_type":"NOFHumanitix","portfolio":"Nutrition Education & School Food","label":"Nutrition Education & School Food","focus":"Healthcare / Wellness / Public Health, Food Justice","strategies":"Advocacy, Coalition Building, Direct Service, Leadership Development","scope":"National, Local","bipoc":"Yes","tax":"501c3","communities":"Black, Latino / Latina / Latinx","budget":"$1,016,801","annual_budget":"$1,016,801","budget_value":1016801,"budget_bucket":"$1M–$5M","grant_req":"$50,000","grant_request_value":50000,"mission":"FEASTâ€™s mission is to promote wellness and enrich lives in underserved communities through the power of healthy foods and human connection.   FEAST works to address health disparities that disproportionately impact marginalized communities facing food insecurity and diet-related diseases. Guided by Food, Education, Access, Support, Together (FEAST), we offer free programs that combine nutrition education, cooking demonstrations, and sharing circles, empowering families to improve their physical health and strengthen social connections for overall well-being.","year_est":"2013","additional_questions":"Question: Question 1: Program Focus     Please check which of the following focus areas are primary elements of the proposed program.      Select the one that is most relevant to your program's focus. This selection will help us with assigning reviewers. Note: All eligible projects must primarily focus on children under the age of 18.  Learn more in our FAQs . Answer: Nutrition Education & School Food: Projects and policy work supporting kids learning, growing, and cooking healthy and culturally relevant foods; eating nutritious and culturally relevant school meals and integrating local food in schools; or improving access to school meals.\n\nQuestion: Question 2: Innovation     How does your proposed project offer both an innovative and impactful approach that advances food justice for kids?      \"Innovative\" doesn't necessarily mean new technology or a novel approach. Whether rooted in traditional knowledge, adapted from successful models in other communities, or offering a novel approach to persistent challenges, we want to understand what makes your approach unique and why you believe it will create meaningful change.   Please also share any evidence of past results, related outcomes, and/or qualitative or quantitative indicators that demonstrate the promise of your approach. Answer: Most efforts to improve childhood nutrition focus on children directly â€” school meal programs, pediatric nutrition counseling, food distribution. These approaches are consequential, but they miss the window that matters most. By the time a child enters kindergarten, the eating habits, taste preferences, and feeding relationships that will shape their health for decades are already forming. FEAST's Family Feeding Program is built around a different insight: the most powerful lever for children's nutrition in the earliest years is not the child â€” it is the caregiver.   What makes Family Feeding innovative is the integration of three elements rarely combined: nutrition education tailored to feeding children ages zero to five; weekly grocery gift cards that allow families to practice new skills immediately; and peer-led sharing circles where caregivers process the emotional dimensions of feeding â€” the guilt, the stress, the exhaustion of mealtime conflict. Behavior change is harder when a caregiver is food insecure, isolated, and overwhelmed. Community is not incidental to what we do â€” it is essential to the intervention.   Children are not passive beneficiaries. Sessions open with a child-centered veggie song. Parents receive weekly family food exploration prompts. One session involves children in meal planning and kitchen tasks; another turns a grocery trip into a structured learning experience â€” building the caregiver-child relationship around food, not just what is on the plate.\n\nQuestion: Question 3: Community Power     How is your organization and/or project led by, collaborating with, and building power within the community you serve?     For example, how are children, caregivers, school leadership, and other relevant community leaders guiding your project and working in partnership in other aspects of your organizationâ€™s work? Answer: Community leadership is not a program feature at FEAST â€” it is central to our organizational model. The people FEAST serves are the people who deliver FEAST programs.   Every cohort is facilitated by a trained community Health Educator recruited from the same communities â€” and often the same program cohorts â€” as participants. FEAST's Health Educator Training is a three-day, Community Health Worker (CHW)-aligned certification pathway equipping community members with facilitation skills, nutrition knowledge, and the tools to deliver FEAST curricula with fidelity. This is not a volunteer pipeline. It is a paid workforce development model that creates economic opportunity alongside health impact.   The clearest illustration is Ana, FEAST's Senior Manager of Community Relations and primary Family Feeding facilitator. Ana enrolled as a participant in 2015, trained as a Health Educator, and over the following decade built a career at FEAST. Her trajectory from participant to program leader is exactly what this model is designed to produce.   Participant voice is built into every session through sharing circles â€” a structured, judgment-free space where caregivers share what is working and what is hard. This feedback shapes the curriculum over time. The new parent-child engagement activities planned for 2026-27 are being shaped by this process.","website":"http://www.feastforall.org","smartie_summary":"This organization aims to deliver high-quality nutrition education programs to children and their caregivers, ensuring access to consistent feedback loops,  enhancing child food behaviors, and strengthening child-caregiver relationships.","smartie_goal_1":"Program Delivery \nFrom October 2026 to June 2027, FEAST will deliver 3–4 cohorts of the Family Feeding Program, reaching 45–60 caregivers and an estimated 90–120 children ages 0–5 in low-income communities in Los Angeles, with at least 85% of enrolled participants graduating the full 8-week program. (Strategic, Measurable, Ambitious, Realistic, Time-bound) Cohorts will be facilitated by trained community Health Educators recruited from the same communities FEAST serves — ensuring that program delivery is led by and accountable to the families it seeks to benefit. (Inclusive, Equitable)\nSuccess Measures\nReach: 100% of participants are low to very low income earners and have experienced food insecurity in the last 12 months, as measured by intake forms. \nGraduation rate: Defined as completing 7 of 8 sessions. Tracked per cohort and in aggregate across the grant period.","smartie_goal_2":"Child and Family Outcomes \nBy September 2027, FEAST will demonstrate measurable improvement in child food behaviors and caregiver feeding practices across all Family Feeding cohorts, using pre- and post-program surveys administered to all enrolled caregivers of children ages 0–5 — building on prior program outcomes in which 71% of children increased fruit or vegetable intake and 57% reduced sugar-sweetened beverage consumption. (Strategic, Measurable, Ambitious, Realistic, Time-bound) Findings will be used to strengthen program content and ensure the curriculum continues to reflect the lived realities of the low-income Latino and Black families it serves. (Inclusive, Equitable)\nSuccess Measures\nTools: Pre- and post-program surveys administered to all enrolled participants at program start and close, including the Lifestyle Habit Scale, Social Connectedness Scale, and Rosenberg Self-Esteem Questionnaire. \nTargets: At least 65% of children show increased fruit or vegetable intake; at least 50% of children show reduced sugar-sweetened beverage consumption; at least 35% of caregivers report involving children in cooking always or usually, up from 26% at program start. \nProcess: Surveys administered by the cohort Health Educator at program start and close. Results compiled by program staff in aggregate by September 2027.","smartie_goal_3":"Curriculum Refinement \nBy September 2027, FEAST will use participant feedback and evaluation findings from 2026–27 Family Feeding cohorts to develop and pilot at least one new parent-child engagement activity — strengthening the curriculum's focus on the caregiver-child relationship around food for children ages 0–5. (Strategic, Measurable, Ambitious, Realistic, Time-bound) New activities will be co-developed by Ana, who will draw on what she learns facilitating each cohort — including the common struggles, questions, and patterns she observes among caregivers — to identify where new activities are most needed, ensuring that curriculum refinements reflect the priorities and lived experiences of the low-income Latino and Black families the program serves. (Inclusive, Equitable)\n\nSuccess Measures\nCurriculum development: At least one new parent-child engagement activity developed by Ana based on patterns and common caregiver struggles observed during facilitation, piloted in at least 2 cohorts, and assessed through facilitator observation notes and participant feedback. \nDocumentation: A curriculum change log tracking all additions and modifications made during the grant period, grounded in evaluation findings — building toward a refined, evidence-informed Family Feeding curriculum ready for replication and licensing.","smartie_goals":["Program Delivery \nFrom October 2026 to June 2027, FEAST will deliver 3–4 cohorts of the Family Feeding Program, reaching 45–60 caregivers and an estimated 90–120 children ages 0–5 in low-income communities in Los Angeles, with at least 85% of enrolled participants graduating the full 8-week program. (Strategic, Measurable, Ambitious, Realistic, Time-bound) Cohorts will be facilitated by trained community Health Educators recruited from the same communities FEAST serves — ensuring that program delivery is led by and accountable to the families it seeks to benefit. (Inclusive, Equitable)\nSuccess Measures\nReach: 100% of participants are low to very low income earners and have experienced food insecurity in the last 12 months, as measured by intake forms. \nGraduation rate: Defined as completing 7 of 8 sessions. Tracked per cohort and in aggregate across the grant period.","Child and Family Outcomes \nBy September 2027, FEAST will demonstrate measurable improvement in child food behaviors and caregiver feeding practices across all Family Feeding cohorts, using pre- and post-program surveys administered to all enrolled caregivers of children ages 0–5 — building on prior program outcomes in which 71% of children increased fruit or vegetable intake and 57% reduced sugar-sweetened beverage consumption. (Strategic, Measurable, Ambitious, Realistic, Time-bound) Findings will be used to strengthen program content and ensure the curriculum continues to reflect the lived realities of the low-income Latino and Black families it serves. (Inclusive, Equitable)\nSuccess Measures\nTools: Pre- and post-program surveys administered to all enrolled participants at program start and close, including the Lifestyle Habit Scale, Social Connectedness Scale, and Rosenberg Self-Esteem Questionnaire. \nTargets: At least 65% of children show increased fruit or vegetable intake; at least 50% of children show reduced sugar-sweetened beverage consumption; at least 35% of caregivers report involving children in cooking always or usually, up from 26% at program start. \nProcess: Surveys administered by the cohort Health Educator at program start and close. Results compiled by program staff in aggregate by September 2027.","Curriculum Refinement \nBy September 2027, FEAST will use participant feedback and evaluation findings from 2026–27 Family Feeding cohorts to develop and pilot at least one new parent-child engagement activity — strengthening the curriculum's focus on the caregiver-child relationship around food for children ages 0–5. (Strategic, Measurable, Ambitious, Realistic, Time-bound) New activities will be co-developed by Ana, who will draw on what she learns facilitating each cohort — including the common struggles, questions, and patterns she observes among caregivers — to identify where new activities are most needed, ensuring that curriculum refinements reflect the priorities and lived experiences of the low-income Latino and Black families the program serves. (Inclusive, Equitable)\n\nSuccess Measures\nCurriculum development: At least one new parent-child engagement activity developed by Ana based on patterns and common caregiver struggles observed during facilitation, piloted in at least 2 cohorts, and assessed through facilitator observation notes and participant feedback. \nDocumentation: A curriculum change log tracking all additions and modifications made during the grant period, grounded in evaluation findings — building toward a refined, evidence-informed Family Feeding curriculum ready for replication and licensing."],"strategy_1":"Direct Service and Education","strategy_2":"","scope_of_work":"Local","target_age_range":"Early Childhood (0-5)","special_populations":"Youth of Color","location":"Los Angeles, CA","note":"FEASTâ€™s mission is to promote wellness and enrich live
