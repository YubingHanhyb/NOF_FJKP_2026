y focus on children under the age of 18.  Learn more in our FAQs . Answer: Nutrition Education & School Food: Projects and policy work supporting kids learning, growing, and cooking healthy and culturally relevant foods; eating nutritious and culturally relevant school meals and integrating local food in schools; or improving access to school meals.\n\nQuestion: Question 2: Innovation     How does your proposed project offer both an innovative and impactful approach that advances food justice for kids?      \"Innovative\" doesn't necessarily mean new technology or a novel approach. Whether rooted in traditional knowledge, adapted from successful models in other communities, or offering a novel approach to persistent challenges, we want to understand what makes your approach unique and why you believe it will create meaningful change.   Please also share any evidence of past results, related outcomes, and/or qualitative or quantitative indicators that demonstrate the promise of your approach. Answer: FFVP snacks differ from the standard, usually whole, fruits and vegetables kids seeâ€“and often ignoreâ€“on the cafeteria line. They are packaged and cut in ways that are appealing to kids. Still, students are not generally interested in trying them, and teachers report that many of the snacks often end up in the trash. STEâ€™s curriculum is intentionally designed to increase consumption of these fruits and vegetables by nurturing a positive classroom food culture where students are encouraged to try foods that might be unfamiliar to them and discuss them in a respectful, open-minded way. Beyond merely presenting the produce snacks, STE trains teachers to invite their students to become â€œExplorersâ€ who take multiple bites, discuss their findings, and record their impressions in â€œproduce passportsâ€. STE has been evaluated/iterated to optimize teacher implementation and has a proven record of impacting student engagement and food behaviors. Last year, across six school districts, students took 23,142 bites of fresh produce, and the percentage of them who were â€œalways willing and excited to try new fruits and vegetables\" increased from 33% to 57%.\n\nQuestion: Question 3: Community Power     How is your organization and/or project led by, collaborating with, and building power within the community you serve?     For example, how are children, caregivers, school leadership, and other relevant community leaders guiding your project and working in partnership in other aspects of your organizationâ€™s work? Answer: Pilot Light has a long history of working with CPS, and is one of a handful of community partners with district-wide impact. In fact, Pilot Light programs have reached nearly 10,000 students in 73 schools across all 17 CPS networks. This is significant and indicates strong demand for Pilot Light's approach and affirms our model's ability to be adapted to different cultural communities and grade levels.    CPS and Pilot Light collaborate on evaluation and the district builds power and voice through regular outreach and engagement efforts. Their annual school food survey goes to everyone (students, parents, dining staff), and data from it and regular student tastings (30 annually) inform FFVP snack selection. CPS' Wellness team connects with school dining teams quarterly to gather qualitative feedback since they can uniquely act as spokespeople for students at their school. This approach keeps lines of communication open and gives dining staff a voice. Similarly, Pilot Light's respect for our educators' insights and expertise is reflected by the ways in which we collect/act on their feedback. It is used to inform professional development and understand our workâ€™s impact in the communities we serve. As a national leader in the food education movement, Pilot Light is also able to offer teachers immersive pathways to food education leadership through conference presentations, curriculum writing, and mentoring.","website":"https://www.pilotlightchefs.org","smartie_summary":"This organization aims to promote snack tastings in an attempt to improve youth behavior about foods, motivating healthy choices and equitable access to fresh vegetables and fruits.","smartie_goal_1":"From January to June 2027, 1,500 students in grades K-5 enrolled in Chicago Public Schools that participate in the USDA Fresh Fruit & Vegetable Program (FFVP) will engage in 28 handson, structured tastings of produce snacks following the proven, curiosity-building activities and tenets of the SnackTime ExplorersTM Program. \nAll 77 Chicago Public Schools that currently participate in FFVP will be eligible for the program. A minimum of 75% of families at these schools qualify for free and reduced-price lunch. We will implement the program at as many schools as the budget allows. If more schools apply for the program during the period than the budget will support, those schools will be placed on the wait list for the 2027-28 school year. \n\nSuccess Measures\nThe Program Coordinator will use an existing program tracker to capture the number of teachers trained (based on attendance at initial training and coaching sessions) Teachers will be trained to track the number of tastings/engagements and bites. Pilot Light’s Evaluation Associate will compile all data and issue reports for each cohort.","smartie_goal_2":"By June 2027, across the 1,500- student cohort, there will be a 25% increase in students who are always willing and excited to try new fruits and vegetables. \nBecause it encourages consumption and exploration of fresh fruits and vegetables among children who may have less access to these foods, The STE program inherently advances food equity. Inclusivity efforts are realized through the provision of Family Letters–in Spanish and English–that are sent home weekly to describe the featured foods and inform parents and caregivers with recipes and cooking tips. CPS also issues an annual school food survey to all stakeholders (students, parents, dining staff) to seek input, solicit feedback, and ensure menus are informed by student voice across the district. CPS provides free breakfast and lunch across the district, and FFVP/STE can help increase participation in this critical food access program that supports academics and child health. \n\n\nSuccess Measures\nWe administer pre- & post-program surveys to teachers and students in each STE cohort. The surveys, based on existing instruments, include demographic questions and 7 Likert scale questions about teacher comfort with STE and children’s interest in trying new fruits and vegetables. All quantitative data is captured in Qualtrics, and reports are issued using analytics. We analyze qualitative responses through inductive coding. Data is used to report how desired outcomes were/were not met and to inform program iterations.","smartie_goal_3":"By June 2027, across the 1,500- student cohort, there will be a 50% increase in students who will teach someone else to try new fruits and vegetables.\nFood advocacy doesn’t just happen. The implementation of STE in CPS will include a requirement for students to teach a peer or family member to try a new fruit or vegetable at home. The teaching of the requirement will be modeled on Pilot Light’s food advocacy projects which are a component of all its programs. Families will be invited to participate and they will be asked to select foods for tastings from the list of FFVP produce snacks on the district calendar. The budget includes a line item for the food that will be sent home to eliminate cost barriers. \n\nSuccess Measures\nExisting survey instruments will be modified to include a question about whether or not the at-home tastings took place. The success of the athome tastings will also be assessed using a Likert scale question.","smartie_goals":["From January to June 2027, 1,500 students in grades K-5 enrolled in Chicago Public Schools that participate in the USDA Fresh Fruit & Vegetable Program (FFVP) will engage in 28 handson, structured tastings of produce snacks following the proven, curiosity-building activities and tenets of the SnackTime ExplorersTM Program. \nAll 77 Chicago Public Schools that currently participate in FFVP will be eligible for the program. A minimum of 75% of families at these schools qualify for free and reduced-price lunch. We will implement the program at as many schools as the budget allows. If more schools apply for the program during the period than the budget will support, those schools will be placed on the wait list for the 2027-28 school year. \n\nSuccess Measures\nThe Program Coordinator will use an existing program tracker to capture the number of teachers trained (based on attendance at initial training and coaching sessions) Teachers will be trained to track the number of tastings/engagements and bites. Pilot Light’s Evaluation Associate will compile all data and issue reports for each cohort.","By June 2027, across the 1,500- student cohort, there will be a 25% increase in students who are always willing and excited to try new fruits and vegetables. \nBecause it encourages consumption and exploration of fresh fruits and vegetables among children who may have less access to these foods, The STE program inherently advances food equity. Inclusivity efforts are realized through the provision of Family Letters–in Spanish and English–that are sent home weekly to describe the featured foods and inform parents and caregivers with recipes and cooking tips. CPS also issues an annual school food survey to all stakeholders (students, parents, dining staff) to seek input, solicit feedback, and ensure menus are informed by student voice across the district. CPS provides free breakfast and lunch across the district, and FFVP/STE can help increase participation in this critical food access program that supports academics and child health. \n\n\nSuccess Measures\nWe administer pre- & post-program surveys to teachers and students in each STE cohort. The surveys, based on existing instruments, include demographic questions and 7 Likert scale questions about teacher comfort with STE and children’s interest in trying new fruits and vegetables. All quantitative data is captured in Qualtrics, and reports are issued using analytics. We analyze qualitative responses through inductive coding. Data is used to report how desired outcomes were/were not met and to inform program iterations.","By June 2027, across the 1,500- student cohort, there will be a 50% increase in students who will teach someone else to try new fruits and vegetables.\nFood advocacy doesn’t just happen. The implementation of STE in CPS will include a requirement for students to teach a peer or family member to try a new fruit or vegetable at home. The teaching of the requirement will be modeled on Pilot Light’s food advocacy projects which are a component of all its programs. Families will be invited to participate and they will be asked to select foods for tastings from the list of FFVP produce snacks on the district calendar. The budget includes a line item for the food that will be sent home to eliminate cost barriers. \n\nSuccess Measures\nExisting survey instruments will be modified to include a question about whether or not the at-home tastings took place. The success of the athome tastings will also be assessed using a Likert scale question."],"strategy_1":"Direct Service and Education","strategy_2":"","scope_of_work":"Local","target_age_range":"Elementary School","special_populations":"All Youth","location":"Chicago, IL","note":"Founded over a decade ago on the belief that equitable access to food education is vital to childrenâ€™s health, agency, and well-being, Pilot Light advances food justice through innovative, school-based programs that center youth as informed decision-makers and advocates. We prioritize serving students in historically under-resourced communities, ensuring all young peopleâ€”regardless of backgroundâ€”have the knowledge and skills to navigate and challenge food system inequities.   Aware of the many demands on our nationâ€™s teachers, Pilot Light supports them with high-quality professional development to integrate culturally relevant, standards-aligned lessons about food into core academic subjects like math and science, thereby eliminating the need for additional instructional time. This sustainable model deepens studentsâ€™ understanding of nutrition, food systems, and their own lived experiences while building real-world connections between classroom learning and the food students encounter dailyâ€”on their lunch trays, at home, and in their rural, suburban, and urban communities. Recent cuts to programs like SNAP-Ed have elevated the importance of Pilot Lightâ€™s work for sustainability and impact, and illuminated our role in filling the resulting gaps.   With Pilot Light, students build critical literacy and STEM skills alongside the ability to make informed food choices, identify food equity barriers, and advocate for more just food environments. Our innovative, food-integrated approach fosters the curiosity and inquiry that inspires youth to become agents of change who advocate for food justice for themselves and future generations."},{"org":"Good Food Collective","app":"From Policy to Plate: Unlocking School Food Justice for Rural Kids","name":"From Policy to Plate: Unlocking School Food Justice for Rural Kids","application_link":"https://portal.justfund.us/f/application/40480","city":"Durango","state":"CO","region":"Mountain Plains","finalist_type":"NOFHumanitix","portfolio":"Nutrition Education & School Food","label":"Nutrition Education & School Food","focus":"Economic Justice, Democracy & Civic Engagement, Food Justice","strategies":"Capacity Building / Org Development, Coalition Building, Convening, Leadership Development, Organizing, Policy","scope":"Regional, Local","bipoc":"No","tax":"501c3","communities":"Immigrant, Indigenous, Latino / Latina / Latinx, Rural, Workers","budget":"$1,550,000","annual_budget":"$1,550,000","budget_value":1550000,"budget_bucket":"$1M–$5M","grant_req":"$49,972","grant_request_value":49972,"mission":"The Good Food Collective catalyzes & supports stakeholders across Southwest Colorado to transform our regional food system so it is more just, resilient, and vibrant. Along with over 180 partners, we are working towards a reality in which farmers, ranchers, & food makers can thrive, all residents are able to access to the food that supports their well-being, and those impacted by the food system are the leaders of its transformation. Our work is focused on policy, sytems, and environmental change, coupled with leadership & capacity development.","year_est":"2018","additional_questions":"Question: Question 1: Program Focus     Please check which of the following focus areas are primary elements of the proposed program.      Select the one that is most relevant to your program's focus. This selection will help us with assigning reviewers. Note: All eligible projects must primarily focus on children under the age of 18.  Learn more in our FAQs . Answer: Nutrition Education & School Food: Projects and policy work supporting kids learning, growing, and cooking healthy and culturally relevant foods; eating nutritious and culturally relevant school meals and integrating local food in schools; or improving access to school meals.\n\nQuestion: Question 2: Innovation     How does your proposed project offer both an innovative and impactful approach that advances food justice for kids?      \"Innovative\" doesn't necessarily mean new technology or a novel approach. Whether rooted in traditional knowledge, adapted from successful models in other communities, or offering a novel approach to persistent challenges, we want to understand what makes your approach unique and why you believe it will create meaningful change.   Please also share any evidence of past results, related outcomes, and/or qualitative or quantitative indicators that demonstrate the promise of your approach. Answer: Our proposal advances food justice by ensuring rural, underresourced school districts can fully access Coloradoâ€™s Healthy School Meals for All, which expands universal free meals and offers new permanent funding for scratch cooking, local procurement, and student-led input. While transformative, the programâ€™s complexity has left many rural School Food Authorities (SFA) eager but unable to participate due to limited staff capacity, procurement relationships, and experience facilitating required advisory councils. This is particularly true in our least resourced, highest needs districts such as San Juan County which has 1 dining staff and a 25.2% childhood food insecurity rate and Towac Charter School run by the Ute Mountain Ute Tribe which experiences food insecurity rates soaring to 85%.   Our Rural School Food Bridge program closes this gap by partnering SFA's with GFC staff who offer embedded hands-on technical assistance, coordinate connections with local producers, and support representative student-parent advisory councils. This approach builds on a two-year LFP pilot between the GFC and 4 SFAâ€™s, 2 regional Farm to School convenings and countless conversations with SFAâ€™s in our region that identified capacityâ€”not commitmentâ€”as the core barrier.   By 2027, we will enable at least 8 of 11 SFAs to participate in the Local Food Purchasing program, reaching approximately 10,500 students, secure $175,000 in local procurement funding, and actively aid in establishing >/= 8 advisory councilsâ€”translating policy into equitable food access, voice, and local economic benefit.\n\nQuestion: Question 3: Community Power     How is your organization and/or project led by, collaborating with, and building power within the community you serve?     For example, how are children, caregivers, school leadership, and other relevant community leaders guiding your project and working in partnership in other aspects of your organizationâ€™s work? Answer: This project is grounded in community leadership and shared ownership. It reflects years of engagement with children, caregivers, school staff, and producers across Southwest Colorado, where those most impacted help shape both the problem and the solution. At its core, our approach is simple: we ask stakeholders,  â€œWhat would it takeâ€¦ for your child to have the nourishment they need? For your farm or ranch to thrive? For your school nutrition program to best serve its students?â€     This proposal is the result of those conversations, informed by 2 regional Farm-to-School convenings, 3 annual cross-sector strategy sessions, a 2-year foundation-funded pilot of the Local Food Purchasing Program with 4 SFA partners, 2 Student-Parent Advisory Council workshops, and ongoing parent and student engagement through meetings, surveys, and listening sessions.   This commitment to stakeholder-led decision-making extends into implementation. A central strategy is the establishment of socioeconomically and racially representative student-parent advisory councils. These are designed as decision-making bodies, not compliance structures, ensuring students and caregiversâ€”especially those experiencing food insecurityâ€”directly influence school meal programs.","website":"https://www.goodfoodcollective.org/","smartie_summary":"This organization aims to increase vendor relationships to enhance their foodsehd program, which increases access to fresh produce in Southwest Colorado.","smartie_goal_1":"From October 2026 to September 2027, our support will enable 8 of 11 School Food Authorities in Southwest Colorado to participate in the Local Food Purchasing Program, increasing access to fresh, nutrient-dense, scratch-cooked meals for approximately 10,500 K–12 students (ages 5–18) with a focus on rural, low-income, and Tribal communities disproportionately impacted by food insecurity. 100% of participating SFA’s will meet CEP income eligibility criteria and are designated as either Rural or Small Rural by the USDA. >/=75% of participating sites will serve student populations with over 50% Free & Reduced qualification rates.\nBy July 2027, we will have supported participating school districts in securing and utilizing at least $155,000 or 60% of available Local Food Purchasing Program funding to procure whole foods from Colorado Proud producers. At least 50% of funds will be used to procure food from vendors operating within our regional foodshed, expanding equitable market access for local farmers and ranchers and strengthening regional food systems that benefit children (ages 5–18) and their communities. Of these local dollars, >/=50% will be spent on socially disadvantaged producers. \nBy May 2027, we will have supported participating school districts to request 75% of available funding (a 15% increase from prior year) through the state’s pre-school year application portal to support local procurement in the 2027-2028 School year\n\nSuccess Measures\nWe will track SFA enrollment and active participation in the Local Food Purchasing Program disaggregated by CEP status and Free & Reduced meal eligibility, along with the number of students reached across participating districts. Pre- and post-data (where available) will be used to assess changes in school meal participation rates.\n* Monthly check-ins with school nutrition staff will document progress, challenges, and capacity gains, while end-of-year surveys will assess staff confidence in sustaining program participation. Qualitative feedback from staff and school leadership will help identify how we can improve or shift our support to be most effective. Student-family surveys administered at the end of the school year in each participating district will assess for change in access to and consumption of fresh, nutrient dense food within school dining. \n*We will partner with the Co Dpt of Education Nutrition unit and our partner SFA’s to utilize their existing data collection and data whenever possible to minimize additional reporting load on SFA’s.\nWe will track the total dollar amount of Local Food Purchasing Program funds that schools requested in their 2026 pre-school applications and compare that against what was actually spent on local procurement, as well as the number of producers engaged in school purchasing during the 2026 school year. Procurement records will be used to assess changes in the volume and diversity of local foods served, as well as, what percentage of funds were used to purchase from regionally-based food vendors. This will be disaggregated to examine spend by SFA and the correlation between where funds were spent and school CEP and Free & Reduced Lunch eligibility\n* We will assess our May 27 goal by aggregating the total amount of LFP funds requested by districts through the CDE application process compared against available funds.\n* Producer surveys and follow-up interviews will capture socially-disadvantaged status as defined by 2024 USDA LFPP, as well as, changes in market access, revenue stability, and perceived barriers to participation. Case studies will document examples of sustained or expanded buyer-producer relationships, highlighting pathways to long-term economic impact. \n*We will partner with the Co Dpt of Education Nutrition Unit and our partner SFA’s to utilize their existing data collection and data whenever possible to minimize additional reporting load on SFA’s.","smartie_goal_2":"","smartie_goal_3":"","smartie_goals":["From October 2026 to September 2027, our support will enable 8 of 11 School Food Authorities in Southwest Colorado to participate in the Local Food Purchasing Program, increasing access to fresh, nutrient-dense, scratch-cooked meals for approximately 10,500 K–12 students (ages 5–18) with a focus on rural, low-income, and Tribal communities disproportionately impacted by food insecurity. 100% of participating SFA’s will meet CEP income eligibility criteria and are designated as either Rural or Small Rural by the USDA. >/=75% of participating sites will serve student populations with over 50% Free & Reduced qualification rates.\nBy July 2027, we will have supported participating school districts in securing and utilizing at least $155,000 or 60% of available Local Food Purchasing Program funding to procure whole foods from Colorado Proud producers. At least 50% of funds will be used to procure food from vendors operating within our regional foodshed, expanding equitable market access for local farmers and ranchers and strengthening regional food systems that benefit children (ages 5–18) and their communities. Of these local dollars, >/=50% will be spent on socially disadvantaged producers. \nBy May 2027, we will have supported participating school districts to request 75% of available funding (a 15% increase from prior year) through the state’s pre-school year application portal to support local procurement in the 2027-2028 School year\n\nSuccess Measures\nWe will track SFA enrollment and active participation in the Local Food Purchasing Program disaggregated by CEP status and Free & Reduced meal eligibility, along with the number of students reached across participating districts. Pre- and post-data (where available) will be used to assess changes in school meal participation rates.\n* Monthly check-ins with school nutrition staff will document progress, challenges, and capacity gains, while end-of-year surveys will assess staff confidence in sustaining program participation. Qualitative feedback from staff and school leadership will help identify how we can improve or shift our support to be most effective. Student-family surveys administered at the end of the school year in each participating district will assess for change in access to and consumption of fresh, nutrient dense food within school dining. \n*We will partner with the Co Dpt of Education Nutrition unit and our partner SFA’s to utilize their existing data collection and data whenever possible to minimize additional reporting load on SFA’s.\nWe will track the total dollar amount of Local Food Purchasing Program funds that schools requested in their 2026 pre-school applications and compare that against what was actually spent on local procurement, as well as the number of producers engaged in school purchasing during the 2026 school year. Procurement records will be used to assess changes in the volume and diversity of local foods served, as well as, what percentage of funds were used to purchase from regionally-based food vendors. This will be disaggregated to examine spend by SFA and the correlation between where funds were spent and school CEP and Free & Reduced Lunch eligibility\n* We will assess our May 27 goal by aggregating the total amount of LFP funds requested by districts through the CDE application process compared against available funds.\n* Producer surveys and follow-up interviews will capture socially-disadvantaged status as defined by 2024 USDA LFPP, as well as, changes in market access, revenue stability, and perceived barriers to participation. Case studies will document examples of sustained or expanded buyer-producer relationships, highlighting pathways to long-term economic impact. \n*We will partner with the Co Dpt of Education Nutrition Unit and our partner SFA’s to utilize their existing data collection and data whenever possible to minimize additional reporting load on SFA’s."],"strategy_1":"Direct Service and Education","strategy_2":"","scope_of_work":"Regional","target_age_range":"Elementary - High School","special_populations":"All Youth","location":"Durango, CO","note":"The Good Food Collective catalyzes & supports stakeholders across Southwest Colorado to transform our regional food system so it is more just, resilient, and vibrant. Along with over 180 partners, we are working towards a reality in which farmers, ranchers, & food makers can thrive, all residents are able to access to the food that supports their well-being, and those impacted by the food system are the leaders of its transformation. Our work is focused on policy, sytems, and environmental change, coupled with leadership & capacity development."}];

  const rows = pool();
  const portfolio = countBy('portfolio',false,rows);
  let h = `<div class="hdr"><div><div class="eyebrow">2026 Prize Cycle · Finalist Analysis</div><h1>Food Justice for Kids Prize — Finalists</h1><div class="sub">Budget, geography, portfolio, and strategy patterns across the finalist pool.</div></div><div class="hdr-right"><div class="stat"><div class="sv">${fmt(rows.length)}</div><div class="sl">Current Pool</div></div>`;
  PORTFOLIO_ORDER.filter(p=>portfolio[p]!==undefined).forEach(p=>{ h += `<div class="stat" style="border-top-color:${PORTFOLIO_COLORS[p]}"><div class="sv">${fmt(portfolio[p])}</div><div class="sl">${esc(PORTFOLIO_SHORT[p]||p)}</div></div>`; });
  h += `</div></div>`;
  h += `<div class="filter-label">Portfolio</div><div class="pfilter">${PORTFOLIOS.map(p=>`<button class="pbtn ${S.portfolio===p?'on':''}" style="${filterStyle('portfolio',p)}" data-value="${esc(p)}" onclick="setPortfolio(this.dataset.value)">${esc(labelForPortfolio(p))}</button>`).join('')}</div>`;
  h += `<div class="filter-label">Finalist Type</div><div class="pfilter groupfilter">${GROUPS.map(g=>`<button class="pbtn ${S.finalistType===g?'on':''}" style="${filterStyle('group',g)}" data-value="${esc(g)}" onclick="setFinalistType(this.dataset.value)">${esc(g==='All'?'All Finalist Types':g)}</button>`).join('')}</div>`;
  h += `<div class="tabs">${[['overview','Overview'],['geography','Geography'],['focus','Focus & Strategy'],['profile','Org Profile'],['search','Search Applications']].map(([k,l])=>`<button class="tab ${S.tab===k?'on':''}" onclick="setTab('${k}')">${l}</button>`).join('')}</div><div id="tabcontent"></div>`;
  document.getElementById('app').innerHTML=h; renderTab();
}
function setTab(t){ S.tab=t; render(); }
function setPortfolio(p){ S.portfolio=p; render(); }
function setFinalistType(g){ S.finalistType=g; render(); }
function renderTab(){
  const el=document.getElementById('tabcontent');
  if(S.tab==='overview') el.innerHTML=rOverview();
  if(S.tab==='geography') el.innerHTML=rGeography();
  if(S.tab==='focus') el.innerHTML=rFocus();
  if(S.tab==='profile') el.innerHTML=rProfile();
  if(S.tab==='search') el.innerHTML=rSearch();
  if(S.tab==='overview') iOverview();
  if(S.tab==='geography') iGeography();
  if(S.tab==='focus') iFocus();
  if(S.tab==='profile') iProfile();
  if(S.tab==='search') iSearch();
}

function rOverview(){
  const rows=pool();
  return `<div class="g2"><div class="cb"><h3>Target Age Range</h3><div class="cm">${fmt(rows.length)} finalist applications in the current filter</div><div class="cw tall"><canvas id="ov_age"></canvas></div></div><div class="cb"><h3>Program Strategies</h3><div class="cm">How finalist organizations do their work</div><div class="cw tall"><canvas id="ov_strat"></canvas></div></div></div><div class="g3"><div class="cb"><h3>Region</h3><div class="cm">Current finalist pool</div><div class="cw short"><canvas id="ov_region"></canvas></div></div><div class="cb"><h3>Annual Budget</h3><div class="cm">Organization annual budget</div><div class="cw short"><canvas id="ov_budget"></canvas></div></div><div class="cb"><h3>Organization Type</h3><div class="cm">Tax status</div><div class="cw short"><canvas id="ov_tax"></canvas></div></div></div><div class="footnote">The dashboard uses Annaliese's synthesized program strategies, scope, age range, and population fields; original broad focus/strategy fields remain archived in the exported records.</div>`;
}
function hbar(canvasId,items){
  const el=document.getElementById(canvasId); if(!el)return; if(CH[canvasId])CH[canvasId].destroy();
  const data=items.slice().reverse();
  CH[canvasId]=new Chart(el,{type:'bar',data:{labels:data.map(d=>d.k),datasets:[{data:data.map(d=>d.v),backgroundColor:activeColorBg(),borderRadius:4,barThickness:14}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>fmt(c.raw)}}},scales:{x:{grid:{color:'#F1F0EC'},ticks:{color:'#948E86',font:{size:10}}},y:{grid:{display:false},ticks:{color:'#55504A',font:{size:10.5}}}}}});
}
function donut(canvasId,items){
  const el=document.getElementById(canvasId); if(!el)return; if(CH[canvasId])CH[canvasId].destroy();
  const keys=items.map(d=>d.k), vals=items.map(d=>d.v); const palette=['#3F8F4F','#C88A16','#E0532E','#6FA8C9','#6BAE73','#EBC069','#EC8567','#9DC5DC','#2E6B3B','#201D1A'];
  CH[canvasId]=new Chart(el,{type:'doughnut',data:{labels:keys,datasets:[{data:vals,backgroundColor:palette,borderColor:'#fff',borderWidth:2}]},options:{responsive:true,maintainAspectRatio:false,cutout:'62%',plugins:{legend:{position:'bottom',labels:{boxWidth:10,font:{size:9.5},color:'#55504A'}}}}});
}
function iOverview(){ hbar('ov_age',topItems('target_age_range',false,8)); hbar('ov_strat',topStrategies(8)); donut('ov_region',topItems('region',false,99)); donut('ov_budget',budgetItems()); donut('ov_tax',topItems('tax',false,99)); }

function rGeography(){
  const states=topItems('state',false,999), regions=topItems('region',false,999), max=Math.max(...states.map(d=>d.v),1); let paths='';
  for(const name in STATE_PATHS){ const v=dataStateVal(name); const fill=v===0?null:shade(activeColor(),Math.max(v/max,.14)); paths+=`<path class="${v===0?'empty':''}" d="${STATE_PATHS[name]}" fill="${fill||''}" onmousemove="mapTip(event,'${name}',${v})" onmouseleave="mapTipHide()"></path>`; }
  const stateRows=states.map((d,i)=>`<tr><td>${i+1}</td><td>${esc(d.k)}</td><td class="numcell"><div class="brow"><div class="brack"><div class="bfill" style="width:${d.v/max*100}%;background:${activeColor()}"></div></div><span>${fmt(d.v)}</span></div></td></tr>`).join('');
  const regionRows=regions.map((d,i)=>`<tr><td>${i+1}</td><td>${esc(d.k)}</td><td class="numcell">${fmt(d.v)}</td><td class="numcell">${(d.v/(pool().length||1)*100).toFixed(1)}%</td></tr>`).join('');
  return `<div class="g2"><div class="cb"><h3>Applications by State</h3><div class="cm">Hover a state for its count.</div><div class="mapwrap"><svg id="usmap" viewBox="0 0 975 610" xmlns="http://www.w3.org/2000/svg">${paths}</svg><div class="maptip" id="maptip"></div></div><div class="legend"><span>Fewer</span><div class="lbar" style="background:linear-gradient(90deg,${shade(activeColor(),.14)},${activeColor()})"></div><span>More</span></div></div><div class="cb"><h3>Region Summary</h3><div class="cm">${fmt(pool().length)} applications across ${regions.length} regions</div><div class="tw"><table><thead><tr><th>#</th><th>Region</th><th style="text-align:right">Applications</th><th style="text-align:right">Share</th></tr></thead><tbody>${regionRows||'<tr><td colspan="4">No region data</td></tr>'}</tbody></table></div><h3 style="margin-top:22px">Ranked by State</h3><div class="tw st-scroll"><table><thead><tr><th>#</th><th>State</th><th style="text-align:right">Applications</th></tr></thead><tbody>${stateRows}</tbody></table></div></div></div><div class="footnote">Region is taken from the workbook's Region column. States/territories are shown in the ranked list; the map covers the 50 states plus DC.</div>`;
}
function shade(hex,pct){ const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16),mix=(c,bg)=>Math.round(bg+(c-bg)*pct); return `rgb(${mix(r,247)},${mix(g,247)},${mix(b,245)})`; }
function mapTip(e,name,v){ const tip=document.getElementById('maptip'); if(!tip)return; const wrap=tip.parentElement.getBoundingClientRect(); tip.style.left=(e.clientX-wrap.left)+'px'; tip.style.top=(e.clientY-wrap.top)+'px'; tip.innerHTML=`${esc(name)}: <b>${fmt(v)}</b>`; tip.style.opacity=1; }
function mapTipHide(){ const tip=document.getElementById('maptip'); if(tip)tip.style.opacity=0; }
function iGeography(){}

function rFocus(){ return `<div class="cb" style="margin-bottom:16px"><h3>Focus Areas</h3><div class="cm">Original focus-area selections from the application; these remain available while the analyst categories are refined.</div><div class="cw tall" style="height:460px"><canvas id="fc_focus"></canvas></div></div><div class="cb"><h3>Program Strategies</h3><div class="cm">Annaliese's synthesized Strategy 1 and Strategy 2, with a maximum of two strategies per organization.</div><div class="cw tall" style="height:300px"><canvas id="fc_strat"></canvas></div></div><div class="cb"><h3>Special Populations Served</h3><div class="cm">The primary populations served by finalist projects.</div><div class="cw tall" style="height:260px"><canvas id="fc_special"></canvas></div></div><div class="footnote">Focus areas are retained as source analysis. Strategy counts use the synthesized strategy fields from the finalist mapping.</div>`; }
function iFocus(){ hbar('fc_focus',topItems('focus',true)); hbar('fc_strat',topStrategies()); hbar('fc_special',topItems('special_populations',false)); }

function rProfile(){ const budget=budgetItems(); return `<div class="g3"><div class="cb"><h3>Organization Type</h3><div class="cm">Tax status</div><div class="cw"><canvas id="pf_tax"></canvas></div></div><div class="cb"><h3>BIPOC-Led</h3><div class="cm">Self-reported application field</div><div class="cw"><canvas id="pf_bipoc"></canvas></div></div><div class="cb"><h3>Scope</h3><div class="cm">Geographic scope of work</div><div class="cw"><canvas id="pf_scope"></canvas></div></div></div><div class="g2"><div class="cb"><h3>Annual Budget Range</h3><div class="cm">Organization annual budget, not grant request</div><div class="tw"><table><thead><tr><th>Range</th><th style="text-align:right">Applications</th><th style="text-align:right">Share</th></tr></thead><tbody>${budget.map(d=>`<tr><td>${esc(d.k)}</td><td class="numcell">${fmt(d.v)}</td><td class="numcell">${(d.v/(pool().length||1)*100).toFixed(1)}%</td></tr>`).join('')}</tbody></table></div></div><div class="cb"><h3>Organization Type — detail</h3><div class="cm">Current pool</div><div class="tw"><table><thead><tr><th>Type</th><th style="text-align:right">Count</th><th style="text-align:right">Share</th></tr></thead><tbody>${detailRows('tax')}</tbody></table></div></div></div>`; }
function detailRows(field){ const items=topItems(field,false,999), total=pool().length||1; return items.map(d=>`<tr><td>${esc(d.k)}</td><td class="numcell">${fmt(d.v)}</td><td class="numcell">${(d.v/total*100).toFixed(1)}%</td></tr>`).join(''); }
function iProfile(){ donut('pf_tax',topItems('tax',false,99)); donut('pf_bipoc',topItems('bipoc',false,99)); donut('pf_scope',topItems('scope',true,99)); }

function rSearch(){ const rows=pool(); return `<div class="cb"><h3>Search Applications</h3><div class="cm">Search by organization, application, city, state, or region — ${fmt(rows.length)} applications in the current pool</div><div class="searchbox"><input type="text" id="appsearch" placeholder="Type an organization or application name…" value="${esc(S.query)}" oninput="onSearchInput(this.value)"></div><div id="searchresults"></div></div>`; }
function onSearchInput(v){ S.query=v; renderResults(); }
function renderResults(){ const el=document.getElementById('searchresults'); if(!el)return; const rows=pool(true), poolSize=pool().length; const note=norm(S.query)?`${fmt(rows.length)} match${rows.length===1?'':'es'} in the current pool${rows.length>50?' (showing first 50)':''}`:`Showing first 50 of ${fmt(poolSize)} applications in the current pool — start typing to narrow`; el.innerHTML=rows.length?`<div class="searchcount">${note}</div><div class="applist">${rows.slice(0,50).map((a,i)=>appCard(a,i)).join('')}</div>`:`<div class="searchcount">${note}</div><div class="noresults">No applications match “${esc(S.query)}”</div>`; }
function appCard(a,i){ const p=a.portfolio||a.label||'', ptag=p?`<span class="tag portfolio-tag" style="background:${PORTFOLIO_COLORS[p]||'#6FA8C9'};color:#fff">${esc(labelForPortfolio(p))}</span>`:'', g=a.finalist_type?`<span class="tag group-tag" style="background:${GROUP_COLORS[a.finalist_type]||'#6B7280'};color:#fff">${esc(a.finalist_type)}</span>`:'', loc=[a.city,a.state].filter(Boolean).join(', '); return `<div class="appcard" id="card_${i}" onclick="toggleCard(${i})"><div class="aname">${esc(a.app||'(untitled application)')}</div><div class="aorg">${esc(a.org)}</div><div class="ameta">${ptag}${g}${loc?`<span class="tag loc">${esc(loc)}</span>`:''}${a.region?`<span class="tag loc">${esc(a.region)}</span>`:''}${a.year_est?`<span class="tag loc">Est. ${esc(a.year_est)}</span>`:''}</div><div class="appdetail"><dt>Annual Budget / Grant Requested</dt><dd>${esc(a.budget||fmtMoney(a.budget_value)||'—')} / ${esc(a.grant_req||'—')}</dd><dt>Mission</dt><dd>${esc(a.mission||'—')}</dd><dt>SMARTIE Goals Summary</dt><dd>${esc(a.smartie_summary||'—')}</dd><dt>Program Strategies</dt><dd>${esc([a.strategy_1,a.strategy_2].filter(Boolean).join(' · ')||'—')}</dd><dt>Scope of Work</dt><dd>${esc(a.scope_of_work||'—')}</dd><dt>Target Age Range</dt><dd>${esc(a.target_age_range||'—')}</dd><dt>Special Populations Served</dt><dd>${esc(a.special_populations||'—')}</dd>${a.smartie_goals&&a.smartie_goals.length?`<details class="goal-details" onclick="event.stopPropagation()"><summary>View original SMARTIE goals</summary><div class="goal-body">${a.smartie_goals.map((g,j)=>`<div class="goal-item"><strong>Goal ${j+1}</strong><br>${esc(g).replace(/\n/g,'<br>')}</div>`).join('')}</div></details>`:''}<dt>Tax Status</dt><dd>${esc(a.tax||'—')}</dd><dt>BIPOC-Led</dt><dd>${esc(a.bipoc||'—')}</dd>${a.additional_questions?`<dt>Additional Application Information</dt><dd>${esc(a.additional_questions).replace(/\n/g,'<br>')}</dd>`:''}${a.application_link?`<dt>Application</dt><dd><a href="${esc(a.application_link)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Open application ↗</a></dd>`:''}</div></div>`; }
function toggleCard(i){ const card=document.getElementById('card_'+i); if(card)card.classList.toggle('open'); }
function iSearch(){ renderResults(); }

render();

</script>
</body>
</html>
