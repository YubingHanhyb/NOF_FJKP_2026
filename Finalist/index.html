<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Template</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  --bg:#FFFFFF; --panel:#FFFFFF; --panel2:#F7F7F5; --border:#E7E5E0;
  --ink:#201D1A; --ink2:#55504A; --ink3:#948E86;
  --nesf:#3F8F4F; --nesf-bg:rgba(63,143,79,.10);
  --ifj:#E0A22E;  --ifj-bg:rgba(224,162,46,.14);
  --both:#E0532E; --both-bg:rgba(224,83,46,.12);
  --all:#6FA8C9; --all-bg:rgba(111,168,201,.14);
  --white:#FFFFFF;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased}
.app{max-width:1360px;margin:0 auto;padding:28px 24px 60px}

.hdr{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:22px;flex-wrap:wrap;border-bottom:1px solid var(--border);padding-bottom:20px}
.hdr .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin-bottom:6px}
.hdr h1{font-family:'Fraunces',serif;font-size:30px;font-weight:600;letter-spacing:-.3px;line-height:1.1}
.hdr .sub{font-size:13px;color:var(--ink2);margin-top:6px;max-width:520px}
.hdr-right{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:10px 16px;text-align:center;min-width:92px}
.stat .sv{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:600}
.stat .sl{font-size:10px;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em;margin-top:2px}
.stat.n .sv{color:var(--nesf)} .stat.i .sv{color:var(--ifj)} .stat.b .sv{color:var(--both)}

.pfilter{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.pbtn{font-family:'Inter',sans-serif;font-size:12px;font-weight:600;padding:7px 16px;border-radius:999px;border:1px solid var(--border);background:var(--panel);color:var(--ink2);cursor:pointer;transition:all .15s}
.pbtn:hover{border-color:var(--ink3)}
.pbtn.on{color:#fff;border-color:transparent}
.pbtn.on[data-value="All"]{background:var(--panel2);color:var(--ink);border-color:var(--ink3)}
.pbtn.on[data-p="All"]{background:var(--all);color:#1B3242}
.pbtn.on[data-p="NESF"]{background:var(--nesf)}
.pbtn.on[data-p="IFJ"]{background:var(--ifj)}
.pbtn.on[data-p="Both"]{background:var(--both)}

.tabs{display:flex;gap:2px;margin-bottom:20px;background:var(--panel2);padding:4px;border-radius:10px;border:1px solid var(--border);width:fit-content;flex-wrap:wrap}
.tab{padding:8px 16px;border-radius:7px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--ink3);border:none;background:none;transition:all .15s;font-family:'Inter',sans-serif}
.tab:hover{color:var(--ink)}
.tab.on{background:var(--ink);color:#fff}

.g2{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;margin-bottom:16px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:16px}
@media(max-width:900px){.g2,.g3{grid-template-columns:1fr}}
.cb{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:18px}
.cb h3{font-size:13.5px;font-weight:700;margin-bottom:3px;color:var(--ink)}
.cb .cm{font-size:11px;color:var(--ink3);margin-bottom:14px}
.cw{position:relative;height:300px}
.cw.tall{height:400px}
.cw.short{height:220px}

.mapwrap{position:relative}
#usmap{width:100%;height:auto;display:block}
#usmap path{stroke:#fff;stroke-width:1.2;cursor:pointer;transition:opacity .1s}
#usmap path:hover{opacity:.72}
#usmap path.empty{fill:#E4E2DC}
.maptip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;font-size:11.5px;padding:6px 10px;border-radius:6px;transform:translate(-50%,-115%);white-space:nowrap;opacity:0;transition:opacity .1s;font-family:'Inter',sans-serif;z-index:10}
.maptip b{font-family:'IBM Plex Mono',monospace}
.legend{display:flex;align-items:center;gap:8px;justify-content:center;margin-top:10px;font-size:10.5px;color:var(--ink3)}
.legend .lbar{width:140px;height:8px;border-radius:4px}
.mapnote{font-size:10.5px;color:var(--ink3);text-align:center;margin-top:4px}

.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3);font-weight:700;padding:6px 8px;border-bottom:1px solid var(--border);cursor:pointer;white-space:nowrap}
th:hover{color:var(--ink)}
td{padding:6px 8px;border-bottom:1px solid var(--panel2);white-space:nowrap}
tr:hover td{background:var(--panel2)}
.numcell{font-family:'IBM Plex Mono',monospace;text-align:right}
.st-scroll{max-height:420px;overflow-y:auto}

.brow{display:flex;align-items:center;gap:8px}
.brack{width:60px;height:6px;border-radius:3px;background:var(--panel2);overflow:hidden}
.bfill{height:100%;border-radius:3px}

.footnote{font-size:11px;color:var(--ink3);margin-top:10px;line-height:1.5}

/* search */
.searchbox{position:relative;margin-bottom:16px}
.searchbox input{width:100%;padding:12px 16px;font-size:14px;border:1.5px solid var(--border);border-radius:10px;font-family:'Inter',sans-serif;color:var(--ink);outline:none;transition:border-color .15s}
.searchbox input:focus{border-color:var(--all)}
.searchcount{font-size:11px;color:var(--ink3);margin-top:6px}
.applist{display:flex;flex-direction:column;gap:10px}
.appcard{border:1px solid var(--border);border-radius:10px;padding:14px 16px;cursor:pointer;transition:border-color .15s}
.appcard:hover{border-color:var(--ink3)}
.appcard .aname{font-weight:700;font-size:13.5px;color:var(--ink)}
.appcard .aorg{font-size:11.5px;color:var(--ink2);margin-top:1px}
.appcard .ameta{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.tag{font-size:10px;font-weight:600;padding:3px 8px;border-radius:5px}
.tag.n{background:var(--nesf-bg);color:var(--nesf)}
.tag.i{background:var(--ifj-bg);color:var(--ifj)}
.tag.b{background:var(--both-bg);color:var(--both)}
.tag.loc{background:var(--panel2);color:var(--ink2)}
.appdetail{border-top:1px solid var(--border);margin-top:10px;padding-top:10px;font-size:12px;color:var(--ink2);display:none;line-height:1.6}
.appcard.open .appdetail{display:block}
.appdetail dt{font-weight:700;color:var(--ink);margin-top:8px;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em}
.appdetail dt:first-child{margin-top:0}
.appdetail dd{margin-top:2px}
.noresults{text-align:center;color:var(--ink3);padding:40px 0;font-size:13px}

.filter-label{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin:12px 0 6px}
.groupfilter{margin-bottom:2px}
.groupfilter .pbtn{border-radius:999px}
.tabs{margin-top:8px}
.region-table td,.region-table th{padding:7px 9px}
.appdetail a{color:#356fa8;text-decoration:underline}


.filter-label{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin:12px 0 6px}
.groupfilter{margin-bottom:2px}
.groupfilter .pbtn{border-radius:999px}
.region-table td,.region-table th{padding:7px 9px}
.appdetail a{color:#356fa8;text-decoration:underline}


.goal-details{margin-top:12px;border-top:1px solid var(--border);padding-top:8px}.goal-details summary{cursor:pointer;font-weight:700;color:var(--ink);font-size:11px}.goal-body{margin-top:8px}.goal-item{padding:8px 0;border-top:1px solid var(--border);font-size:11.5px;line-height:1.55}.goal-item strong{color:var(--ink)}
</style>
</head>

const APPS = [{"org":"Hunger Solutions New York","app":"Maximizing and leveraging Universal School Meals","name":"Maximizing and leveraging Universal School Meals","application_link":"https://portal.justfund.us/f/application/40506","city":"Albany","state":"NY","region":"Northeast","finalist_type":"H2HC","portfolio":"Nutrition Education & School Food","label":"Nutrition Education & School Food","focus":"Education, Healthcare / Wellness / Public Health, Food Justice","strategies":"Advocacy, Coalition Building, Communications & Media, Direct Service, Education, Policy","scope":"State","bipoc":"Yes","tax":"501c3","communities":"People with Disabilities, Seniors, Veterans, Women, Workers, Youth","budget":"$14,266,460","annual_budget":"$14,266,460","budget_value":14266460,"budget_bucket":"$5M–$25M","grant_req":"$100,000","grant_request_value":100000,"mission":"Hunger Solutions New York is a statewide nonprofit organization dedicated to alleviating hunger.","year_est":"1988","additional_questions":"Question: Question 1: Program Focus     Please check which of the following focus areas are primary elements of the proposed program.      Select the one that is most relevant to your program's focus. This selection will help us with assigning reviewers. Note: All eligible projects must primarily focus on children under the age of 18.  Learn more in our FAQs . Answer: Nutrition Education & School Food: Projects and policy work supporting kids learning, growing, and cooking healthy and culturally relevant foods; eating nutritious and culturally relevant school meals and integrating local food in schools; or improving access to school meals.\n\nQuestion: Question 2: Innovation     How does your proposed project offer both an innovative and impactful approach that advances food justice for kids?      \"Innovative\" doesn't necessarily mean new technology or a novel approach. Whether rooted in traditional knowledge, adapted from successful models in other communities, or offering a novel approach to persistent challenges, we want to understand what makes your approach unique and why you believe it will create meaningful change.   Please also share any evidence of past results, related outcomes, and/or qualitative or quantitative indicators that demonstrate the promise of your approach. Answer: Our project advances food justice for children by maximizing and leveraging New Yorkâ€™s new universal school meals policy. Hunger Solutions New York was proud to co-lead the coalition that secured this historic investment, expanding free school meals to 2.7 million New York students. Funding from the Newmanâ€™s Own Foundation will allow us to continue our work to support strong implementation, leverage federal funding streams, and expand complementary nutrition programs to fully realize the promise of this investment.   Our approach is innovative because we integrate multiple federal nutrition programs, creating a comprehensive and sustainable support system for families and schools. We support schools in increasing awareness of and participation in free meals, maximizing direct certification to strengthen the financial sustainability of universal free school meals, promoting SNAP and WIC enrollment, and adopting innovative service models such as Breakfast After the Bell, afterschool meals, and summer nutrition programs.   These strategies are often implemented in isolation; our project integrates them into a cohesive system that increases reach across the full continuum of child nutrition.   A key innovation of this model is its alignment of outreach, program participation, and policy levers. For example, by increasing SNAP enrollment and direct certification rates, schools can strengthen their eligibility for federal programs like the Community Eligibility Provision (CEP), which streamlines operations and sustains universal meal access in the long term.   This creates a feedback loop in which school meals, SNAP, and other nutrition programs reinforce one another, expanding both immediate access and structural sustainability.   Our work is also deeply rooted in advocacy and systems change. We will continue to partner with state agencies, schools, and coalitions to ensure strong implementation of universal school meals, protect and sustain state investment, and advance policies that expand year-round access to nutrition programs. This includes supporting compliance with new requirements, such as New Yorkâ€™s requirement that all schools conduct SNAP outreach to families, and elevating on-the-ground insights from schools and families to inform future policy improvements.   The impact of this approach is both immediate and long-term. Evidence shows that universal school meals reduce stigma, increase participation, improve student health, and enhance readiness to learn. In New York, 71% of school professionals report reduced student hunger, and over 80% report improved health and nutrition outcomes when meals are free to all.   By coupling this proven model with targeted implementation support and policy alignment, our project ensures that more children not only have access to meals but also consistently benefit from them throughout the school day, after school, and during the summer.   Ultimately, this project advances food justice by transforming universal school meals from a policy into a fully realized, equitable system, one that removes barriers, centers dignity, and ensures that every child has reliable access to the nutrition they need to learn, grow, and thrive.\n\nQuestion: Question 3: Community Power     How is your organization and/or project led by, collaborating with, and building power within the community you serve?     For example, how are children, caregivers, school leadership, and other relevant community leaders guiding your project and working in partnership in other aspects of your organizationâ€™s work? Answer: Our work is rooted in partnership with schools, families, and community leaders to ensure universal school meals are implemented in ways that reflect real community needs. At Hunger Solutions New York, school leaders and frontline staff are key co-designers of this work. We work collaboratively with school districts, helping them adopt strategies such as Breakfast After the Bell, strengthen direct certification, implement strong SNAP outreach and referral systems, and expand afterschool and summer meals.   Hunger Solutions New York regularly gathers feedback from families, school administrators, and school food service directors, adapting our strategies and resources to meet evolving needs. Currently, we are launching surveys of students and parents to learn more about their experiences during the inaugural year of universal school meals to identify barriers and facilitators to participation. Funding for this project will enable us to use this direct feedback to tailor our resources, technical assistance, and advocacy efforts to meet community needs.   We also collaborate with statewide coalitions and state agencies, elevating feedback from schools and families to inform policy and strengthen implementation of universal school meals. We have played a key role in advancing and sustaining these policies by connecting on-the-ground experiences to advocacy efforts.   This approach builds community power by equipping schools and families not just to access meals, but to shape and sustain the systems behind them. Strengthening school meals and increasing SNAP participation reinforce program funding and expand access for all students, ensuring that communities directly influence and benefit from long-term, systemic change.","website":"https://hungersolutionsny.org/","smartie_summary":"Hunger Solutions New York aims to increase SNAP outreach, free school meal awareness, and meal programs beyond the school day. They intend to do so through the distribution of outreach and technical resources, along with direct technical support to schools.","smartie_goal_1":"Increase SNAP Outreach Through Schools PreK through 12\nOver the course of the 12-month grant period, we will promote school-focused SNAP outreach resources to all New York schools participating in the National School Lunch Program through at least two email blasts to our child nutrition network, one webinar, and one communication distributed through an education-focused partner network (i.e., membership associations for school nutrition directors, principals, or superintendents). We will solicit feedback on outreach resources, including any gaps in our toolkit, and develop new resources to ensure schools are fully equipped for strong SNAP outreach.\nSuccess Measures\nSuccess will be measured by the reach and uptake of SNAP outreach resources across New York schools, including the number of schools engaged, webinar participation, and partner dissemination. We will track how many schools integrate SNAP messaging into family communications, as well as referrals to prescreening tools. Feedback from schools will inform improvements to outreach materials, with attention to accessibility, cultural responsiveness, and effectiveness in reaching high-need communities.","smartie_goal_2":"Increase Awareness of and Participation in Free School Meals\nOver the course of the 12-month grant period, we will share outreach resources promoting universal free school meals, including toolkits for schools and community partners, as well as social media campaigns during National School Lunch Week and National School Breakfast Week. We will also conduct outreach and provide individualized technical assistance to help move schools implement Breakfast After the Bell service models to make meals more accessible for students (4-18). \nSuccess Measures\nSuccess will be measured by increased awareness and participation in school meal programs, including engagement with outreach campaigns and the number of schools implementing Breakfast After the Bell or similar strategies. We will track changes in meal participation rates, particularly in historically under-participating schools, as well as the number of students gaining improved access to school breakfast. Qualitative feedback will help assess reductions in stigma and barriers to participation.","smartie_goal_3":"Expand Meal Programs Beyond the School Day\nBy the end of the grant period, we will promote summer and afterschool meal programs to potentially eligible schools through at least three email blasts, one webinar, and one communication distributed through an education-focused partner network. We will provide one-on-one technical assistance to schools interested in launching or expanding these programs.\nSuccess Measures\nSuccess will be measured by the number of schools engaged in outreach and technical assistance, and the number that launch or expand afterschool and summer meal programs. We will track increases in participation and the number of children served, with a focus on expanding access in underserved areas. Additional measures will reduce barriers to access, such as improved awareness and availability in high-need communities.","smartie_goals":["Increase SNAP Outreach Through Schools PreK through 12\nOver the course of the 12-month grant period, we will promote school-focused SNAP outreach resources to all New York schools participating in the National School Lunch Program through at least two email blasts to our child nutrition network, one webinar, and one communication distributed through an education-focused partner network (i.e., membership associations for school nutrition directors, principals, or superintendents). We will solicit feedback on outreach resources, including any gaps in our toolkit, and develop new resources to ensure schools are fully equipped for strong SNAP outreach.\nSuccess Measures\nSuccess will be measured by the reach and uptake of SNAP outreach resources across New York schools, including the number of schools engaged, webinar participation, and partner dissemination. We will track how many schools integrate SNAP messaging into family communications, as well as referrals to prescreening tools. Feedback from schools will inform improvements to outreach materials, with attention to accessibility, cultural responsiveness, and effectiveness in reaching high-need communities.","Increase Awareness of and Participation in Free School Meals\nOver the course of the 12-month grant period, we will share outreach resources promoting universal free school meals, including toolkits for schools and community partners, as well as social media campaigns during National School Lunch Week and National School Breakfast Week. We will also conduct outreach and provide individualized technical assistance to help move schools implement Breakfast After the Bell service models to make meals more accessible for students (4-18). \nSuccess Measures\nSuccess will be measured by increased awareness and participation in school meal programs, including engagement with outreach campaigns and the number of schools implementing Breakfast After the Bell or similar strategies. We will track changes in meal participation rates, particularly in historically under-participating schools, as well as the number of students gaining improved access to school breakfast. Qualitative feedback will help assess reductions in stigma and barriers to participation.","Expand Meal Programs Beyond the School Day\nBy the end of the grant period, we will promote summer and afterschool meal programs to potentially eligible schools through at least three email blasts, one webinar, and one communication distributed through an education-focused partner network. We will provide one-on-one technical assistance to schools interested in launching or expanding these programs.\nSuccess Measures\nSuccess will be measured by the number of schools engaged in outreach and technical assistance, and the number that launch or expand afterschool and summer meal programs. We will track increases in participation and the number of children served, with a focus on expanding access in underserved areas. Additional measures will reduce barriers to access, such as improved awareness and availability in high-need communities."],"strategy_1":"Technical Assistance and Capacity Building","strategy_2":"Direct Service and Education","scope_of_work":"State","target_age_range":"Elementary - High School","special_populations":"All Youth","location":"Albany, NY","note":"Hunger Solutions New York is a statewide nonprofit organization dedicated to alleviating hunger."},{"org":"Plant Powered School Meals Coalition | Plant Powered Youth Fellowship","app":"Youth-led Advocacy for Healthy, Sustainable, and Inclusive School Meals","name":"Youth-led Advocacy for Healthy, Sustainable, and Inclusive School Meals","application_link":"https://portal.justfund.us/f/application/40688","city":"Orlando","state":"FL","region":"Southeast","finalist_type":"H2HC","portfolio":"Nutrition Education & School Food","label":"Nutrition Education & School Food","focus":"Environmental Justice / Climate Justice / Nature, Democracy & Civic Engagement, Food Justice","strategies":"Advocacy, Coalition Building, Education, Leadership Development, Movement Building, Policy","scope":"National, State","bipoc":"Not sure","tax":"501c3","communities":"Asian or Asian American / AAPI, Black, Indigenous, Latino / Latina / Latinx, People of African Descent, Youth","budget":"$574,557","annual_budget":"$574,557","budget_value":574557,"budget_bucket":"$500K–$1M","grant_req":"$100,000","grant_request_value":100000,"mission":"The  Plant Powered School Meals Coalition  (PPSMC) is the only national coalition focused specifically on expanding nutritious and delicious plant-based, culturally relevant meals and beverages in U.S. K-12 schools while centering students as leaders, strategists, and advocates for change. The Coalitionâ€™s work is grounded in the belief that school meals cannot be truly just, inclusive, nor nutritious unless the voices of the students most impacted by them are at the center of decision-making and those meals meet the needs of every student.","year_est":"2020","additional_questions":"Question: Question 1: Program Focus     Please check which of the following focus areas are primary elements of the proposed program.      Select the one that is most relevant to your program's focus. This selection will help us with assigning reviewers. Note: All eligible projects must primarily focus on children under the age of 18.  Learn more in our FAQs . Answer: Nutrition Education & School Food: Projects and policy work supporting kids learning, growing, and cooking healthy and culturally relevant foods; eating nutritious and culturally relevant school meals and integrating local food in schools; or improving access to school meals.\n\nQuestion: Question 2: Innovation     How does your proposed project offer both an innovative and impactful approach that advances food justice for kids?      \"Innovative\" doesn't necessarily mean new technology or a novel approach. Whether rooted in traditional knowledge, adapted from successful models in other communities, or offering a novel approach to persistent challenges, we want to understand what makes your approach unique and why you believe it will create meaningful change.   Please also share any evidence of past results, related outcomes, and/or qualitative or quantitative indicators that demonstrate the promise of your approach. Answer: Our approach is innovative because it redefines who drives change in school food systems:  students are not just participants or beneficiaries, but experts by experience  who are strategists, advocates, and decisionmakers shaping both cafeteria offerings and national policy. While many programs focus on adult-led reform, the  Plant Powered School Meals Coalition (PPSMC) builds a coordinated, youth-led pipeline that connects local school-level change with state and federal advocacy that supports healthy, culturally responsive, sustainable, and inclusive K-12 menus.    Through the Coalitionâ€™s Plant Powered Youth Fellowship and Student Wing, students lead campaigns to expand and promote plant-based meals and non-dairy options, which are often severely lacking with fewer than 5% of school lunch entrees being plant-based. Students campaign in their own schools while also influencing broader policy and narrative change and learning about the school food system, including the impacts of colonization and racist food policies on historically marginalized communities. Our strategy linking on-the-ground implementation with education and systems-level advocacy is what enables scalable impact.   We have already demonstrated meaningful, tangible results. Students have engaged directly with decision makers in Congress, the U.S. Department of Agriculture, and the White House.  Fellows were integral in securing passage of a federal law allowing schools to serve non-dairy milk in schools, a critical nutrition equity win, and in securing improvements to USDAâ€™s nutrition standards that better facilitate plant-forward, culturally relevant menus.      At the local level, fellows have secured concrete menu changes in their districts.  For example, one student in Brookline, MA won a  commitment to offer plant-based options daily, with a long-term goal of reaching 50% plant-based offerings by 2027 . This initiative includes sourcing from local growers. Another fellow successfully advocated for the creation of a  Dietary Inclusion Council  in her district, alongside expanded culturally relevant plant-based menu options and a districtwide rollout of non-dairy milkâ€”improving access and inclusion for thousands of students. Alumni have launched the  Plant-Based Peers  initiative to support their peers in running successful school meal change campaigns.    Beyond these discrete wins, students are shaping national narratives around school food through media engagement, op-eds, blogs, peer outreach, and other advocacy strategies. Together, these outcomes demonstrate a model that not only delivers immediate improvements in school meals but also builds long-term momentum for systemic change driven by the next generation of eaters.\n\nQuestion: Question 3: Community Power     How is your organization and/or project led by, collaborating with, and building power within the community you serve?     For example, how are children, caregivers, school leadership, and other relevant community leaders guiding your project and working in partnership in other aspects of your organizationâ€™s work? Answer: Our work is grounded in the principle that those most affected by school food systems - students - should have real power in shaping them. The Coalition is designed to build that power by embedding students in leadership roles across our programs and governance structures, while also fostering strong partnerships with parents, school food professionals, and community-based organizations leading the work.    Students receive stipends, mentorship, training, education, and peer support to design and lead campaigns that reflect their lived experiences and community needs. These campaigns are often deeply personalâ€”driven by cultural or religious food preferences, dietary restrictions such as lactose intolerance, or experiences of exclusion within school meal programs. By centering these lived experiences, our work ensures that solutions are responsive, relevant, and equitable.   Students are not only leading campaigns but also shaping organizational strategy. They hold dedicated seats on the Coalitionâ€™s Steering Committee and serve in formal leadership roles, including co-leading the Student Wing. These structures ensure that students have meaningful decision-making power over priorities, programming, and advocacy strategies.   We intentionally prioritize engagement of Black, Indigenous, and students of the Global Majority (of color), as well as students from households with low-income who rely on school meals or have experienced hunger, recognizing that these groups are both most impacted by inequities and historically excluded from decision-making spaces. Our leadership pathways are designed to elevate these voices and support long-term leadership development.   Our broader coalition, now spanning 53 organizations and over 100 individual members across 23 states, works in partnership to support student-led change. This includes collaboration with school districts, nonprofit partners, and national advocates who provide technical assistance, policy expertise, and implementation support.   Together, this model builds durable community power: students gain the skills, confidence, knowledge, and platforms to advocate for change in their own schools and beyond, while institutions begin to shift toward more inclusive, responsive, and participatory decision-making.","website":"https://www.plantpoweredschoolmeals.com/about-the-program","smartie_summary":"Plant Powered School Meals aims to train the next generation of leaders through technical assistance and mentorship. Aimed at collaborating with BIPOC youth, this organization exposes young people to the political sphere to expand their understanding of food systems and advocacy work.","smartie_goal_1":"Student-Led Menu Change\nFrom October 2026 – September 2027, at least 10-14 high school students (ages 14-18) from across the U.S. participating in our program successfully expand, improve, or promote plant-based or non-dairy menu items in their schools. Students will receive culturally responsive training, stipends, mentorship, and technical assistance to implement student-defined campaign goals aligned with community needs and district constraints.\nWe will track: Number of students completing the program Number of schools or districts implementing new or expanded plant-based entrées or non-dairy options, Number of students impacted Type and scope of menu changes (e.g., new item added, increased frequency, default changes, marketing/promotion) Student-reported outcomes, including perceived improvements in access, inclusion, and meal satisfaction","smartie_goal_2":"Inclusive Student Engagement & BIPOC Leadership\nFrom October 2026 - September 2027,, we meaningfully engage at least 50 school students, the majority of whom will be Black, Indigenous, youth of the Global Majority (of color) (BIPGM) and students relying on free or reduced price school meals, through the coalition’s student-led efforts. Engagement will include participation in the Student Wing, Fellowship, Working Groups, Steering Committee membership, and advocacy activities with intentional outreach to students historically excluded from decision-making.\nWe will track: Number of students engaged (including age, race/ethnicity, and geography) Percentage of engaged students who are BIPGM and/or eligible for free or reduced-price meals Number of students participating in leadership roles (e.g., Fellows, Student Wing co-leads, Steering Committee members) Participation and retention rates across programs (attendance, completion, continued engagement) Student feedback demonstrating increased leadership skills, sense of belonging, and ability to influence school food decisions","smartie_goal_3":"Student-Driven Policy Change\nFrom October 2026 – September 2027, the Coalition will elevate student-led non-lobbying policy advocacy to influence federal and state school meal policies, ensuring that the lived experiences of students are reflected in decision-making processes and policy outcomes. The Coalition will support students to participate in advocacy meetings, submit public comments, and engage in campaigns that advance more inclusive, plant-forward, and culturally relevant school meals.\nWe will track: Number of students participating in policy advocacy activities (meetings, briefings, sign-on letters, public comments) Number of student-informed policy recommendations submitted to federal and/or state agencies Meetings held with key decision-makers (e.g., USDA, state agencies) Evidence of student perspectives reflected in policy discussions, agency communications, or guidance (e.g., meeting notes, memos, public statements) Progress toward specific policy changes (e.g., USDA’s meal pattern updates)","smartie_goals":["Student-Led Menu Change\nFrom October 2026 – September 2027, at least 10-14 high school students (ages 14-18) from across the U.S. participating in our program successfully expand, improve, or promote plant-based or non-dairy menu items in their schools. Students will receive culturally responsive training, stipends, mentorship, and technical assistance to implement student-defined campaign goals aligned with community needs and district constraints.\nWe will track: Number of students completing the program Number of schools or districts implementing new or expanded plant-based entrées or non-dairy options, Number of students impacted Type and scope of menu changes (e.g., new item added, increased frequency, default changes, marketing/promotion) Student-reported outcomes, including perceived improvements in access, inclusion, and meal satisfaction","Inclusive Student Engagement & BIPOC Leadership\nFrom October 2026 - September 2027,, we meaningfully engage at least 50 school students, the majority of whom will be Black, Indigenous, youth of the Global Majority (of color) (BIPGM) and students relying on free or reduced price school meals, through the coalition’s student-led efforts. Engagement will include participation in the Student Wing, Fellowship, Working Groups, Steering Committee membership, and advocacy activities with intentional outreach to students historically excluded from decision-making.\nWe will track: Number of students engaged (including age, race/ethnicity, and geography) Percentage of engaged students who are BIPGM and/or eligible for free or reduced-price meals Number of students participating in leadership roles (e.g., Fellows, Student Wing co-leads, Steering Committee members) Participation and retention rates across programs (attendance, completion, continued engagement) Student feedback demonstrating increased leadership skills, sense of belonging, and ability to influence school food decisions","Student-Driven Policy Change\nFrom October 2026 – September 2027, the Coalition will elevate student-led non-lobbying policy advocacy to influence federal and state school meal policies, ensuring that the lived experiences of students are reflected in decision-making processes and policy outcomes. The Coalition will support students to participate in advocacy meetings, submit public comments, and engage in campaigns that advance more inclusive, plant-forward, and culturally relevant school meals.\nWe will track: Number of students participating in policy advocacy activities (meetings, briefings, sign-on letters, public comments) Number of student-informed policy recommendations submitted to federal and/or state agencies Meetings held with key decision-makers (e.g., USDA, state agencies) Evidence of student perspectives reflected in policy discussions, agency communications, or guidance (e.g., meeting notes, memos, public statements) Progress toward specific policy changes (e.g., USDA’s meal pattern updates)"],"strategy_1":"Policy and Systems Change","strategy_2":"Youth training and development","scope_of_work":"National","target_age_range":"High School","special_populations":"Youth of Color","location":"Orlando, FL","note":"The  Plant Powered School Meals Coalition  (PPSMC) is the only national coalition focused specifically on expanding nutritious and delicious plant-based, culturally relevant meals and beverages in U.S. K-12 schools while centering students as leaders, strategists, and advocates for change. The Coalitionâ€™s work is grounded in the belief that school meals cannot be truly just, inclusive, nor nutritious unless the voices of the students most impacted by them are at the center of decision-making and those meals meet the needs of every student."},{"org":"Center for Good Food Purchasing","app":"Food Justice for Kids at Scale: Incentive Fund Pilot Programs as Catalysts for School Food Transformation","name":"Food Justice for Kids at Scale: Incentive Fund Pilot Programs as Catalysts for School Food Transformation","application_link":"https://portal.justfund.us/f/application/39390","city":"Berkeley","state":"CA","region":"Western","finalist_type":"H2HC","portfolio":"Nutrition Education & School Food","label":"Nutrition Education & School Food","focus":"Environmental Justice / Climate Justice / Nature, Economic Justice, Food Justice","strategies":"Advocacy, Base Building, Coalition Building, Movement Building, Organizing, Policy","scope":"National, Local","bipoc":"No","tax":"501c3","communities":"Asian or Asian American / AAPI, Black, Immigrant, Latino / Latina / Latinx, Rural, Workers","budget":"$2,711,577","annual_budget":"$2,711,577","budget_value":2711577,"budget_bucket":"$1M–$5M","grant_req":"$50,000","grant_request_value":50000,"mission":"The Center for Good Food Purchasing (the Center) uses the nationwide deployment and scaling of our Good Food Purchasing Program (the Program) as a catalyst for accelerating the transformation of our food system in ways that empower equitable, community-based solutions through the lever of public food procurement. The Program was designed to harness the food purchasing power of public institutions to build a transparent and equitable food system  for the benefit of children, families, and communities . By aligning, connecting, and aggregating local and regional Good Food Purchasing efforts across the country, the Center for Good Food Purchasing is laying a foundation for food system transformation at scale, with benefits accruing to people and planet.   To ensure that food system transformation results in broadly shared benefits, the Centerâ€™s work is built around five core, interconnected food system values â€“ community health and nutrition, local and community-based economies, environmental sustainability, valued workforce, and animal welfare â€“ and centered around principles of equity, transparency, and accountability. The Center offers communities tools and support to help make values-based procurement work. With one comprehensive and actionable framework, the Program activates all of the key stakeholders and resources needed to overcome the seemingly intractable barriers to food system transformation, helping to increase access to healthy food for those served by public institutions, while building a more transparent, equitable and sustainable food system.","year_est":"2015","additional_questions":"Question: Question 1: Program Focus     Please check which of the following focus areas are primary elements of the proposed program.      Select the one that is most relevant to your program's focus. This selection will help us with assigning reviewers. Note: All eligible projects must primarily focus on children under the age of 18.  Learn more in our FAQs . Answer: Nutrition Education & School Food: Projects and policy work supporting kids learning, growing, and cooking healthy and culturally relevant foods; eating nutritious and culturally relevant school meals and integrating local food in schools; or improving access to school meals.\n\nQuestion: Question 2: Innovation     How does your proposed project offer both an innovative and impactful approach that advances food justice for kids?      \"Innovative\" doesn't necessarily mean new technology or a novel approach. Whether rooted in traditional knowledge, adapted from successful models in other communities, or offering a novel approach to persistent challenges, we want to understand what makes your approach unique and why you believe it will create meaningful change.   Please also share any evidence of past results, related outcomes, and/or qualitative or quantitative indicators that demonstrate the promise of your approach. Answer: The Center leverages its Good Food Purchasing Program to produce food justice for kids at scale. Using the lever of school food purchasing, the Center empowers local communities to provide healthy, nutritious school meals for their kids made from local, fair, sustainable, and humanely produced food. With local partners, we have demonstrated the potential of good food purchasing efforts to provide economic/environmental/social benefits in the nearly 100 institutions (including the 3 largest U.S. School Districts) where we work.   An example of the evidence we're seeing for the effectiveness of our approach is our recent work with the Fresno Unified School District in Fresno, CA. Their most recent Good Food Purchasing Program assessment showed that their investment of state and federal funding dollars into good food purchasing led to measurable, documented changes in what their kids eat, including a $285K increase in organic produce, $200K increase in local high-animal-welfare meat, and a 5% increase in whole and minimally processed foods. Each of these shifts is a proof point of the benefits that good food purchasing is bringing to our kids and their communities by making the food they eat more healthy, local, equitable, sustainable, and humane.   But local communities are just the start. By networking local efforts around the country into regional, state, and national networks, we are working at a scale that can achieve lasting, durable, transformational impacts across the food system.   Recently, California and Michigan have instituted statewide pilot projects to provide incentive funding for school meals that incorporate good food purchasing. Using data we collect from participating GFPP institutions in those states, this project will evaluate the success of these initiatives and empower communities and states across the country with the data they need to build a case for: 1) permanent, legislatively-enacted good food frameworks and funding for CA and MI; and 2) replication/adoption in other states.\n\nQuestion: Question 3: Community Power     How is your organization and/or project led by, collaborating with, and building power within the community you serve?     For example, how are children, caregivers, school leadership, and other relevant community leaders guiding your project and working in partnership in other aspects of your organizationâ€™s work? Answer: The primary beneficiaries of the Program are the low-income individuals, families, and children served by public institutions such as schools, municipal programs, carceral facilities, and hospitals â€“ who in many cases are the most vulnerable among us and rely on public institutions as sources of nutritious food. Other key constituencies are: 1) farm and food chain workers, a majority of whom are people of color, have extremely low incomes, are exposed on a daily basis to toxic pesticides, and lack access to safe drinking water due to groundwater contamination from agricultural runoff; 2) small- to medium-sized sustainable farmers, especially producers of color, who struggle to compete with large, industrial producers in accessing institutional supply chains; and 3) food service directors, who are integral to the process of changing institutional culture and decision-making.   The Center and our Program partners work at multiple levels to address disparities in our food system and shift institutional policies/practices/resources, including:       Building a movement of community power, transparency, and accountability that includes all stakeholders â€“ including frontline communities and food workers and producers of color â€“ by holistically addressing and connecting issues that matter to them.        Identifying supply chain issues and institutional practices impacted by historical racism, finding roadblocks, and developing practice- and policy-based solutions.       Centering racial equity, worker justice, transparency, and accountability in our work.","website":"https://goodfoodpurchasing.org","smartie_summary":"This organization aims to increase access to nutritious and locally sourced school meals by facilitating the collaboration of local food policy councils, grassroots coalitions, and school districts. This organization additionally aims to advance statewide funding for school food in in California and Michigan.","smartie_goal_1":"From October 2026 –September 2027, over 1 million school children in grades 1-12 in 14 school districts in California and 2 school districts in Michigan, which serve predominantly low-income communities and communities of color, will have access to more nutritious and locally-produced school meals that: 1) support local/regional communities and economies; and 2) provide benefits from the increased sustainability, worker and producer equity, and animal welfare associated with production of food used in school meals. Local communities will partner with the Center and other stakeholders in every stage of this project through the participation of local food policy councils, grassroots coalitions, and school districts to ensure that community values around equity and inclusion are integrated into the fabric of this work through co-design of data and implementation priorities and community reporting.\nSuccess Measures\nData gathered from assessments of individual school districts will demonstrate shifts in local school meals aligning with community health and nutrition, local and community-based economies, environmental sustainability, valued workforce, and animal welfare. Success will be measured by the amount of year-over-year increases from the baseline of food purchases aligned with each value category for all 16 participating school districts. Impacts of specific indicators will be evaluated according to methodology described and demonstrated on our Good Food Impact Hub.","smartie_goal_2":"Data and evidence collected from October 2026 – September 2027 through work aligning California and Michigan grade 1-12 school meals with five community values (healthy, local, equitable, sustainable, and humane) support: 1) advancement of permanent statewide incentive funding for GFPP aligned school meals in CA and MI; and 2) replication of state-level incentive funds in other states and broader local replication of inclusive, equitable good food purchasing efforts.\nSuccess Measures\nCollected data from assessments in each participating school district in California and Michigan will be aggregated to evaluate improvement in each value category vs. overall statewide school food purchasing to: 1) demonstrate the potential benefits of statewide implementation of good food purchasing; 2) evaluate the comparative success of pilot program design in each state; and 3) build actionable evidence for replication in other states. Milestones include production of a year end comparative assessment of the California and Michigan pilot programs and creation of supporting materials for school districts, advocates, and policymakers working to advance good food purchasing in other school districts and states. Success will be measured by the degree to which school districts, advocates, and policy-makers use materials to advance local and statewide good food purchasing efforts, resulting in more healthy, local, sustainable, equitable, and humane food served in school meals. Indicators to demonstrate success towards this goal include number of policymaker briefings, legislative inquiries, and district replication inquiries from food policy councils, policymakers and food service directors in other jurisdictions.","smartie_goal_3":"","smartie_goals":["From October 2026 –September 2027, over 1 million school children in grades 1-12 in 14 school districts in California and 2 school districts in Michigan, which serve predominantly low-income communities and communities of color, will have access to more nutritious and locally-produced school meals that: 1) support local/regional communities and economies; and 2) provide benefits from the increased sustainability, worker and producer equity, and animal welfare associated with production of food used in school meals. Local communities will partner with the Center and other stakeholders in every stage of this project through the participation of local food policy councils, grassroots coalitions, and school districts to ensure that community values around equity and inclusion are integrated into the fabric of this work through co-design of data and implementation priorities and community reporting.\nSuccess Measures\nData gathered from assessments of individual school districts will demonstrate shifts in local school meals aligning with community health and nutrition, local and community-based economies, environmental sustainability, valued workforce, and animal welfare. Success will be measured by the amount of year-over-year increases from the baseline of food purchases aligned with each value category for all 16 participating school districts. Impacts of specific indicators will be evaluated according to methodology described and demonstrated on our Good Food Impact Hub.","Data and evidence collected from October 2026 – September 2027 through work aligning California and Michigan grade 1-12 school meals with five community values (healthy, local, equitable, sustainable, and humane) support: 1) advancement of permanent statewide incentive funding for GFPP aligned school meals in CA and MI; and 2) replication of state-level incentive funds in other states and broader local replication of inclusive, equitable good food purchasing efforts.\nSuccess Measures\nCollected data from assessments in each participating school district in California and Michigan will be aggregated to evaluate improvement in each value category vs. overall statewide school food purchasing to: 1) demonstrate the potential benefits of statewide implementation of good food purchasing; 2) evaluate the comparative success of pilot program design in each state; and 3) build actionable evidence for replication in other states. Milestones include production of a year end comparative assessment of the California and Michigan pilot programs and creation of supporting materials for school districts, advocates, and policymakers working to advance good food purchasing in other school districts and states. Success will be measured by the degree to which school districts, advocates, and policy-makers use materials to advance local and statewide good food purchasing efforts, resulting in more healthy, local, sustainable, equitable, and humane food served in school meals. Indicators to demonstrate success towards this goal include number of policymaker briefings, legislative inquiries, and district replication inquiries from food policy councils, policymakers and food service directors in other jurisdictions."],"strategy_1":"Technical Assistance and Capacity Building","strategy_2":"Policy and Systems Change","scope_of_work":"State","target_age_range":"Elementary - High School","special_populations":"Youth of Color","location":"Berkeley, CA","note":"The Center for Good Food Purchasing (the Center) uses the nationwide deployment and scaling of our Good Food Purchasing Program (the Program) as a catalyst for accelerating the transformation of our food system in ways that empower equitable, community-based solutions through the lever of public food procurement. The Program was designed to harness the food purchasing power of public institutions to build a transparent and equitable food system  for the benefit of children, families, and communities . By aligning, connecting, and aggregating local and regional Good Food Purchasing efforts across the country, the Center for Good Food Purchasing is laying a foundation for food system transformation at scale, with benefits accruing to people and planet.   To ensure that food system transformation results in broadly shared benefits, the Centerâ€™s work is built around five core, interconnected food system values â€“ community health and nutrition, local and community-based economies, environmental sustainability, valued workforce, and animal welfare â€“ and centered around principles of equity, transparency, and accountability. The Center offers communities tools and support to help make values-based procurement work. With one comprehensive and actionable framework, the Program activates all of the key stakeholders and resources needed to overcome the seemingly intractable barriers to food system transformation, helping to increase access to healthy food for those served by public institutions, while building a more transparent, equitable and sustainable food system."},{"org":"ChangeLab Solutions","app":"Eliminating Ultra-Processed Foods from California Schools","name":"Eliminating Ultra-Processed Foods from California Schools","application_link":"https://portal.justfund.us/f/application/40452","city":"Oakland","state":"CA","region":"Western","finalist_type":"H2HC","portfolio":"Nutrition Education & School Food","label":"Nutrition Education & School Food","focus":"Democracy & Civic Engagement, Healthcare / Wellness / Public Health, Food Justice","strategies":"Capacity Building / Org Development, Convening, Education, Policy","scope":"National, State","bipoc":"Yes","tax":"501c3","communities":"Black, Immigrant, Indigenous, Latino / Latina / Latinx, LGBTQ+, Rural","budget":"$7,329,415","annual_budget":"$7,329,415","budget_value":7329415,"budget_bucket":"$5M–$25M","grant_req":"$50,000","grant_request_value":50000,"mission":"ChangeLab Solutions is a nonpartisan nonprofit organization that uses the tools of law and policy to advance health equity. We partner with communities across the nation to improve health and opportunity by changing harmful laws, policies, and systems. Our interdisciplinary team works with community organizations, governments, and local institutions to design and implement   equitable   and practical policy solutions to complex health challenges.              Our mission is to advance healthier   communities for all   through   equitable   laws & policies  . A  t ChangeLab Solutions, we envision healthy,   equitable   communities where every person can   attain   their full health potential.","year_est":"1996","additional_questions":"Question: Question 1: Program Focus     Please check which of the following focus areas are primary elements of the proposed program.      Select the one that is most relevant to your program's focus. This selection will help us with assigning reviewers. Note: All eligible projects must primarily focus on children under the age of 18.  Learn more in our FAQs . Answer: Nutrition Education & School Food: Projects and policy work supporting kids learning, growing, and cooking healthy and culturally relevant foods; eating nutritious and culturally relevant school meals and integrating local food in schools; or improving access to school meals.\n\nQuestion: Question 2: Innovation     How does your proposed project offer both an innovative and impactful approach that advances food justice for kids?      \"Innovative\" doesn't necessarily mean new technology or a novel approach. Whether rooted in traditional knowledge, adapted from successful models in other communities, or offering a novel approach to persistent challenges, we want to understand what makes your approach unique and why you believe it will create meaningful change.   Please also share any evidence of past results, related outcomes, and/or qualitative or quantitative indicators that demonstrate the promise of your approach. Answer: California Assembly Bill 1264 (AB 1264), enacted in the 2025â€“26 legislative session, aims to improve student health, reduce   diet   â€‘   related   disease, and   establish   a national model for regulating   ultra   â€‘   processed   foods (UPFs). California is the first state to legally define and phase out UPFs in public schools. The law requires schools to begin phasing out restricted UPFs in 2029 and fully   eliminate   them from reimbursable meals by 2035.           School food is a key area of community nutrition policy where the California Department of Public Healthâ€™s Nutrition and Physical Activity Branch (CDPH NPAB) has traditionally supported local implementation through funding, technical   assistance  , and staffing for local health departments (LHDs) and the healthy eating active living coalitions they lead. However, H.R. 1 (the â€œOne Big Beautiful Bill Actâ€), enacted July 4, 2025, permanently   eliminated   federal funding for   SNAP   â€‘   Ed  . As a result, CDPH has reduced funding and staff support for local coalitions that are critical to implementing AB 1264 and advancing related efforts, such as expanding scratch cooking and local food procurement in schools.           Over the past year, ChangeLab Solutions has provided technical   assistance   to CDPH NPAB and local health departments (LHDs) statewide on policy, systems, and environmental approaches to support healthy eating and active living across California. This work included   facilitating   a Community of Practice (CoP) for capacity building, delivering tailored technical   assistance   to LHDs and their local partners, and developing resources to help local changemakers navigate the complex legal and policy landscape of school food and food procurement. Due to the federal elimination of   SNAP   â€‘   Ed  , this work conclude  s   in May 2026.           We propose using the Food Justice for Kids Prize to build on this work by   convening   a   CoP   focused on supporting changemakers as schools transition to eliminating UPFs. The CoP would provide group and tailored technical   assistance   to LHDs, their local partners, and the CDPH staff they work with  ,   many of whom will be reassigned to other branches, such as oral health or maternal and child health. In addition to technical   assistance  , we would develop up to four short,   issue   â€‘   responsive   resources and produce a summary report to share key insights with those unable to   participate   or who may assume school food work after the CoP concludes. This effort is innovative in that it supports school food policy, systems, and environmental change without federal or state   SNAP   â€‘   Ed   funding, while addressing emerging policy requirements and enabling coordination and   strategy   â€‘   building   across   jurisdictions   and levels of government.\n\nQuestion: Question 3: Community Power     How is your organization and/or project led by, collaborating with, and building power within the community you serve?     For example, how are children, caregivers, school leadership, and other relevant community leaders guiding your project and working in partnership in other aspects of your organizationâ€™s work? Answer: The idea for this   CoP   grew   out of   information     LHDs   and their   coalition   partners   shared   CDPH   about what they planned to focus on in the next year and what kind of support would be helpful.   ChangeLab Solutionsâ€™ work is rooted in close partnership with the communities most impacted by school food policies. Through our Community of Practice (CoP), we will collaborate with local health departments (LHDs), school districts,   community   â€‘   based   organizations, and coalitions that include caregivers, students, educators, food service staff, and local advocates. These partners guide the focus of the CoP by   identifying   priority challenges, shaping agendas, and elevating lived experience from their local contexts.              Rather than prescribing solutions, we create structured   peer learning   spaces where community leaders share strategies, troubleshoot barriers, and   co   â€‘   develop   approaches to improving school food and transitioning away from   ultra   â€‘   processed   foods under AB 1264. Tailored technical   assistance   responds directly to questions raised by participants, ensuring that   community   â€‘   identified   needs   drive   our work. By centering local leadership, fostering   cross   â€‘   jurisdiction   learning, and producing practical resources grounded in participant input, the CoP strengthens community capacity, builds collective power, and supports locally led change that reflects the priorities of children, caregivers, and school communities.","website":"https://www.changelabsolutions.org/","smartie_summary":"ChangeLab works at the intersection of policy and ultra-processed foods, using advocacy, student empowerment, and collaboration to ensure healthier meals in schools.","smartie_goal_1":"By the end of the year 1 grant period, the Community of Practice (CoP) will include local coalitions and/or local health departments representing a mix of urban, rural, and under-resourced communities and each team participating will demonstrate increased capacity to support implementation of AB 1264 by identifying at least two actionable policy, systems, or procurement strategies to reduce ultra-processed foods in schools. as measured through pre- and post-CoP self-assessments and action planning outputs.\nSuccess Measures\nWe will confirm that participating teams represent a mix of urban, rural, and under-resourced communities through enrollment and demographic data. Increased capacity will be assessed using pre- and post-CoP surveys and structured reflections, as well as review of participant action plans. Each participating coalition or local health department will demonstrate progress by identifying at least two concrete, actionable policy, systems, or procurement strategies aligned with AB 1264, which will serve as a key indicator of readiness to support implementation at the local level.","smartie_goal_2":"Over the project period, provide up to 120 hours of tailored technical assistance to participating coalitions, including communities serving students most impacted by diet-related inequities. At least 80% of TA recipients will report that the support was responsive to their local context, strengthened community leadership, and increased their ability to advance school food improvements without SNAP-Ed funding.\nSuccess Measures\nSuccess will be measured by tracking the total number of tailored technical assistance (TA) hours delivered and the characteristics of recipient communities, ensuring inclusion of those serving students most impacted by diet-related inequities. Following TA delivery, participating coalitions will complete brief feedback surveys assessing whether the assistance was responsive to their local context, supportive of community leadership, and useful for advancing school food improvements without SNAP-Ed funding. Success will be achieved if at least 80% of TA recipients report positive outcomes across these measures.","smartie_goal_3":"By project completion, ChangeLab will develop two practice-ready resources and a summary report grounded in questions and lessons raised by CoP participants. These outputs will be disseminated statewide and designed for accessibility and applicability across jurisdictions, with the goal of the resources being utilized in every county across the state.\nSuccess Measures\nSuccess will be measured by completion and dissemination of the two resources and summary report within the project period, with content directly informed by documented questions, themes, and lessons raised by CoP participants. Dissemination will be tracked through statewide distribution lists, partner networks, and online analytics.","smartie_goals":["By the end of the year 1 grant period, the Community of Practice (CoP) will include local coalitions and/or local health departments representing a mix of urban, rural, and under-resourced communities and each team participating will demonstrate increased capacity to support implementation of AB 1264 by identifying at least two actionable policy, systems, or procurement strategies to reduce ultra-processed foods in schools. as measured through pre- and post-CoP self-assessments and action planning outputs.\nSuccess Measures\nWe will confirm that participating teams represent a mix of urban, rural, and under-resourced communities through enrollment and demographic data. Increased capacity will be assessed using pre- and post-CoP surveys and structured reflections, as well as review of participant action plans. Each participating coalition or local health department will demonstrate progress by identifying at least two concrete, actionable policy, systems, or procurement strategies aligned with AB 1264, which will serve as a key indicator of readiness to support implementation at the local level.","Over the project period, provide up to 120 hours of tailored technical assistance to participating coalitions, including communities serving students most impacted by diet-related inequities. At least 80% of TA recipients will report that the support was responsive to their local context, strengthened community leadership, and increased their ability to advance school food improvements without SNAP-Ed funding.\nSuccess Measures\nSuccess will be measured by tracking the total number of tailored technical assistance (TA) hours delivered and the characteristics of recipient communities, ensuring inclusion of those serving students most impacted by diet-related inequities. Following TA delivery, participating coalitions will complete brief feedback surveys assessing whether the assistance was responsive to their local context, supportive of community leadership, and useful for advancing school food improvements without SNAP-Ed funding. Success will be achieved if at least 80% of TA recipients report positive outcomes across these measures.","By project completion, ChangeLab will develop two practice-ready resources and a summary report grounded in questions and lessons raised by CoP participants. These outputs will be disseminated statewide and designed for accessibility and applicability across jurisdictions, with the goal of the resources being utilized in every county across the state.\nSuccess Measures\nSuccess will be measured by completion and dissemination of the two resources and summary report within the project period, with content directly informed by documented questions, themes, and lessons raised by CoP participants. Dissemination will be tracked through statewide distribution lists, partner networks, and online analytics."],"strategy_1":"Policy and Systems Change","strategy_2":"Technical Assistance and Capacity Building","scope_of_work":"Local","target_age_range":"Adults Serving Children Under 18","special_populations":"All Youth","location":"Oakland, CA","note":"ChangeLab Solutions is a nonpartisan nonprofit organization that uses the tools of law and policy to advance health equity. We partner with communities across the nation to improve health and opportunity by changing harmful laws, policies, and systems. Our interdisciplinary team works with community organizations, governments, and local institutions to design and implement   equitable   and practical policy solutions to complex health challenges.              Our mission is to advance healthier   communities for all   through   equitable   laws & policies  . A  t ChangeLab Solutions, we envision healthy,   equitable   communities where every person can   attain   their full health potential."},{"org":"Grow Windham, Inc","app":"The Windham Youth CORE (Cultivating Opportunity, Resources and Equity): From Seed to Systems Change","name":"The Windham Youth CORE (Cultivating Opportunity, Resources and Equity): From Seed to Systems Change","application_link":"https://portal.justfund.us/f/application/40265","city":"Willimantic","state":"CT","region":"Northeast","finalist_type":"Kendall","portfolio":"Nutrition Education & School Food","label":"Nutrition Education & School Food","focus":"Education, Equitable Development, Food Justice","strategies":"Advocacy, Coalition Building, Education, Leadership Development, Mutual Aid, Organizing","scope":"Regional, Local","bipoc":"Yes","tax":"501c3","communities":"Immigrant, Latino / Latina / Latinx, People who are Undocumented, Women, Youth, Youth: High School","budget":"$230,000","annual_budget":"$230,000","budget_value":230000,"budget_bucket":"Under $500K","grant_req":"$100,000","grant_request_value":100000,"mission":"Grow Windham cultivates intergenerational spaces that center youth to grow and build their power to problem solve and create new opportunities in Windham.   â€ We do this by using the garden as a hub to address systemic barriers, where youth are responsible for building community, leading projects, and taking action to accomplish their visions.","year_est":"2012","additional_questions":"Question: Question 1: Program Focus     Please check which of the following focus areas are primary elements of the proposed program.      Select the one that is most relevant to your program's focus. This selection will help us with assigning reviewers. Note: All eligible projects must primarily focus on children under the age of 18.  Learn more in our FAQs . Answer: Nutrition Education & School Food: Projects and policy work supporting kids learning, growing, and cooking healthy and culturally relevant foods; eating nutritious and culturally relevant school meals and integrating local food in schools; or improving access to school meals.\n\nQuestion: Question 2: Innovation     How does your proposed project offer both an innovative and impactful approach that advances food justice for kids?      \"Innovative\" doesn't necessarily mean new technology or a novel approach. Whether rooted in traditional knowledge, adapted from successful models in other communities, or offering a novel approach to persistent challenges, we want to understand what makes your approach unique and why you believe it will create meaningful change.   Please also share any evidence of past results, related outcomes, and/or qualitative or quantitative indicators that demonstrate the promise of your approach. Answer: To us, food justice for kids means both that food - nutritious, affordable, culturally-appropriate, and ethically-produced - is a right, for all kids, and all people; and also, that kids have a right to a voice and power in decision-making that shapes their food system.    The Windham Youth CORE (WYC) is both innovative and impactful, as it creates space and provides support for youth both to develop and manifest their vision of food justice, as they move from growing and producing culturally-relevant foods, to apprenticeships that impact their local food system, to coalition-building to shape statewide food policy. Our innovations include:       Creating spaces and contexts where youth have ownership and power: for example, their Thread City Family Garden, on public land, where they cultivate resources connected to their food roots, that they collectively decide how to distribute; and apprenticeships where they define projects that further their vision of food justice.        Supporting tiered pathways to increased leadership and responsibility, so they gradually build the skills and self-efficacy to make change in our program, our local food system, and statewide.       Convening local values-aligned food system partners, committed to working alongside youth and community members to collectively develop a just, local food system.       Connecting youth with likeminded peers statewide, to build a collective vision and momentum for food justice for kids.        This approach supports youth not only to directly impact their current food environment, but also to develop the skills, connections, and experience to become lifelong advocates for systems change. This work is particularly urgent for low-wealth, Latinx, and immigrant youth in Windham, CT, who represent 75% of the schools, but are grossly underrepresented in spaces of power.    For the past 15 years, Grow Windham has developed the experience and durable partnerships to make this work successful. Supporting youth to explore their food roots is already embedded in our programming: for example, last summer, apprentices grew Oaxacan Green corn in our garden; dried it in our office; ground it using a bicycle-driven mill; and made arepas all together. Our youth have led three successful school food campaigns, resulting in two new menu items and a â€œspice barâ€ at the high school.    Our year-round youth program, the WYC, has long-time partnerships that make our work possible. These include the town, who co-maintains our garden; local schools and universities, including with CT State Community College to provide up to six credits for participation in our academic year program; and state Youth Employment funding, to provide stipends for youth participants. CLiCK, Inc, our local food hub and primary food system partner, has hosted Grow Windham apprentices for the past six years, and has established relationships with local producers and school food service directors, who are eager to integrate youth into their work. Lastly, since 2013 we have been collaborating with youth food justice programs across the state; we have annual meet-ups with partner programs, and our youth were presenters at the CT Food Sovereignty Collective launch meeting last year, so we have both experience and a solid foundation for coordinated, youth-led statewide advocacy.\n\nQuestion: Question 3: Community Power     How is your organization and/or project led by, collaborating with, and building power within the community you serve?     For example, how are children, caregivers, school leadership, and other relevant community leaders guiding your project and working in partnership in other aspects of your organizationâ€™s work? Answer: Our commitment to building youth and community power carries through every level of our organization: both our current co-director, and board chair, are former members of the Windham Youth CORE.   YOUTH LEADERSHIP: Youth lead in all aspects of our organization, including: participating in hiring of adult staff, defining program norms, managing their budget and garden, and guiding long-term program development through three annual retreats.    COMMUNITY VOICE: Youth projects meet identified community needs and build power for adults as well. For example, our current project, the Community Table/Mesa Comunitaria, is a mutual-aid foodshare that delivers weekly food boxes to 57 households without access to other resources. It integrates local farmers, food assistance providers, food businesses, and individual volunteers and donors, and is constituent-led: shareholders choose what they receive, decide how products are distributed, and receive gift cards for supporting shopping, packing and delivery.   COMMUNITY COLLABORATION: Grow Windham also builds power through convening and providing backbone support for local and regional coalitions to support systemic change in the food system, including the Windham Community Food Network in 2015, and a Regional Food System Partnership in 2022, both of which include active youth participation.   MOVEMENT BUILDING: Both our organization and our project build youth and community power through youth coalitions in support of state Food Sovereignty Policy development, as well as community media campaigns that educate and mobilize the public behind youth food justice priorities.","website":"https://www.growwindham.org","smartie_summary":"Grow Windham educates young people on sustainable food sourcing and food justice, working with mentors to develop youth leadership skills and expertise to meaningfully contribute to the field of nutrition education and sustainability.","smartie_goal_1":"From October 2026 to August 2027 (Timebound), 25 unduplicated youth ages 14-18 will demonstrate increased foundational food system skills and food justice consciousness through successful completion of the Windham Youth CORE (“Cultivating Opportunity, Resources and Equity”) year-round service-learning program. (Strategic, Measurable, Realistic) 92% of the youth will demonstrate growth in their: ability to grow and process food; understanding about the components and types of different food systems (local, industrial, cooperative); and consciousness about the principles of food justice and how to manifest them through engagement in their local food system, (Ambitious, Strategic) with programming co-created and co-facilitated by adult staff and youth apprentices (program graduates from the previous year) (Ambitious, Strategic) Youth are 90% Latinx, all from low-wealth households (eligible for free and reduced lunch) and from Windham (versus surrounding towns), with priority recruiting immigrant and high need youth who are referred through the schools. (Inclusive, Equitable)\nSuccess Measures\nWe will measure youth development through portfolios in which they: * Set, track, and reflect on growth toward personal goals, based off of our “Community Leaders Profile” and Workforce and Community Standards * Independently design and complete an activity related to food production * Lead at least one community tabling event or activity, in which they articulate how their work promotes their vision of food justice * Complete an individual “photo voice” project at the end of each session (3 times a year) through which they highlight the work they have accomplished and explain how it impacts their lives, their food system, and their community; and reflect on their growth through the program (Because we do this project each trimester, it acts as a pre/post means to measure growth in knowledge and food justice consciousness.) Triannual (Jan, June, September) Youth Retreats provide feedback on program design and implementation, and identify projects and goals for the next program segment. (Inclusive, Equitable, Strategic)","smartie_goal_2":"From October 202
