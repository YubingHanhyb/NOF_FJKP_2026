ocess traditional foods and locally grown healthy foods during workshops and classroom lessons, and in the proportion of families (at least 75%) receiving these foods to use at home. Student and family engagement will be observed through participation in hands-on activities, sharing stories about using foods at home, and verbal reflections expressing excitement, cultural pride, or connection to Yurok traditions. Additional indicators of impact will include repeated participation in workshops, requests for continued lessons, and youth-led sharing of traditional food knowledge with peers or family members, demonstrating both increased access to healthy foods and strengthened cultural learning. (Realistic)"],"strategy_1":"Direct Service and Education","strategy_2":"","scope_of_work":"Local","target_age_range":"Elementary - High School","special_populations":"Native Youth","location":"Klamath, CA","note":"Yurok Constitution: The Last Paragraph of the Preamble:   The Yurok Tribe is the largest Indian Tribe in California, and while much land has been lost, the spirit of the Creator and our inherent Tribal sovereignty still thrives in the hearts and minds of our people as well as in the strong currents, deep canyons, thick forests, and high mountains of our ancestral lands. Therefore, in order to exercise the inherent sovereignty of the Yurok Tribe, we adopt this Constitution in order to: 1) Preserve forever the survival of our Tribe and protect it from forces which may threaten its existence 2) Uphold and protect our Tribal sovereignty which has existed from time immemorial and which remains undiminished 3) Reclaim the Tribal land base within the Yurok reservation and enlarge the Reservation boundaries to the maximum extent possible within the ancestral lands of our Tribe and/or within any compensatory land area 4) Preserve and promote our culture, language, and religious beliefs and practices, and pass them on to our children, our grandchildren, and to their children and grandchildren on, forever; 5) Provide for the health, education, economy and social well-being of our members and future members; 6) Restore, enhance, and manage the Tribal fishery, Tribal water rights, Tribal forests, and all other natural resources, and 7) Insure peace, harmony, and protection of individual human rights among our members and among others who may come within the jurisdiction of our Tribal government"},{"org":"One Spirit","app":"Hands On Food Justice for Lakota Kids","name":"Hands On Food Justice for Lakota Kids","application_link":"https://portal.justfund.us/f/application/38936","city":"Rapid City","state":"SD","region":"Mountain Plains","finalist_type":"NOFHumanitix","portfolio":"Indigenous Food Justice","label":"Indigenous Food Justice","focus":"Economic Justice, Human Rights / Civil Rights & Liberties, Food Justice","strategies":"Advocacy, Capacity Building / Org Development, Culture, Direct Service, Mutual Aid, Social Enterprise","scope":"State, Local","bipoc":"Yes","tax":"501c3","communities":"Indigenous, People with Disabilities, Rural, Seniors, Women, Youth","budget":"$1,537,048","annual_budget":"$1,537,048","budget_value":1537048,"budget_bucket":"$1M–$5M","grant_req":"$50,000","grant_request_value":50000,"mission":"The ONE Spirit Mission is to help the Lakota meet the basic needs of their people and provide a culturally rich life for their youth. Our programs promote an intercultural relationship that recognizes that we are all related and that American Indians are an equal and valued part of our society. The goal of all programs is to reduce or eliminate hunger, replace the high drop out and suicide rates among youth with an enthusiasm for learning and a pride in their Lakota heritage; and, provide protection from the winter cold that can drop to 40 below zero. The plan is to create programs that will be sustained by the Lakota people.","year_est":"2009","additional_questions":"Question: Question 1: Program Focus     Please check which of the following focus areas are primary elements of the proposed program.      Select the one that is most relevant to your program's focus. This selection will help us with assigning reviewers. Note: All eligible projects must primarily focus on children under the age of 18.  Learn more in our FAQs . Answer: Indigenous Food Justice: Projects and policy work supporting kids advancing food sovereignty, or engaging with, gathering, growing, and cooking Indigenous foods.\n\nQuestion: Question 2: Innovation     How does your proposed project offer both an innovative and impactful approach that advances food justice for kids?      \"Innovative\" doesn't necessarily mean new technology or a novel approach. Whether rooted in traditional knowledge, adapted from successful models in other communities, or offering a novel approach to persistent challenges, we want to understand what makes your approach unique and why you believe it will create meaningful change.   Please also share any evidence of past results, related outcomes, and/or qualitative or quantitative indicators that demonstrate the promise of your approach. Answer: At the Allen Youth Center on Pine Ridge Reservation, Malcolm Thunder Bull has spent five years cultivating more than a 2-acre gardenâ€”he's cultivating food citizens. This Indigenous farm-to-youth-center-kitchen initiative expands Malcolm's foundation into hands-on nutrition education through monthly workshops where kids advancing food sovereignty learn by doing: seed starting, composting, vertical trellising, harvesting, cooking traditional Lakota recipes, and preservation.   What makes this proposal innovative is its hands-on approach. Youth engage with food systems from seed to table, building health literacy and cultural identity simultaneously.    Currently, 5 dedicated youth help manage the garden year-round. For the past two years, they have harvested enough for each of the kids to take home a box of fresh produce to their families as well as use leftover produce for food preservation workshops. This funding expands access to nutritious, culturally relevant foods for up to 20 youth with engaging hands-on experiences creating sustainable solutions that directly address food justice for indigenous kids.\n\nQuestion: Question 3: Community Power     How is your organization and/or project led by, collaborating with, and building power within the community you serve?     For example, how are children, caregivers, school leadership, and other relevant community leaders guiding your project and working in partnership in other aspects of your organizationâ€™s work? Answer: One Spirit's programs are Lakota-led by designâ€”not as a value statement, but as a structural commitment. Every initiative is shaped by and accountable to the 40,000 residents of Pine Ridge Reservation, building true self-determination for future generations rather than simply meeting immediate needs.   This project is no exception. Malcolm Thunder Bull, a Lakota community member and Allen Youth Center's head gardener for five years, leads all workshops. He is currently expanding his own knowledge through external gardening courses, bringing regenerative and vertical growing techniques back to Pine Ridge youth.   Children are active co-stewardsâ€”five youth have tended this garden for years, and this funding grows that circle to 20. As the Allen Youth Center currently provides hot meals to nearly 100 young people every day, it is a central gathering place for the entire community. Parents and caregivers are intentionally invited in, strengthening intergenerational bonds around food, culture, and land. Allen Youth Center leadership has prioritized gardening education and provides classroom and kitchen infrastructure.","website":"https://www.onespiritlakota.org/","smartie_summary":"The organization uses garden education and an indigenous food sovereignty model to preserve cultural traditions and connect Lakota youth to high-quality nutrition education.","smartie_goal_1":"Expand Youth Participation in Hands-On Lakota Foodways Education \nFrom October 2026 through September 2027, Malcolm Thunder Bull will lead 10 monthly garden-to-kitchen workshops at Allen Youth Center engaging at least 15 and up to 20 youth ages 8–18 from Pine Ridge Reservation in hands-on activities including seed starting, regenerative gardening, harvesting, cooking traditional Lakota recipes, and canning and preservation—tripling current active youth participation.\nSuccess Measures\nAttendance records for each monthly workshop; pre/post surveys measuring youth knowledge of food growing, preparation, and Lakota foodways; participant feedback collected by Malcolm and Youth Center staff; photographic documentation of each workshop session.","smartie_goal_2":"Build Infrastructure for Year-Round Food Sovereignty \nBy July 2027, One Spirit and Allen Youth Center will complete greenhouse build and establish a ongoing food preservation program—equipping Lakota youth ages 8–18 and their families with the tools, supplies, and knowledge to grow and store food year-round.\nSuccess Measures\nDocumented completion of greenhouse build; estimated pounds or units of food produced preserved by program participants, documentation of number of participants.","smartie_goal_3":"Deepen Intergenerational and Community Connections to Indigenous Food Systems \nFrom October 2026 through September 2027, Allen Youth Center will serve 12 indigenous meals with produce grown from our garden to 100 individuals including youth, caregivers, family members and elders, at a shared garden-to-table community feast where the youth will share their learning experiences centering Lakota food knowledge, strengthen intergenerational relationships around food sovereignty, and building a replicable model for Indigenous food justice programming across Pine Ridge.\nSuccess Measures\nAttendance tracking for family and caregiver participation at community feasts; qualitative testimonials from youth, parents and elders collected at mid-year and year-end; documentation of any curriculum, recipe collection, or printed materials developed for broader community use; assessment of whether program elements are being adopted or replicated at other Pine Ridge garden sites.","smartie_goals":["Expand Youth Participation in Hands-On Lakota Foodways Education \nFrom October 2026 through September 2027, Malcolm Thunder Bull will lead 10 monthly garden-to-kitchen workshops at Allen Youth Center engaging at least 15 and up to 20 youth ages 8–18 from Pine Ridge Reservation in hands-on activities including seed starting, regenerative gardening, harvesting, cooking traditional Lakota recipes, and canning and preservation—tripling current active youth participation.\nSuccess Measures\nAttendance records for each monthly workshop; pre/post surveys measuring youth knowledge of food growing, preparation, and Lakota foodways; participant feedback collected by Malcolm and Youth Center staff; photographic documentation of each workshop session.","Build Infrastructure for Year-Round Food Sovereignty \nBy July 2027, One Spirit and Allen Youth Center will complete greenhouse build and establish a ongoing food preservation program—equipping Lakota youth ages 8–18 and their families with the tools, supplies, and knowledge to grow and store food year-round.\nSuccess Measures\nDocumented completion of greenhouse build; estimated pounds or units of food produced preserved by program participants, documentation of number of participants.","Deepen Intergenerational and Community Connections to Indigenous Food Systems \nFrom October 2026 through September 2027, Allen Youth Center will serve 12 indigenous meals with produce grown from our garden to 100 individuals including youth, caregivers, family members and elders, at a shared garden-to-table community feast where the youth will share their learning experiences centering Lakota food knowledge, strengthen intergenerational relationships around food sovereignty, and building a replicable model for Indigenous food justice programming across Pine Ridge.\nSuccess Measures\nAttendance tracking for family and caregiver participation at community feasts; qualitative testimonials from youth, parents and elders collected at mid-year and year-end; documentation of any curriculum, recipe collection, or printed materials developed for broader community use; assessment of whether program elements are being adopted or replicated at other Pine Ridge garden sites."],"strategy_1":"Direct Service and Education","strategy_2":"Youth training and development","scope_of_work":"Local","target_age_range":"Elementary - High School","special_populations":"Native Youth","location":"Rapid City, SD","note":"The ONE Spirit Mission is to help the Lakota meet the basic needs of their people and provide a culturally rich life for their youth. Our programs promote an intercultural relationship that recognizes that we are all related and that American Indians are an equal and valued part of our society. The goal of all programs is to reduce or eliminate hunger, replace the high drop out and suicide rates among youth with an enthusiasm for learning and a pride in their Lakota heritage; and, provide protection from the winter cold that can drop to 40 below zero. The plan is to create programs that will be sustained by the Lakota people."},{"org":"Pawnee Seed Preservation Society, Inc.","app":"Building a New Generation of Pawnee Seed Keepers: Growers and Cooks","name":"Building a New Generation of Pawnee Seed Keepers: Growers and Cooks","application_link":"https://portal.justfund.us/f/application/40723","city":"Pawnee","state":"OK","region":"Southeast","finalist_type":"NOFHumanitix","portfolio":"Indigenous Food Justice","label":"Indigenous Food Justice","focus":"Education, Racial Justice, Food Justice","strategies":"Capacity Building / Org Development, Culture, Digital Organizing, Education, Healing / Restorative Justice, Movement Building","scope":"Regional, Local","bipoc":"Yes","tax":"501c3","communities":"Indigenous, Rural, Seniors, Women, Youth, Youth: High School","budget":"$495,000","annual_budget":"$495,000","budget_value":495000,"budget_bucket":"Under $500K","grant_req":"$100,000","grant_request_value":100000,"mission":"To cultivate a new generation of food growers by creating economic development through inherent food sovereignty while building bridges that connect Nations.","year_est":"2021","additional_questions":"Question: Question 1: Program Focus     Please check which of the following focus areas are primary elements of the proposed program.      Select the one that is most relevant to your program's focus. This selection will help us with assigning reviewers. Note: All eligible projects must primarily focus on children under the age of 18.  Learn more in our FAQs . Answer: Indigenous Food Justice: Projects and policy work supporting kids advancing food sovereignty, or engaging with, gathering, growing, and cooking Indigenous foods.\n\nQuestion: Question 2: Innovation     How does your proposed project offer both an innovative and impactful approach that advances food justice for kids?      \"Innovative\" doesn't necessarily mean new technology or a novel approach. Whether rooted in traditional knowledge, adapted from successful models in other communities, or offering a novel approach to persistent challenges, we want to understand what makes your approach unique and why you believe it will create meaningful change.   Please also share any evidence of past results, related outcomes, and/or qualitative or quantitative indicators that demonstrate the promise of your approach. Answer: Our project is innovative because it blends sacred Pawnee seed keeping with a kid-centered teaching kitchen, so children move from tasting traditional foods to actually growing, cooking, and feeding their families. We are not inventing new technology; we are putting Indigenous food sovereignty into daily practice for kids by hiring a full-time Chef/Community Coordinator to turn blue corn, gardens into hands-on lessons in knife skills, food safety, seed saving, and balanced plates. Youth wonâ€™t just visit a garden once, they will plan snacks, dehydrate and freeze foods for home pantries, and bring seedlings and starter kits home so families benefit. Our Native Farm to School work already shows this model works: Pawnee students planted, tested soil and water, and cooked with blue corn in a full series of classes, increasing their willingness to try vegetables and choose healthier snacks over candy.\n\nQuestion: Question 3: Community Power     How is your organization and/or project led by, collaborating with, and building power within the community you serve?     For example, how are children, caregivers, school leadership, and other relevant community leaders guiding your project and working in partnership in other aspects of your organizationâ€™s work? Answer: Our project is led by the Pawnee community, not brought in from outside. Pawnee Seed Preservation Society is Pawneeâ€‘led, with a Pawnee Executive Director, Pawneeâ€‘led board, and at least 90 percent Indigenous staff who live in our rural community and share daily life with the families we serve. Kids and caregivers shape our work through afterâ€‘school classes, Farm to School lessons, and community events where we ask what they want to grow and cook next. That is how blue corn mush, roasted squash, and kidâ€‘friendly garden snacks became regular parts of our program. School staff and Pawnee Nation partners are active coâ€‘planners: our Chef/Community Coordinator will design schedules and lessons with the Education and Diabetes programs so activities and food boxes match what families actually use. When kids help run market booths, pack food shares, and share recipes on video, they gain real voice over how traditional foods move through our community.","website":"","smartie_summary":"This organization connects youth with healthy meal preparation education and traditional food knowledge, offering a tiered program that caters to different age levels' skills and interests. This organization additionally achieves its mission by collaborating with two local schools to disseminate accessible nutrition education curricula.","smartie_goal_1":"From October 2026 to September 2027, engage at least 80 Pawnee children and youth ages 6–18 in ongoing Pawnee foods cooking and garden-to-kitchen activities that build skills in healthy meal preparation and traditional food knowledge, with at least 75% of participants living in rural Pawnee and surrounding food desert communities. This goal is strategic, measurable, ambitious, realistic within one year, and centers Indigenous food justice by reconnecting youth with ancestral foods and practices in an inclusive, culturally grounded environment.\nSuccess Measures\n- Attendance records tracking number of unique youth participants, age ranges, and participation in at least three sessions each. - Pre- and post-program questionnaires where youth report confidence in basic cooking skills, trying Pawnee foods, and making healthy snack choices. - Simple reflection activities (circle check-ins, drawing, or short written prompts) where youth describe one Pawnee food, story, or protocol they learned and how they shared it at home.","smartie_goal_2":"By September 2027, support a core Youth Chef leadership group of at least 15 Pawnee middle and high school students (ages 11–18) to codesign menus, host at least four family food nights, and help prepare a minimum of 150 culturally meaningful meals for elders, ensuring that youth, families, and elders are included in decisions about recipes, teaching topics, and event formats. This goal advances inclusion and equity by centering Pawnee youth, families, and elders as knowledge holders and decision-makers in how food justice programming is designed and delivered.\nSuccess Measures\n- Youth Chef leadership roster and meeting notes documenting youth-led decisions on menus, recipes, and event plans. - Counts of family and elder event attendance, including number of intergenerational households represented. - Short surveys or talking-circle feedback from youth, caregivers, and elders on whether they felt heard in planning, how connected they feel to Pawnee foods, and what changes they want to see next year.","smartie_goal_3":"Between October 2026 and September 2027, collaborate with at least two local schools and one Pawnee Nation program to integrate Pawnee foods and seed stories into classroom lessons, after-school clubs, or cafeteria tastings reaching a minimum of 150 students ages 5–14, prioritizing Pawnee and other Native children in rural Pawnee. This goal is strategic, time-bound, and realistic, and it advances equity by bringing Indigenous foodways and language into school spaces where Native students have historically been marginalized. \nSuccess Measures\n- Simple tracking logs documenting the number of school partners, number and type of lessons or tastings delivered, and total students reached. - Short teacher and staff feedback forms on how Pawnee foods content fit into curriculum, what they observed in student engagement, and how they plan to continue using materials. - Student exit tickets or quick surveys (ageappropriate) assessing what they learned about Pawnee seeds and foods, and whether they are more interested in trying or growing these foods at home or school.","smartie_goals":["From October 2026 to September 2027, engage at least 80 Pawnee children and youth ages 6–18 in ongoing Pawnee foods cooking and garden-to-kitchen activities that build skills in healthy meal preparation and traditional food knowledge, with at least 75% of participants living in rural Pawnee and surrounding food desert communities. This goal is strategic, measurable, ambitious, realistic within one year, and centers Indigenous food justice by reconnecting youth with ancestral foods and practices in an inclusive, culturally grounded environment.\nSuccess Measures\n- Attendance records tracking number of unique youth participants, age ranges, and participation in at least three sessions each. - Pre- and post-program questionnaires where youth report confidence in basic cooking skills, trying Pawnee foods, and making healthy snack choices. - Simple reflection activities (circle check-ins, drawing, or short written prompts) where youth describe one Pawnee food, story, or protocol they learned and how they shared it at home.","By September 2027, support a core Youth Chef leadership group of at least 15 Pawnee middle and high school students (ages 11–18) to codesign menus, host at least four family food nights, and help prepare a minimum of 150 culturally meaningful meals for elders, ensuring that youth, families, and elders are included in decisions about recipes, teaching topics, and event formats. This goal advances inclusion and equity by centering Pawnee youth, families, and elders as knowledge holders and decision-makers in how food justice programming is designed and delivered.\nSuccess Measures\n- Youth Chef leadership roster and meeting notes documenting youth-led decisions on menus, recipes, and event plans. - Counts of family and elder event attendance, including number of intergenerational households represented. - Short surveys or talking-circle feedback from youth, caregivers, and elders on whether they felt heard in planning, how connected they feel to Pawnee foods, and what changes they want to see next year.","Between October 2026 and September 2027, collaborate with at least two local schools and one Pawnee Nation program to integrate Pawnee foods and seed stories into classroom lessons, after-school clubs, or cafeteria tastings reaching a minimum of 150 students ages 5–14, prioritizing Pawnee and other Native children in rural Pawnee. This goal is strategic, time-bound, and realistic, and it advances equity by bringing Indigenous foodways and language into school spaces where Native students have historically been marginalized. \nSuccess Measures\n- Simple tracking logs documenting the number of school partners, number and type of lessons or tastings delivered, and total students reached. - Short teacher and staff feedback forms on how Pawnee foods content fit into curriculum, what they observed in student engagement, and how they plan to continue using materials. - Student exit tickets or quick surveys (ageappropriate) assessing what they learned about Pawnee seeds and foods, and whether they are more interested in trying or growing these foods at home or school."],"strategy_1":"Direct Service and Education","strategy_2":"","scope_of_work":"Local","target_age_range":"Elementary - High School","special_populations":"All Youth","location":"Pawnee, OK","note":"To cultivate a new generation of food growers by creating economic development through inherent food sovereignty while building bridges that connect Nations."},{"org":"Eastern Band of Cherokee Indians (EBCI) NC Cooperative Extension Center","app":"Eastern Band of Cherokee Indians Cooperative Extension 4-H Youth Development","name":"Eastern Band of Cherokee Indians Cooperative Extension 4-H Youth Development","application_link":"https://portal.justfund.us/f/application/40529","city":"Cherokee","state":"NC","region":"Southeast","finalist_type":"NOFHumanitix","portfolio":"Indigenous Food Justice","label":"Indigenous Food Justice","focus":"Education, Healthcare / Wellness / Public Health, Food Justice","strategies":"Culture, Direct Action, Direct Service, Education, Healing / Restorative Justice, Leadership Development","scope":"State, Local","bipoc":"Yes","tax":"Federally recognized tribe","communities":"Indigenous, Seniors, Youth","budget":"$446,953","annual_budget":"$446,953","budget_value":446953,"budget_bucket":"Under $500K","grant_req":"$50,000","grant_request_value":50000,"mission":"The Eastern Band of Cherokee Indians (EBCI) NC Cooperative Extensionâ€™s mission is to p reserve and protect Cherokee culture, e  nhance agriculture, forest, and food systems, d  evelop responsible youth, s  trengthen and sustain families, c  onserve and improve the environment and natural resources, and b  uild quality communities.","year_est":"1952","additional_questions":"Question: Question 1: Program Focus     Please check which of the following focus areas are primary elements of the proposed program.      Select the one that is most relevant to your program's focus. This selection will help us with assigning reviewers. Note: All eligible projects must primarily focus on children under the age of 18.  Learn more in our FAQs . Answer: Indigenous Food Justice: Projects and policy work supporting kids advancing food sovereignty, or engaging with, gathering, growing, and cooking Indigenous foods.\n\nQuestion: Question 2: Innovation     How does your proposed project offer both an innovative and impactful approach that advances food justice for kids?      \"Innovative\" doesn't necessarily mean new technology or a novel approach. Whether rooted in traditional knowledge, adapted from successful models in other communities, or offering a novel approach to persistent challenges, we want to understand what makes your approach unique and why you believe it will create meaningful change.   Please also share any evidence of past results, related outcomes, and/or qualitative or quantitative indicators that demonstrate the promise of your approach. Answer: EBCI 4-H's approach to advancing food justice for kids is innovative and impactful because we center Cherokee traditional knowledge as a living, place-based system, rather than isolated nutrition lessons, EBCI 4-H provides hands-on, culturally relevant experiences where youth grow, gather, cook, and share food within their own community. Learning is grounded in land, language, and intergenerational teaching, including harvesting traditional foods, cultivating heirloom crops and heritage breeds, as well as preparing meals with locally sourced, Cherokee foods.     Our model emphasizes in-person, experiential curriculum provided by safe adults, including Cherokee language speakers, and place-based field trips across the local food system. From production to preparation, youth are building both practical skills and food systems awareness. Youth gain meaningful leadership opportunities, like entering the Cherokee Indian Fair, while strengthening cultural identity and connection to nutritious, traditional foods.     In FY2025, 13 programs reached 1,609 youth through 109 contact hours! Outcomes include increased food systems knowledge, hands-on food harvesting experiences, increased skills in growing and preparing nutritious foods, increased agricultural career knowledge, increased Cherokee Language vocabulary, and experiences in community engagement. By rooting innovation in tradition, our approach creates lasting change and empowers youth to be future food systems leaders in their community.\n\nQuestion: Question 3: Community Power     How is your organization and/or project led by, collaborating with, and building power within the community you serve?     For example, how are children, caregivers, school leadership, and other relevant community leaders guiding your project and working in partnership in other aspects of your organizationâ€™s work? Answer: EBCI 4-H supports EBCI youth and families by strengthening whole-family development and preservation of essential Cherokee life skills such as sustainable farming and wild gathering practices, language retention, and leadership reflecting our Cherokee Seven Core Values. We prioritize collaboration with interdisciplinary, cross-sector programs and stakeholders to ensure we are meeting the real-world needs of our families by engaging with a variety of partners across the tribal government and surrounding community including:      Tribal programs:      Kituwah Preservation and Education Program     Cherokee Language Master Apprentice Program     Museum of the Cherokee People     EBCI Public Health & Human Services: Cherokee Choices     Qualla Boundary Public Library     Cherokee Youth Center- Boys and Girls Clubs of America     Tribal Foods Distribution commodity foods program     EBCI Natural Resources            Schools:       Cherokee Central Schools     New Kituwah Academy language immersion school      Teachers and adult volunteers            Community Partnerships and Coalitions:      Cherokee Boys Club--Ray Kinsland Leadership Institute and Cherokee Children's Home     Cherokee Children's Coalition Smart Start/LICC Team     Center for Native Health     Great Smoky Mountains National Park and Smokies Life Education Program     Swain Soil & Water Conservation District      U.S. Forest Service Job Corps     EBCI Community Clubs     North American Indigenous Womenâ€™s Association (NAIWA)/NAIWA Daughters           EBCI youth and families","website":"https://ebci.ces.ncsu.edu/","smartie_summary":"This organization connects with Cherokee Central Schools and New Kituwah Academy to connect youth with indigenous food education and Cherokee language learning opportunities.","smartie_goal_1":"From October 2026-July 2027 over 180 youth (Pre-K through 8th Grade) at Cherokee Central Schools and New Kituwah Academy will increase their knowledge of traditional Cherokee foods and food ways while using their Cherokee language. Activities will include: garden visits (planting and harvesting), cooking/tasting demos, and field trips to identify and gather wild foods. Fluent Cherokee speakers and secondlanguage learners will advise on programming, accompany students, and provide Cherokee vocabulary for activities. \nSuccess Measures\nWe will track attendance at each garden visit and wild harvesting fieldtrip. We will conduct pre- and post- surveys measuring students’ knowledge of traditional foods, cooking skills expansion, program satisfaction, and Cherokee language vocabulary expansion.","smartie_goal_2":"From October 2026-July 2027 65 youth (3 rd through 8 th grade) at Cherokee Central Schools and New Kituwah Academy will increase their knowledge of nutrition and gain healthy cooking skills during hands-on cooking classes. Curriculum will include: “My Cherokee Plate” balanced eating to achieve To-hi, “Rethink Your Drink,” sugar content calculation, “Healthy Dupes” food swaps, and “Stoplight Guide” to identify goslow-woah foods. Cherokee elders and fluent speakers will assist with cooking demo instruction and showcasing traditional food preparation techniques. \nSuccess Measures\nWe will track attendance at each cooking class. We will conduct pre- and postsurveys measuring students’ knowledge of nutrition labels, building a healthy plate (to include traditional food choices), and practical cooking skills including kitchen safety, knife skills, food prep, etc. as well as program satisfaction.","smartie_goal_3":"From October 2026-May 2027, 130 youth (Pre-K through 6th grade) at Cherokee Central Schools and New Kituwah Academy will learn small-scale poultry production through 4-H embryology. Through classroom curriculum, students will incubate, hatch, and raise both chickens (tsi-ta-ga) and native Bobwhite quail (u-gu-gwe-hi). Families will have the opportunity to adopt chicks for egg/meat production at home. \nSuccess Measures\nWe will track attendance in each classroom hosting an in-class incubator. We will survey families who choose to adopt chicks. We will track students’ egg-to-production participation at each stage from classroom incubation to at-home brooding, to entering and showing their chickens at the Cherokee Indian Fair. Students who do not currently have at-home poultry housing may apply for education and resources via Cooperative Extension to develop their brooding and housing facilities. Families will also receive bestpractice education for raising and showing their animals.","smartie_goals":["From October 2026-July 2027 over 180 youth (Pre-K through 8th Grade) at Cherokee Central Schools and New Kituwah Academy will increase their knowledge of traditional Cherokee foods and food ways while using their Cherokee language. Activities will include: garden visits (planting and harvesting), cooking/tasting demos, and field trips to identify and gather wild foods. Fluent Cherokee speakers and secondlanguage learners will advise on programming, accompany students, and provide Cherokee vocabulary for activities. \nSuccess Measures\nWe will track attendance at each garden visit and wild harvesting fieldtrip. We will conduct pre- and post- surveys measuring students’ knowledge of traditional foods, cooking skills expansion, program satisfaction, and Cherokee language vocabulary expansion.","From October 2026-July 2027 65 youth (3 rd through 8 th grade) at Cherokee Central Schools and New Kituwah Academy will increase their knowledge of nutrition and gain healthy cooking skills during hands-on cooking classes. Curriculum will include: “My Cherokee Plate” balanced eating to achieve To-hi, “Rethink Your Drink,” sugar content calculation, “Healthy Dupes” food swaps, and “Stoplight Guide” to identify goslow-woah foods. Cherokee elders and fluent speakers will assist with cooking demo instruction and showcasing traditional food preparation techniques. \nSuccess Measures\nWe will track attendance at each cooking class. We will conduct pre- and postsurveys measuring students’ knowledge of nutrition labels, building a healthy plate (to include traditional food choices), and practical cooking skills including kitchen safety, knife skills, food prep, etc. as well as program satisfaction.","From October 2026-May 2027, 130 youth (Pre-K through 6th grade) at Cherokee Central Schools and New Kituwah Academy will learn small-scale poultry production through 4-H embryology. Through classroom curriculum, students will incubate, hatch, and raise both chickens (tsi-ta-ga) and native Bobwhite quail (u-gu-gwe-hi). Families will have the opportunity to adopt chicks for egg/meat production at home. \nSuccess Measures\nWe will track attendance in each classroom hosting an in-class incubator. We will survey families who choose to adopt chicks. We will track students’ egg-to-production participation at each stage from classroom incubation to at-home brooding, to entering and showing their chickens at the Cherokee Indian Fair. Students who do not currently have at-home poultry housing may apply for education and resources via Cooperative Extension to develop their brooding and housing facilities. Families will also receive bestpractice education for raising and showing their animals."],"strategy_1":"Direct Service and Education","strategy_2":"","scope_of_work":"Local","target_age_range":"Elementary - Middle School","special_populations":"Native Youth","location":"Cherokee, NC","note":"The Eastern Band of Cherokee Indians (EBCI) NC Cooperative Extensionâ€™s mission is to p reserve and protect Cherokee culture, e  nhance agriculture, forest, and food systems, d  evelop responsible youth, s  trengthen and sustain families, c  onserve and improve the environment and natural resources, and b  uild quality communities."},{"org":"Farm to School of Park County","app":"Crow Tribe & Park County Farm to School Cultural Exchange","name":"Crow Tribe & Park County Farm to School Cultural Exchange","application_link":"https://portal.justfund.us/f/application/39527","city":"Livingston","state":"MT","region":"Mountain Plains","finalist_type":"NOFHumanitix","portfolio":"Indigenous Food Justice","label":"Indigenous Food Justice","focus":"Education, Healthcare / Wellness / Public Health, Food Justice","strategies":"Advocacy, Capacity Building / Org Development, Coalition Building, Direct Service, Education, Organizing","scope":"Regional, Local","bipoc":"No","tax":"501c3","communities":"Rural, Youth, Youth: College, Youth: High School","budget":"$550,000","annual_budget":"$550,000","budget_value":550000,"budget_bucket":"$500K–$1M","grant_req":"$50,000","grant_request_value":50000,"mission":"Guiding schools and communities in building a prosperous local food culture that places healthy food on the plates and in the minds of all Park County children and their families","year_est":"2017","additional_questions":"Question: Question 1: Program Focus     Please check which of the following focus areas are primary elements of the proposed program.      Select the one that is most relevant to your program's focus. This selection will help us with assigning reviewers. Note: All eligible projects must primarily focus on children under the age of 18.  Learn more in our FAQs . Answer: Indigenous Food Justice: Projects and policy work supporting kids advancing food sovereignty, or engaging with, gathering, growing, and cooking Indigenous foods.\n\nQuestion: Question 2: Innovation     How does your proposed project offer both an innovative and impactful approach that advances food justice for kids?      \"Innovative\" doesn't necessarily mean new technology or a novel approach. Whether rooted in traditional knowledge, adapted from successful models in other communities, or offering a novel approach to persistent challenges, we want to understand what makes your approach unique and why you believe it will create meaningful change.   Please also share any evidence of past results, related outcomes, and/or qualitative or quantitative indicators that demonstrate the promise of your approach. Answer: This project takes a new approach to food justice by connecting youth from two Montana communities - Park County and the Crow (ApsÃ¡alooke) region - through shared learning about food, land and culture.   Instead of one-way teaching, this is a true exchange. Students and educators from both places learn from each other. Hardin School District brings strong experience with Indigenous foods like buffalo and native plants in gardens and school meals. Farm to School of Park County brings deep experience in school gardens, scaled school farm operations and hands-on food & nutrition education across six schools. Together, we will co-create Indigenous-informed gardens and learning spaces in both communities.   This project is innovative because it centers Indigenous food knowledge and youth leadership, not just classroom lessons. Students learn how food connects to history, identity and justice through real-world experiences.   Both programs already show strong results. Park County reaches 2,000+ students each year through 11 farms and gardens and 650+ food education lessons annually. Hardin has grown from a few lessons a month to 30+ hands-on sessions, including a Native orchard and culturally based food learning.   The impact will be lasting: stronger food knowledge, deeper cultural understanding, and a summertime cultural exchange program that will last for years, with a model that other communities can use, too.\n\nQuestion: Question 3: Community Power     How is your organization and/or project led by, collaborating with, and building power within the community you serve?     For example, how are children, caregivers, school leadership, and other relevant community leaders guiding your project and working in partnership in other aspects of your organizationâ€™s work? Answer: This project is built through close partnership between students, schools, and community members in both Park County and the Crow (ApsÃ¡alooke) region. It is not a top-down program - people closest to the work help shape it.   Students are at the center. They help decide what is grown in school gardens, take part in hands-on lessons, and give feedback that shapes future programming. Their learning and interests directly guide what we do next.   School staff, especially nutrition leaders, connect the work to real school needs like cafeteria meals and district wellness goals. Teachers and food service staff work alongside our team to make sure the program fits into the school day and can be sustained over time.   Farm to School educators in both communities play a key leadership role. They guide programs to be culturally relevant, engaging and impactful.   Families and community members join through garden events, harvests, and school activities, helping connect student learning back home.","website":"http://www.f2spc.org","smartie_summary":"This organization promotes indigenous food sovereignty through indigenous food education and culturally-informed Farm to School opportunities. This organization additionally offers youth leadership development in the form of internships for high school students.","smartie_goal_1":"From Oct 2026- Sept 2027, engage ~50 middle and high school students (grades 8–12) from Livingston and Hardin in at least three culturally grounded Farm to School exchange experiences (in-person or virtual). Experiences will focus on Indigenous food systems, traditional foodways, and local agriculture, and will be co-developed with Crow (Apsáalooke) educators. Priority participation for Native and low-income youth.\nSuccess Measures\n● Number and % of eligible students participating (target: 25-40%) ● At least 75% complete at least 3 exchange experiences ● At least 75% demonstrate increased knowledge or skills (pre/post or reflection) ● Partner/educator feedback confirms quality and cultural relevance","smartie_goal_2":"From June to August 2027, engage 15–25 high school students (grades 9–12) in a paid internship/apprenticeship, with each participant completing at least 40 hours of hands-on work in farming, gardening, and food systems, including Indigenous agriculture practices.\nSuccess Measures\n● Number and % of eligible students participating ● At least 75% complete 40+ hours ● At least 75% demonstrate growth in skills or knowledge (pre- and post- tests) ● Participant reflections and supervisor evaluations","smartie_goal_3":"By September 2027, Co-design and begin implementation of Indigenous-informed din, strengthening culturally relevant growing practices and learning environments.\nSuccess Measures\n● Co-developed plans and initial implementation completed in both communities ● At least 5 culturally relevant plant species incorporated ● Sites integrated into instruction (target: used by foodservice and at least 50% of students/classrooms annually) ● At least 2 cross-community exchange or learning activities completed"],"strategy_1":"Direct Service and Education","strategy_2":"Youth training and development","scope_of_work":"Local","target_age_range":"Middle-High School","special_populations":"All Youth","location":"Livingston, MT","note":"Guiding schools and communities in building a prosperous local food culture that places healthy food on the plates and in the minds of all Park County children and their families"},{"org":"Flandreau Santee Sioux Tribe","app":"Flandreau Santee Sioux Tribe-Indigenous Food Justice for Youth","name":"Flandreau Santee Sioux Tribe-Indigenous Food Justice for Youth","application_link":"https://portal.justfund.us/f/application/39423","city":"Flandreau","state":"SD","region":"Mountain Plains","finalist_type":"NOFHumanitix","portfolio":"Indigenous Food Justice","label":"Indigenous Food Justice","focus":"Environmental Justice / Climate Justice / Nature, Equitable Development, Food Justice","strategies":"Advocacy, Capacity Building / Org Development, Culture, Education, Healing / Restorative Justice, Policy","scope":"Regional","bipoc":"Yes","tax":"Federally recognized tribe","communities":"Indigenous, Rural, Youth","budget":"$81,490,209","annual_budget":"$81,490,209","budget_value":81490209,"budget_bucket":"$25M+","grant_req":"$50,000","grant_request_value":50000,"mission":"Mission statement*:    The Flandreau Santee Sioux Tribe (FSST) focuses on serving immediate needs while supporting long-term solutions, aiming for a self-sufficient, culturally strong community. They prioritize developing economic opportunities, preserving traditions, and providing for the well-being of their people on the Flandreau Santee Sioux Tribe in Flandreau, South Dakota.           Self-Sufficiency & Economic Development:    Advancing economic opportunities, including gaming, agriculture, and energy projects, to increase self-reliance and reduce poverty.      Cultural Preservation:    Preserving traditions, culture, and educational initiatives for both members and non-members.      Community Well-being:    Providing robust social services to ensure safe, healthy, and well-balanced families and individuals.      Environmental Stewardship:    Investing in sustainable infrastructure and monitoring natural resources","year_est":"1936","additional_questions":"Question: Question 1: Program Focus     Please check which of the following focus areas are primary elements of the proposed program.      Select the one that is most relevant to your program's focus. This selection will help us with assigning reviewers. Note: All eligible projects must primarily focus on children under the age of 18.  Learn more in our FAQs . Answer: Indigenous Food Justice: Projects and policy work supporting kids advancing food sovereignty, or engaging with, gathering, growing, and cooking Indigenous foods.\n\nQuestion: Question 2: Innovation     How does your proposed project offer both an innovative and impactful approach that advances food justice for kids?      \"Innovative\" doesn't necessarily mean new technology or a novel approach. Whether rooted in traditional knowledge, adapted from successful models in other communities, or offering a novel approach to persistent challenges, we want to understand what makes your approach unique and why you believe it will create meaningful change.   Please also share any evidence of past results, related outcomes, and/or qualitative or quantitative indicators that demonstrate the promise of your approach. Answer: Indigenous Food Justice for Youth       Flandreau Santee Sioux Tribe       April 21, 2026                 Alignment   : To what extent does the organization/project focus its work with children under the age of 18 and align with the Food Justice for Kids Prize priority program areas: Indigenous Food Justice or Nutrition Education & School Food?        The Flandreau Santee Sioux Tribe advances Indigenous food justice for youth by connecting seed-to-table experiences with hands-on nutritional education.   The initiative engages youth in harvesting, preparing, and learning about traditional food, fostering cultural connection alongside healthy eating habits.   Central to this effort is the development of a community garden, which serves as a living classroom where youth grow Indigenous crops, learn sustainable agricultural practices and participate in the full cycle of food production.   During the 2024-2025 academic year, Flandreau Public Elementary School enrolled approximately 274 students, with 60.6% received free or reduced-priced lunch. The middle school enrolled 186 students, with 49.5% receiving free or reduced-priced lunch, and the high school enrolled 184 students, with 45.1% participating in the same program highlighting a significant need for equitable access to nutritious food. Our hope is to enroll 10% of the approximately 400 youth in the middle and high school level in the Indigenous Food Justice for Youth program.     Rooted in the Flandreau Santee Sioux Tribeâ€™s long-standing understanding of the connection between food, nutrition, and overall well-being, the initiative integrates educational nutritional activities with the Indian Health Service, campus center and the Flandreau public schools. By connecting the community garden to school-based learning and teachings grounded in Tribal culture and language, the program ensures that youth not only gain access to nutrient-rich Indigenous foods but also develop the nutritional knowledge and practices that support lifelong wellness, cultural resilience, and food sovereignty.              Evidence of Impact:    To what extent does the organization/project have demonstrable evidence of past impact and/or potential for future impact, in regard to food justice for kids and the selected priority program area?          This provides the opportunity for FSST to demonstrate impact through youth-oriented garden programs, traditional food workshops and culturally grounded nutrition education that increase children's access to healthy indigenous foods and knowledge of wellness practices. FSST is looking to establish partnerships including potential collaboration with IHS, Campus Center, and the community youth (grades 6-12) to improve youth nutrition, cultural connection and long-term wellness outcomes. Pre-post testing of the program will highlight youth of traditional foods and their connection to wellness, cultural resilience and food sovereignty.              Innovative Approach:    To what extent does the organization/project offer a unique approach that could improve the status quo with regard to food justice for kids?        FSST would like to cultivate native foods that are most appropriate for Midwest Region-growth Zone 4 such American plum, chokecherry, golden current, wild spinach, woodland strawberries, sage, black walnut and native hazelnut to name a few.   Through our collaboration with IHS, Campus Center and the Flandreau school.                Community Power:    To what extent is the organization/project led by, collaborating with, and building power within the communities it seeks to serve?        This project is developed through collaboration between the Campus Community Center, students, the Indian Health Services, Flandreau school to support Native food access and wellness. The campus community center will coordinate the planning and design of the garden, working with students and the Flandreau Santee Sioux Tribe community members to create a space where traditional and healthy foods can be grown.   Through this shared effort, the garden will reflect community priorities and provide hands-on learning opportunities connected to Native food systems.     The campus community center will also serve as the space where students will gather to prepare meals using food grown in the garden. In partnership with the Indian Health Services (HIS), a nutritionist will provide guidance on healthy meal preparation, and culturally relevant nutrition.     Together, these partnerships create a supportive environment where students can learn more about growing food, preparing healthy meals, and strengthening community connections around Native food and wellness.              Ease of Implementation:    To what extent does the organization/project have a realistic plan with clearly defined goals, adequate resources, the right stakeholder engagement, and a clear path to progress?       The project has a clear and realistic implementation plan built on existing campus partnerships and resources. The campus community center will coordinate the project by organizing volunteers, supporting the design and setup of the garden, and providing space for food preparation and learning activities.   Students will participate in planting, maintaining and harvesting the garden, creating hands-on opportunities to learn about growing food and supporting a sustainable campus food source.        Established relationships with campus staff and community partners ensure that the project can be implemented efficiently with shared responsibility and strong stakeholder engagement.     In partnership with IHS, a nutritionist will provide guidance on health meal preparation and culturally relevant nutrition connected to the foods grown in the garden. The campus community center will host workshops where students prepare meals using garden produce, helping connect food production with healthy cooking and community learning.     With clear roles, accessible resources, and committed partners, the project has a practical path forward to create a sustainable garden program that supports student engagement, food access, and community wellness.              Program Components         A.         FSST Community Garden and Land-Based Learning       Allocated: $25,000       Goals:        Â·       Establish or expand the FSST garden (clinic and community center)       Â·       Grow traditional crops such as beans, squash, sage, sweetgrass, and other culturally significant plants       Â·       Create youth internship and master gardener position      Activities   :       Â·       Youth-led planting, harvesting, and seed saving       Â·       Workshops on Indigenous agricultural methods and environmental stewardship      Budget Breakdown:        Â·       Tree, bushes and indigenous plantings and tools -$10,000       Â·       Seed, soil amendments, irrigation - $5,000       Â·       Youth stipends (10-15 youths) - $7,000       Â·       Cultural instruction (handouts and take-home bag), elder knowledge sharing $3,000      Expected Outcomes:         Â·       Increased access to fresh Indigenous foods       Â·       10-15 youth trained in food growing and sovereignty practices       Â·       Reclaimed traditional growing knowledge                    B.         Indigenous Food Education, Nutrition and Preparation Program       Allocated: $25,000       Goals      Empower Flandreau Santee Sioux youth to build knowledge of food justice, nutrition, and traditional food systems by engaging in garden harvesting, cooking, and cultural food education that strengthen healthy choices and cultural conservancy.       Â·       Establish a series of 6 lessons       Â·       Harvest garden foods       Â·       Students will attend sessions with IHS       Â·       Learn about nutrition and meal preparation       Activities:        Â·       Students will plant, maintain and harvest the garden       Â·       Learn about the nutrition of the products     Story telling of Native foods and meal preparation      Budget Breakdown:        Â·       Project coo ttendance by June 2027 of approximately 400 youth (grades 6-12)","Improve student understanding of traditional foods, wellness, cultural resilience, and food sovereignty by 75% by the end of the program, including at least two sessions with elders or cultural knowledge keepers and nutritional education support from Indian Health Servies.\nSuccess Measures\n75% of students demonstrate measurable improvement through pre/post assessments and reflections","Deliver six hands-on garden-to-classroom sessions through after school programming at the Wicoicaga Otipi Community Center on the Flandreau Santee Sioux Tribe, with at least 80% of the students demonstrating competency in planting, harvesting and preparing traditional foods.\nSuccess Measures\nAt least 6 sessions annually, with 80% of participants reporting increased confidence.  By the end of the program participating in youth will earn culturally meaningful participation badges (medicine wheel, or eagle fathers) to recognize their learning and involvement."],"strategy_1":"Direct Service and Education","strategy_2":"","scope_of_work":"Local","target_age_range":"Middle-High School","special_populations":"Native Youth","location":"Flandreau, SD","note":"Mission statement*:    The Flandreau Santee Sioux Tribe (FSST) focuses on serving immediate needs while supporting long-term solutions, aiming for a self-sufficient, culturally strong community. They prioritize developing economic opportunities, preserving traditions, and providing for the well-being of their people on the Flandreau Santee Sioux Tribe in Flandreau, South Dakota.           Self-Sufficiency & Economic Development:    Advancing economic opportunities, including gaming, agriculture, and energy projects, to increase self-reliance and reduce poverty.      Cultural Preservation:    Preserving traditions, culture, and educational initiatives for both members and non-members.      Community Well-being:    Providing robust social services to ensure safe, healthy, and well-balanced families and individuals.      Environmental Stewardship:    Investing in sustainable infrastructure and monitoring natural resources"},{"org":"Salamatof Tribe","app":"Salamatof Tribe Youth-Led Food and Agriculture Engagement Project","name":"Salamatof Tribe Youth-Led Food and Agriculture Engagement Project","application_link":"https://portal.justfund.us/f/application/40685","city":"Soldotna","state":"AK","region":"Western","finalist_type":"NOFHumanitix","portfolio":"Indigenous Food Justice","label":"Indigenous Food Justice","focus":"Education, Other, Food Justice","strategies":"Capacity Building / Org Development, Culture, Education, Leadership Development","scope":"Local","bipoc":"Yes","tax":"Federally recognized tribe","communities":"Indigenous, Youth","budget":"$897,915","annual_budget":"$897,915","budget_value":897915,"budget_bucket":"$500K–$1M","grant_req":"$47,603","grant_request_value":47603,"mission":"The mission of the Salamatof Tribe is to exercise its sovereign rights and powers, to preserve the integrity of the Tribal history and culture and to improve the lives of its Tribal citizens. In the exercise of Tribal rights, the Tribe will conserve and retain tribal lands and resources, establish and carryout justice pursuant to Denaâ€™ina Tribal law and customs and to increase the variety and quality of services provided to Tribal citizens.","year_est":"1993","additional_questions":"Question: Question 1: Program Focus     Please check which of the following focus areas are primary elements of the proposed program.      Select the one that is most relevant to your program's focus. This selection will help us with assigning reviewers. Note: All eligible projects must primarily focus on children under the age of 18.  Learn more in our FAQs . Answer: Indigenous Food Justice: Projects and policy work supporting kids advancing food sovereignty, or engaging with, gathering, growing, and cooking Indigenous foods.\n\nQuestion: Question 2: Innovation     How does your proposed project offer both an innovative and impactful approach that advances food justice for kids?      \"Innovative\" doesn't necessarily mean new technology or a novel approach. Whether rooted in traditional knowledge, adapted from successful models in other communities, or offering a novel approach to persistent challenges, we want to understand what makes your approach unique and why you believe it will create meaningful change.   Please also share any evidence of past results, related outcomes, and/or qualitative or quantitative indicators that demonstrate the promise of your approach. Answer: The Salamatof Tribe is a federally recognized tribe located in southcentral Alaska with approximately 740 members and a service area that encompasses the rural communities of Sterling, Soldotna, Kalifornsky Beach, Kasilof, Kenai, North Kenai, Salamatof, and Nikiski, Alaska. Salamatof people have lived in the Cook Inlet area for centuries acquiring a deep traditional knowledge of seasonal cycles, ecology, and sustainable harvesting that guides food practices and stewardship of the land and waterways. We are committed to a future in which youth are engaged as leaders, lifelong leaders, and dedicated stewards of their community, environment, and culture. Our mission-driven approach is rooted in traditional knowledge and lifeways that have been passed down for generations.There is a local need for access to healthy culturally-relevant foods and increased food security.  The Kenai Peninsula Borough has an overall food insecurity rate of 14.4% according to Feeding Americaâ€™s Food Insecurity Rates for 2023 (https://map.feedingamerica.org/). The average meal cost in the Kenai Peninsula Borough is $4.85 per meal, much higher than the national average meal cost which is $3.58 per meal. The cost of purchasing nutritious food is high due to transportation costs associated with bringing food into remote areas. Food insecurity is a critical problem in rural Alaska, as it affects overall mental, emotional, and physical well-being. Traditional foods are integral to Salamatof culture, way of life, and self-sufficiency, and for many Salamatof members, access to traditional foods is difficult due to lack of transportation, poor health, or financial burden such as fuel prices. To address this issue and to take advantage of new community opportunities and resources, the Tribe is expanding programming to increase access to food through local food systems and the development of a newly acquired farm property in Soldotna, Alaska.   The Salamatof Berry Farm is being expanded as an operating farm, educational complex, and cultural healing center. The property was most recently operated as a farm that produced multiple varieties of berries which were sold fresh and processed into products such as syrups and jam. The four-acre farm will continue to be cultivated and harvested for fresh and processed products but will focus more on traditional Salamatof ways of harvesting and processing both wild-collected and farm-raised agricultural products.  In 2024, the Berry Farm produced over 2,480 pounds of berries including haskap berries, gooseberries, red currants, and black currants, many of which were turned into jams and syrups, canned, and distributed to local households through the Tribeâ€™s Food Distribution Program.    Salamatof Youth Services will use the newly acquired property to expand educational agricultural and cultural programming for youth to foster skills and knowledge, create economic opportunities, and support sustainable land stewardship. The farm will be a gathering space for Tribal members and the community to come together for learning opportunities, networking, and special events.\n\nQuestion: Question 3: Community Power     How is your organization and/or project led by, collaborating with, and building power within the community you serve?     For example, how are children, caregivers, school leadership, and other relevant community leaders guiding your project and working in partnership in other aspects of your organizationâ€™s work? Answer: Youth will lead, decide, and shape outcomes of the Project as well as influence local food systems. Youth will learn practical skills and confidence not only in agriculture and traditional harvesting, but also life skills, problem solving, and employability skills leading to wide reaching impacts with long term effects.The Kenai Peninsula has a growing and diverse agricultural community within southcentral Alaska. The Tribe works with a variety of federal, state, and local organizations that support small-scale farms and agricultural activities such as the U. S. Department of Agriculture, the Alaska Division of Agriculture, University of Alaska Climate Adaptation Science Center, University of Alaska Fairbanks Cooperative Extension Service, Kenai Soil and Water District, Kenai Peninsula Economic Development District, and Kenai Local Food Connection. The Berry Farm will be the hub of  community connection  for Salamatof Tribe, supporting diversity, equity, and inclusion efforts by focusing on the preservation of culture, inclusive decision-making, food security, and the health and well-being of all community members. Educational outreach is a core component of all Tribal programming including the sharing of traditions, skills, and language across generations and cultures. By fostering a cultural awareness and understanding of cultural traditions, the Tribe honors long-standing heritage and respect for ancestors. Decision making processes are inclusive and overseen by Tribal Council with input from Tribal members, Elders, staff, and youth advisors, ensuring all voices are heard. The Tribe advocates for health equity, education, and social programs that are designed to improve the well-being of all community members to ensure underserved groups within the Tribe (such as elderly, or those with disabilities) are able to receive the support they need. Youth and their families are encouraged to participate in talking circles to provide feedback about programming, improve services, and help plan future events and activities. The Tribe has always strived to maintain a sustainable  relationship-based approach to the land , food system management, and cultivation. Subsistence activities are core to everyday life ways. Lands and waterways managed by the Tribe provide resources for youth and Tribal members to hunt, fish, and harvest important foods and medicinal plants for personal use and economic development. Incorporating agricultural systems such as the Berry Farm and greenhouse will compliment subsistence activities and wild-harvested foods by extending the growing season, increasing the amount of food available, and providing nutrient-dense foods that are grown and eaten locally. The Salamatof Internship Program, After School Program, and Cultural Camps are overseen by Elders, Culture Bearers, and experienced staff members. Intergenerational transfer of knowledge is key to  cultural identity  and to ensure traditions continue to be carried forward. Elders and Culture Bearers have lived experiences and practical knowledge for sustainable harvesting, land stewardship, seasonal cycles, and situational awareness that is invaluable. Projects like the  Salamatof Tribe   Youth-Led Food and Agriculture Engagement Project  provide an opportunity for people of all ages to learn from each other in a reciprocal exchange of knowledge and relevant information reminding each other of the importance of sharing, and our responsibility to community. This social support system strengthens relationships and creates a foundation for broad community action. Specifically, the youth-led greenhouse will allow youth an equitable opportunity to become producers, planners, and advocates. Although youth will be guided by Elders, Culture Bearers, and staff, ultimately, they will be responsible for deciding what to grow based on what they, their peers, and their families want and will eat. They will not only learn to grow and prepare food but also learn to influence the outcomes of community priorities. The Salamatof Tribeâ€™s logo is based on an image of a kayaker maneuvering the waters of the Cook Inlet. This symbolizes the adaptability of the Tribe and Tribal members to respond to any situation with wisdom and  resilience . The Tribe continues to blend traditional methods with new technologies and current methods, looking to the future to maintain the health and success of the land and our people. Adaptation has always been fundamental to survival. This has become especially important in recent years with developing concerns around climate change.  The Salamatof community and Alaskan residents are on the front lines of climate change. In many cases, it is unclear how climate change will specifically affect the plants, animals, and people of southcentral Alaska and the compounding consequences that will be felt regionally and worldwide.  This is why it is important to develop a diverse set of complimentary and adaptable local food systems, utilizing wild-harvested foods and cultivated foods from a variety of sources, and uplift youth to create a food-secure future.","website":"https://salamatoftribe.com","smartie_summary":"This organization aims to increase culturally relevant nutrition education access in collaboration with Cultural Camps and an After School Program -- the project emphasizes strengthening youth connections to food,land, and community through leadership development and nutrition education opportunities.","smartie_goal_1":"Increase the amount and access to healthy, fresh, and locally grown food for 70 youth participants (ages 9-18) incorporated into at least 50% of the Cultural Camps and After School Program snacks/meals from June 2027 to October 2027. Youth-led greenhouse operations will be overseen by Salamatof staff, Elders, and parent volunteers. Culture Camps and the After School Program are open to all students (ages 9-18) in the Salamatof service area with access to transportation provided by Youth Services. \nSuccess Measures\nWe will track the amount of fresh fruits, vegetables, and herbs harvested in the greenhouse through Harvest Logs which will track the type and amount (weight) of fresh produce harvested with the goal of harvesting 500 pounds by October 2027. Produce will be harvested, preserved, and incorporated into snacks and meals for the Cultural Camps and After School Program, integrating these items into at least 50% of the total number of snacks and meals provided throughout the performance period and tracked through Meal Plans and Activity Logs. Monthly Check-In’s with staff and participants will provide feedback for improvement of greenhouse operations and meal programs.","smartie_goal_2":"By October 2027, at least 75% of youth ages 9- 18 participating in the After School Program and Culture Camps will demonstrate increased knowledge and skills in nutrition, harvesting, food preparation, and basic cooking, as measured by pre- and postassessments and skill demonstrations. Seventy youth participants will engage in at least two hands-on Culture Camps (approximately 10-day camps) and weekly After School Programs (approximately 35 weeks) which will include gardening/harvesting activities and cooking experiences designed to be culturally relevant, age-appropriate, and accessible to participants of diverse backgrounds and abilities. Barriers to access will be addressed through the availability of transportation, free enrollment, and adaptive instruction as needed with a target of 80% consistent attendance and participation. (Based on Kenai Peninsula Borough School District’s attendance rate which was 80.19% in 2023.) \nSuccess Measures\nWe will measure knowledge growth and skill development through pre- and post- program surveys designed to measure understanding of concepts such as nutrition, harvesting, food preparation, and basic cooking with an increase of scores by at least 20%. Youth will engage and participate in food preparation for After School Program and Culture Camp snacks and meals to demonstrate skill development. Staff will use Observation Checklists to track the percentage of participants who can independently complete key tasks such as safely using kitchen tools, preparing a simple recipe, and identifying and harvesting produce correctly with a goal of 75% of youth receiving a “pass” score. Monthly youth-led Talking Circles will provide continuous feedback and ideas for meal planning, lesson development, and program improvements throughout the grant period. We will maintain detailed sign-in sheets and attendance records for all Camps and After School Programs with a goal of 80% consistent attendance.","smartie_goal_3":"Provide hands-on agricultural educational opportunities and strengthen youth connections between food, land, and community for at least 8 youth interns (ages 14-18) by providing daily training, educational programs, and oversight at the Berry Farm greenhouse from June 2027 – October 2027. Staff and Elders will develop culturally appropriate lessons and work assignments for youth interns to develop skills and gain knowledge in traditional harvesting methods, agriculture, greenhouse operations, and food processing. Youth will have input in their specific project assignments and learning track. Internships are open to all youth ages 14-18. \nSuccess Measures\nWe will track the number of interns (at least 8), number of hours dedicated (up to 240 hours each), and types of projects/work assignments completed with a goal of 1920 intern hours worked. A participant feedback survey will be distributed at the end of the Internship Program (October 2027) with a goal of reaching at least 85% positive feedback.","smartie_goals":["Increase the amount and access to healthy, fresh, and locally grown food for 70 youth participants (ages 9-18) incorporated into at least 50% of the Cultural Camps and After School Program snacks/meals from June 2027 to October 2027. Youth-led greenhouse operations will be overseen by Salamatof staff, Elders, and parent volunteers. Culture Camps and the After School Program are open to all students (ages 9-18) in the Salamatof service area with access to transportation provided by Youth Services. \nSuccess Measures\nWe will track the amount of fresh fruits, vegetables, and herbs harvested in the greenhouse through Harvest Logs which will track the type and amount (weight) of fresh produce harvested with the goal of harvesting 500 pounds by October 2027. Produce will be harvested, preserved, and incorporated into snacks and meals for the Cultural Camps and After School Program, integrating these items into at least 50% of the total number of snacks and meals provided throughout the performance period and tracked through Meal Plans and Activity Logs. Monthly Check-In’s with staff and participants will provide feedback for improvement of greenhouse operations and meal programs.","By October 2027, at least 75% of youth ages 9- 18 participating in the After School Program and Culture Camps will demonstrate increased knowledge and skills in nutrition, harvesting, food preparation, and basic cooking, as measured by pre- and postassessments and skill demonstrations. Seventy youth participants will engage in at least two hands-on Culture Camps (approximately 10-day camps) and weekly After School Programs (approximately 35 weeks) which will include gardening/harvesting activities and cooking experiences designed to be culturally relevant, age-appropriate, and accessible to participants of diverse backgrounds and abilities. Barriers to access will be addressed through the availability of transportation, free enrollment, and adaptive instruction as needed with a target of 80% consistent attendance and participation. (Based on Kenai Peninsula Borough School District’s attendance rate which was 80.19% in 2023.) \nSuccess Measures\nWe will measure knowledge growth and skill development through pre- and post- program surveys designed to measure understanding of concepts such as nutrition, harvesting, food preparation, and basic cooking with an increase of scores by at least 20%. Youth will engage and participate in food preparation for After School Program and Culture Camp snacks and meals to demonstrate skill development. Staff will use Observation Checklists to track the percentage of participants who can independently complete key tasks such as safely using kitchen tools, preparing a simple recipe, and identifying and harvesting produce correctly with a goal of 75% of youth receiving a “pass” score. Monthly youth-led Talking Circles will provide continuous feedback and ideas for meal planning, lesson development, and program improvements throughout the grant period. We will maintain detailed sign-in sheets and attendance records for all Camps and After School Programs with a goal of 80% consistent attendance.","Provide hands-on agricultural educational opportunities and strengthen youth connections between food, land, and community for at least 8 youth interns (ages 14-18) by providing daily training, educational programs, and oversight at the Berry Farm greenhouse from June 2027 – October 2027. Staff and Elders will develop culturally appropriate lessons and work assignments for youth interns to develop skills and gain knowledge in traditional harvesting methods, agriculture, greenhouse operations, and food processing. Youth will have input in their specific project assignments and learning track. Internships are open to all youth ages 14-18. \nSuccess Measures\nWe will track the number of interns (at least 8), number of hours dedicated (up to 240 hours each), and types of projects/work assignments completed with a goal of 1920 intern hours worked. A participant feedback survey will be distributed at the end of the Internship Program (October 2027) with a goal of reaching at least 85% positive feedback."],"strategy_1":"Direct Service and Education","strategy_2":"Youth training and development","scope_of_work":"Local","target_age_range":"Elementary - High School","special_populations":"Native Youth","location":"Soldotna, AK","note":"The mission of the Salamatof Tribe is to exercise its sovereign rights and powers, to preserve the integrity of the Tribal history and culture and to improve the lives of its Tribal citizens. In the exercise of Tribal rights, the Tribe will conserve and retain tribal lands and resources, establish and carryout justice pursuant to Denaâ€™ina Tribal law and customs and to increase the variety and quality of services provided to Tribal citizens."},{"org":"Wozu, Inc","app":"Wozu Food Justice","name":"Wozu Food Justice","application_link":"https://portal.justfund.us/f/application/38360","city":"Cannon Ball","state":"ND","region":"Mountain Plains","finalist_type":"NOFHumanitix","portfolio":"Indigenous Food Justice","label":"Indigenous Food Justice","focus":"Environmental Justice / Climate Justice / Nature, Economic Justice, Food Justice","strategies":"Capacity Building / Org Development, Coalition Building, Culture, Healing / Restorative Justice, Leadership Development, Research","scope":"National, Local","bipoc":"Yes","tax":"501c3","communities":"Indigenous","budget":"$1,500,000","annual_budget":"$1,500,000","budget_value":1500000,"budget_bucket":"$1M–$5M","grant_req":"$49,000","grant_request_value":49000,"mission":"As a place-based entity, we preserve, nourish and advance the quality of the earth and life for all people and communities, we are planting seeds of change.","year_est":"2021","additional_questions":"Question: Question 1: Program Focus     Please check which of the following focus areas are primary elements of the proposed program.      Select the one that is most relevant to your program's focus. This selection will help us with assigning reviewers. Note: All eligible projects must primarily focus on chil
