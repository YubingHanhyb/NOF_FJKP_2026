s in underserved communities through the power of healthy foods and human connection.   FEAST works to address health disparities that disproportionately impact marginalized communities facing food insecurity and diet-related diseases. Guided by Food, Education, Access, Support, Together (FEAST), we offer free programs that combine nutrition education, cooking demonstrations, and sharing circles, empowering families to improve their physical health and strengthen social connections for overall well-being."},{"org":"Project Healthy Community","app":"Growing Healthy Futures","name":"Growing Healthy Futures","application_link":"https://portal.justfund.us/f/application/40384","city":"Detroit","state":"MI","region":"Midwest","finalist_type":"NOFHumanitix","portfolio":"Nutrition Education & School Food","label":"Nutrition Education & School Food","focus":"Education, Healthcare / Wellness / Public Health, Food Justice","strategies":"Direct Service, Education","scope":"Local","bipoc":"Yes","tax":"501c3","communities":"Black, Seniors, Youth, Youth: High School","budget":"$930,798","annual_budget":"$930,798","budget_value":930798,"budget_bucket":"$500K–$1M","grant_req":"$100,000","grant_request_value":100000,"mission":"Project Healthy Community is a Detroit-based public health nonprofit that provides school and community-based nutrition, fitness, and mental health education and services for Detroit kindergarteners through seniors.","year_est":"2013","additional_questions":"Question: Question 1: Program Focus     Please check which of the following focus areas are primary elements of the proposed program.      Select the one that is most relevant to your program's focus. This selection will help us with assigning reviewers. Note: All eligible projects must primarily focus on children under the age of 18.  Learn more in our FAQs . Answer: Nutrition Education & School Food: Projects and policy work supporting kids learning, growing, and cooking healthy and culturally relevant foods; eating nutritious and culturally relevant school meals and integrating local food in schools; or improving access to school meals.\n\nQuestion: Question 2: Innovation     How does your proposed project offer both an innovative and impactful approach that advances food justice for kids?      \"Innovative\" doesn't necessarily mean new technology or a novel approach. Whether rooted in traditional knowledge, adapted from successful models in other communities, or offering a novel approach to persistent challenges, we want to understand what makes your approach unique and why you believe it will create meaningful change.   Please also share any evidence of past results, related outcomes, and/or qualitative or quantitative indicators that demonstrate the promise of your approach. Answer: Project Healthy Communityâ€™s â€œGrowing Healthy Futuresâ€ program advances food justice by shifting students from passive recipients of food to active producers, decision-makers, and leaders within their school food systems.   With the elimination of SNAP-Ed fundingâ€”the nationâ€™s largest source of nutrition education for low-income communitiesâ€”thousands of Detroit students will lose access to evidence-based nutrition education programming that improves dietary behaviors and long-term health outcomes. This project sustains and expands that impact while embedding lasting, school-based food systems change.   The program operates through a three-part model: (1) nutrition education, (2) student-led food production, and (3) cafeteria integration, creating a continuous pathway from learning to access to systems change. Unlike traditional nutrition education or school garden models, this approach integrates food production directly into school meal systems, allowing students to influence what is served and consumed. During the grant period, PHC will expand this model across partner schools by implementing hydroponic systems, delivering nutrition education, and supporting student-led cafeteria integration activities.         The program begins with 5th grade students participating in structured nutrition education that builds foundational skills in identifying food marketing, navigating school food choices, and making culturally relevant, healthy decisions. At this stage, students are introduced to their role as health ambassadors within their school community. PHC has demonstrated strong outcomes through this work, including youth-reported increases in fruit consumption (89%) and vegetable consumption (71%).   Building on this foundation, middle and high school students step into hands-on hydroponic food production within their schools, applying their knowledge while developing skills in food systems, problem-solving, and teamwork, and beginning to take an active role in shaping their school food environment. In Detroit, long winters, limited green space, and soil contamination restrict traditional growing. Hydroponics removes these barriers, enabling year-round, school-based food production. This method of food production creates opportunities for dialogue centered on sustainability and access, while providing opportunities for youth to research, problem-solve, and practice teamwork.   This learning and production culminate in cafeteria integration, where students bring their work full circle by introducing the food they grow into their school meals. Student-grown produce is incorporated into salad bars, seasoning stations, and tasting programs, with students leading engagement efforts amongst their peers. At our current partner schools, students have already led cafeteria taste tests featuring greens they grew, collecting peer feedback and directly influencing which items are incorporated into school meals.   This approach directly addresses a key barrier identified by students: many report skipping school meals due to lack of freshness, taste, or relevance. When youth are positioned as leaders, the cafeteria becomes an interactive space where students shape both the food and the culture around it. Growing Healthy Futures combines education, access, and agency to transform how students experience food while creating sustainable, youth-driven change within school systems. The model integrates into existing school infrastructureâ€”including classrooms, cafeterias, and wellness initiativesâ€”making it scalable and replicable across urban school districts.\n\nQuestion: Question 3: Community Power     How is your organization and/or project led by, collaborating with, and building power within the community you serve?     For example, how are children, caregivers, school leadership, and other relevant community leaders guiding your project and working in partnership in other aspects of your organizationâ€™s work? Answer: Project Healthy Communityâ€™s work is supported by a long-standing partnership with Detroit Public Schools Community District (DPSCD) and deeply rooted within the communities we serve. For over a decade, PHC has collaborated with more than 20 schools and actively serves on the DPSCDâ€™s Wellness Committee, helping shape school health and nutrition policies and embed Project Healthy Community within district systems for long-term impact.   Students are central to the design and implementation of this project. Students are not only participantsâ€”they hold decision-making power. They determine what is grown, how it is used, and how it is introduced to their peers, directly shaping their school food environment. Through youth advisory groups and hands-on programming, students select tasting recipes and inform messaging. Youth own the hydroponic growing process from seed to harvest, and lead cafeteria taste tests and engagement activities for their peers. This positions youth as leaders and decision-makers within their school food environments, rather than passive recipients.    Family and caregiver engagement strengthens PHC programming. We provide take-home produce and recipes, host family tasting events, and welcome caregiver feedback. These strategies ensure that learning extends beyond the classroom and reflects the cultural preferences and lived experiences of our community.   School leadership and cafeteria staff are also key partners. Building upon long-held relationships with schools, PHC works closely with principals, teachers, and food service teams to co-design cafeteria strategies and integrate programming into the school day.   By centering youth voice, honoring community input, and embedding work within school systems, this project builds power within communities most impacted by inequitable food access and creates pathways for sustained, community-driven change.","website":"https://www.projecthealthycommunity.org/","smartie_summary":"The organization offers culturally relevant nutrition education, integrating hydroponic systems across Detroit schools to educate youth on sustainable food production and promoting student-grown food in school cafeterias.","smartie_goal_1":"Nutrition Education & Student Agency \nFrom October 2026 through September 2028, Project Healthy Community will deliver a multi-session, evidence-based nutrition education program to at least 1,000 Detroit students (grades 5–12, ages 10–18), where at least 75% qualify for free or reduced-price meals. Programming will be implemented across 8–10 schools, reaching an average of 2–3 classrooms per school per year with typical class sizes of 20–30 students. By the end of the program, at least 70% of participants will demonstrate increased confidence in making healthy food choices within their school and community environments. Programming will be informed by student input to ensure cultural relevance and alignment with real-world food environments.\n\nSuccess Measures\n● Number of students reached (target: 1,000) ● Pre/post surveys showing: ○ Increased fruit and vegetable consumption (≥60% improvement) ○ Increased confidence in making healthy food choices ○ Increased nutrition knowledge ● Lesson attendance and completion rates ● Student feedback and focus groups","smartie_goal_2":"Year-Round Hydroponic Food Production \nBetween October 2026 and September 2028, PHC will install and support 10 indoor hydroponic systems across Detroit middle and high schools (5 in Year 1, 5 in Year 2). Each system will engage a cohort of approximately 15–25 students in hands-on food production, directly reaching about 200 students total. These systems will also contribute to broader school-wide exposure by supplying produce for cafeteria use, reaching an additional 2,000–3,000 students total. These systems will address structural barriers—including climate, limited space, and soil contamination—by enabling year-round food production within schools. By the end of the grant period, at least 75% of participating schools will independently maintain systems and consistently harvest usable produce.\n\nSuccess Measures\n● Number of hydroponic systems installed (target: 10) ● Number of students directly engaged (target: ~200) ● Total pounds of produce grown annually ● System functionality and maintenance logs ● Percentage of schools independently maintaining systems (target: ≥75%) ● Student participation in planting, harvesting, and system management","smartie_goal_3":"Cafeteria Integration & School Food Environment Change \nFrom October 2026 through September 2028, PHC will integrate student-grown produce into school cafeterias in at least 8 partner schools, reaching approximately 2,000–3,000 students. In each school, cafeteria engagement strategies—including student-led taste tests, seasoning stations (herb and spice stations that allow students to customize fruits and vegetables), and peer-led promotion—will be implemented to reach the broader student body, typically 250–400 students per school. At least 60% of participating students will demonstrate increased willingness to try fruits and vegetables, and schools will adopt ongoing practices that promote healthy food choices.\n\nSuccess Measures\n● Number of schools integrating produce into cafeterias (target: 8+) ● Number of tasting events conducted annually ● Student participation counts (target: 2,000–3,000 reach) ● Pre/post surveys measuring willingness to try fruits and vegetables (target: ≥60% improvement) ● Documentation of cafeteria changes (tastings, seasoning stations, produce integration) ● Cafeteria staff collaboration logs","smartie_goals":["Nutrition Education & Student Agency \nFrom October 2026 through September 2028, Project Healthy Community will deliver a multi-session, evidence-based nutrition education program to at least 1,000 Detroit students (grades 5–12, ages 10–18), where at least 75% qualify for free or reduced-price meals. Programming will be implemented across 8–10 schools, reaching an average of 2–3 classrooms per school per year with typical class sizes of 20–30 students. By the end of the program, at least 70% of participants will demonstrate increased confidence in making healthy food choices within their school and community environments. Programming will be informed by student input to ensure cultural relevance and alignment with real-world food environments.\n\nSuccess Measures\n● Number of students reached (target: 1,000) ● Pre/post surveys showing: ○ Increased fruit and vegetable consumption (≥60% improvement) ○ Increased confidence in making healthy food choices ○ Increased nutrition knowledge ● Lesson attendance and completion rates ● Student feedback and focus groups","Year-Round Hydroponic Food Production \nBetween October 2026 and September 2028, PHC will install and support 10 indoor hydroponic systems across Detroit middle and high schools (5 in Year 1, 5 in Year 2). Each system will engage a cohort of approximately 15–25 students in hands-on food production, directly reaching about 200 students total. These systems will also contribute to broader school-wide exposure by supplying produce for cafeteria use, reaching an additional 2,000–3,000 students total. These systems will address structural barriers—including climate, limited space, and soil contamination—by enabling year-round food production within schools. By the end of the grant period, at least 75% of participating schools will independently maintain systems and consistently harvest usable produce.\n\nSuccess Measures\n● Number of hydroponic systems installed (target: 10) ● Number of students directly engaged (target: ~200) ● Total pounds of produce grown annually ● System functionality and maintenance logs ● Percentage of schools independently maintaining systems (target: ≥75%) ● Student participation in planting, harvesting, and system management","Cafeteria Integration & School Food Environment Change \nFrom October 2026 through September 2028, PHC will integrate student-grown produce into school cafeterias in at least 8 partner schools, reaching approximately 2,000–3,000 students. In each school, cafeteria engagement strategies—including student-led taste tests, seasoning stations (herb and spice stations that allow students to customize fruits and vegetables), and peer-led promotion—will be implemented to reach the broader student body, typically 250–400 students per school. At least 60% of participating students will demonstrate increased willingness to try fruits and vegetables, and schools will adopt ongoing practices that promote healthy food choices.\n\nSuccess Measures\n● Number of schools integrating produce into cafeterias (target: 8+) ● Number of tasting events conducted annually ● Student participation counts (target: 2,000–3,000 reach) ● Pre/post surveys measuring willingness to try fruits and vegetables (target: ≥60% improvement) ● Documentation of cafeteria changes (tastings, seasoning stations, produce integration) ● Cafeteria staff collaboration logs"],"strategy_1":"Direct Service and Education","strategy_2":"Youth training and development","scope_of_work":"Local","target_age_range":"Elementary - High School","special_populations":"All Youth","location":"Detroit, MI","note":"Project Healthy Community is a Detroit-based public health nonprofit that provides school and community-based nutrition, fitness, and mental health education and services for Detroit kindergarteners through seniors."},{"org":"FoodRight Inc.","app":"FoodRight - Youth Chef Academy","name":"FoodRight - Youth Chef Academy","application_link":"https://portal.justfund.us/f/application/39903","city":"Milwaukee","state":"WI","region":"Midwest","finalist_type":"NOFHumanitix","portfolio":"Nutrition Education & School Food","label":"Nutrition Education & School Food","focus":"Food Justice","strategies":"Education","scope":"Local","bipoc":"No","tax":"501c3","communities":"Youth","budget":"$618,600","annual_budget":"$618,600","budget_value":618600,"budget_bucket":"$500K–$1M","grant_req":"$100,000","grant_request_value":100000,"mission":"FoodRight works to ensure Milwaukee youth have the skills and opportunity to build lifelong healthy habits. Our mission is to empower young people to choose foods that sustain lifelong health while transforming the systems that shape what they eat every day. Through hands-on culinary education, community cooking programs, and systems-level advocacy, FoodRight helps youth, families, and schools build lifelong habits that nourish both bodies and communities. Our work extends from the classroom to the cafeteria to the community.","year_est":"2015","additional_questions":"Question: Question 1: Program Focus     Please check which of the following focus areas are primary elements of the proposed program.      Select the one that is most relevant to your program's focus. This selection will help us with assigning reviewers. Note: All eligible projects must primarily focus on children under the age of 18.  Learn more in our FAQs . Answer: Nutrition Education & School Food: Projects and policy work supporting kids learning, growing, and cooking healthy and culturally relevant foods; eating nutritious and culturally relevant school meals and integrating local food in schools; or improving access to school meals.\n\nQuestion: Question 2: Innovation     How does your proposed project offer both an innovative and impactful approach that advances food justice for kids?      \"Innovative\" doesn't necessarily mean new technology or a novel approach. Whether rooted in traditional knowledge, adapted from successful models in other communities, or offering a novel approach to persistent challenges, we want to understand what makes your approach unique and why you believe it will create meaningful change.   Please also share any evidence of past results, related outcomes, and/or qualitative or quantitative indicators that demonstrate the promise of your approach. Answer: FoodRight advances food justice for kids through a model that combines hands-on culinary education with youth-driven school food systems change. Through the Youth Chef Academy, students in Milwaukee Public Schools learn to cook healthy, affordable meals from scratch during the school day. This opportunity was largely lost when home economics programs were eliminated decades ago. By equipping students with practical cooking skills, nutrition knowledge, and food systems awareness, the program addresses a root cause of food injustice: lack of access to the knowledge and skills needed to prepare healthy foods.   What makes FoodRightâ€™s approach innovative is our layered design. Classroom learning is paired with the Good School Food Project, where students and parents serve as advocates who taste-test recipes, gather peer feedback, and work with school nutrition leaders to improve cafeteria meals so they are fresher, culturally relevant, and student-approved.    This connects individual behavior change with institutional food system reform, aligning with the Food Justice for Kids Prize goal of transforming how children access and experience healthy food. The approach is evidence-based and shows measurable impact. An independent evaluation published in the Journal of School Health found that Youth Chef Academy students increased fruit and vegetable consumption by one full serving per day and demonstrated significant gains in nutrition knowledge and classroom engagement. More than 65% of participating students report cooking meals at home with their families, extending benefits beyond the classroom.   Together, this combination of skill-building, youth leadership, and systemic school food improvement creates a scalable model that empowers children to shape healthier, more equitable food environments in their schools and communities.\n\nQuestion: Question 3: Community Power     How is your organization and/or project led by, collaborating with, and building power within the community you serve?     For example, how are children, caregivers, school leadership, and other relevant community leaders guiding your project and working in partnership in other aspects of your organizationâ€™s work? Answer: FoodRightâ€™s model is rooted in community leadership and partnership, ensuring that those most affected by food inequities help shape solutions. Our programs operate within Milwaukee Public Schools, where more than 80.8% of students are economically disadvantaged and the majority are youth of color. By embedding programming in schools, FoodRight collaborates directly with students, families, teachers, and district leaders to strengthen both food education and the school meal system.   Community voice is central to program design. Through the Good School Food Project, Youth Advocates conduct structured cafeteria taste tests, gather peer survey data, and present recommendations directly to school nutrition leadership. Parent Advocates participate in school wellness committees and advisory bodies, helping shape culturally relevant menu improvements and school health priorities. These roles ensure that families most affected by diet-related health disparities have a meaningful voice in shaping the public food systems that feed their children every day.   FoodRight also builds community power by equipping youth with practical skills and leadership opportunities. Through Youth Chef Academy, more than 1,200 students annually participate in multi-week culinary education where they prepare full meals from fresh ingredients while learning nutrition science, food systems concepts, and teamwork. Lessons connect classroom learning with real-world decision-making about food, health, and sustainability, helping students understand how food systems influence community well-being.   By combining youth leadership, parent advocacy, and evidence-based culinary education, FoodRight strengthens community capacity to influence school food environments and advance long-term food justice for Milwaukee children and families.","website":"https://www.foodright.org/","smartie_summary":"This organization promotes culinary education both in and out of schools, promoting fresh food production in homes to support equitable food access. This organization additionally aims to train school leaders to conduct cafeteria taste tests through the program's Youth Advocates and Parent Advocates program.","smartie_goal_1":"From October 2026 to September 2027, FoodRight will deliver Youth Chef Academy to 1,200 Milwaukee Public Schools students ages 5–18 across at least 50 classrooms. Students will participate in a 6-lesson culinary nutrition education program, preparing meals from fresh ingredients while building the skills, knowledge, and confidence to make healthy food choices. Programming will prioritize schools where the majority of students are economically disadvantaged and will introduce students to a variety of globally inspired, plant-forward recipes, expanding their exposure to new foods while incorporating student feedback into the learning experience.\n\nSuccess Measures\n● Track number of participating students, classrooms, and lessons delivered. ● Pre- and post-program student surveys measuring changes in nutrition knowledge, food preferences, and cooking confidence. ● Teacher feedback surveys measuring classroom engagement, teamwork, and application of academic skills during lessons. ● Participation data documenting the number of meals prepared and new foods introduced to students. ● At least 60% of students report cooking at home after participation ● At least 20% of students report trying a new vegetable or plant-based food","smartie_goal_2":"From October 2026 to September 2027, FoodRight will extend culinary nutrition education into the home and strengthen family engagement and equitable access to healthy food by distributing at least 1,000 take-home ingredient kits and Nutrition Education Reinforcement Items (NERI), and by offering community-based cooking experiences for students ages 5–18 and their caregivers. These activities will enable families to practice culinary skills at home and will prioritize participation from low-income school communities, addressing barriers such as limited access to ingredients and basic kitchen tools, while incorporating foods and recipes that families identify and enjoy.\n\nSuccess Measures\n● Number of ingredient kits distributed and families reached ● Attendance and participation in family cooking sessions or community cooking events ● Post-program surveys measuring changes in family confidence preparing healthy meals ● Qualitative feedback from families on cultural relevance, accessibility, and barriers to cooking at home ● At least 60% of participating families will report preparing meals at home using program recipes or ingredients","smartie_goal_3":"From October 2026 to September 2027, FoodRight will train and support at least 50 Youth Advocates and 25 Parent Advocates across 18 Milwaukee high schools through the Good School Food Project. Youth and parents will collaborate with school nutrition leaders to conduct cafeteria taste tests in at least 5 high schools, collect peer feedback, and influence improvements that increase meal appeal, access, and participation—reaching more than 6,000 secondary students.\n\nSuccess Measures\n● Number of Youth and Parent Advocates recruited, trained, and actively participating. ● Number of cafeteria taste tests and student surveys conducted. ● Documentation of recommendations presented to district nutrition leadership. ● Tracking adoption of new recipes/ menu changes influenced by youth feedback. ● Participation records from school wellness committees and advisory meetings. ● At least 4 menu items piloted/changed based on advocate input ● Increase school meal participation in participating high schools by 3–5% over baseline participation rates.","smartie_goals":["From October 2026 to September 2027, FoodRight will deliver Youth Chef Academy to 1,200 Milwaukee Public Schools students ages 5–18 across at least 50 classrooms. Students will participate in a 6-lesson culinary nutrition education program, preparing meals from fresh ingredients while building the skills, knowledge, and confidence to make healthy food choices. Programming will prioritize schools where the majority of students are economically disadvantaged and will introduce students to a variety of globally inspired, plant-forward recipes, expanding their exposure to new foods while incorporating student feedback into the learning experience.\n\nSuccess Measures\n● Track number of participating students, classrooms, and lessons delivered. ● Pre- and post-program student surveys measuring changes in nutrition knowledge, food preferences, and cooking confidence. ● Teacher feedback surveys measuring classroom engagement, teamwork, and application of academic skills during lessons. ● Participation data documenting the number of meals prepared and new foods introduced to students. ● At least 60% of students report cooking at home after participation ● At least 20% of students report trying a new vegetable or plant-based food","From October 2026 to September 2027, FoodRight will extend culinary nutrition education into the home and strengthen family engagement and equitable access to healthy food by distributing at least 1,000 take-home ingredient kits and Nutrition Education Reinforcement Items (NERI), and by offering community-based cooking experiences for students ages 5–18 and their caregivers. These activities will enable families to practice culinary skills at home and will prioritize participation from low-income school communities, addressing barriers such as limited access to ingredients and basic kitchen tools, while incorporating foods and recipes that families identify and enjoy.\n\nSuccess Measures\n● Number of ingredient kits distributed and families reached ● Attendance and participation in family cooking sessions or community cooking events ● Post-program surveys measuring changes in family confidence preparing healthy meals ● Qualitative feedback from families on cultural relevance, accessibility, and barriers to cooking at home ● At least 60% of participating families will report preparing meals at home using program recipes or ingredients","From October 2026 to September 2027, FoodRight will train and support at least 50 Youth Advocates and 25 Parent Advocates across 18 Milwaukee high schools through the Good School Food Project. Youth and parents will collaborate with school nutrition leaders to conduct cafeteria taste tests in at least 5 high schools, collect peer feedback, and influence improvements that increase meal appeal, access, and participation—reaching more than 6,000 secondary students.\n\nSuccess Measures\n● Number of Youth and Parent Advocates recruited, trained, and actively participating. ● Number of cafeteria taste tests and student surveys conducted. ● Documentation of recommendations presented to district nutrition leadership. ● Tracking adoption of new recipes/ menu changes influenced by youth feedback. ● Participation records from school wellness committees and advisory meetings. ● At least 4 menu items piloted/changed based on advocate input ● Increase school meal participation in participating high schools by 3–5% over baseline participation rates."],"strategy_1":"Direct Service and Education","strategy_2":"Youth training and development","scope_of_work":"Local","target_age_range":"Elementary - High School","special_populations":"All Youth","location":"Milwaukee, WI","note":"FoodRight works to ensure Milwaukee youth have the skills and opportunity to build lifelong healthy habits. Our mission is to empower young people to choose foods that sustain lifelong health while transforming the systems that shape what they eat every day. Through hands-on culinary education, community cooking programs, and systems-level advocacy, FoodRight helps youth, families, and schools build lifelong habits that nourish both bodies and communities. Our work extends from the classroom to the cafeteria to the community."},{"org":"Green Umbrella","app":"Green & Healthy Schools + Food Policy: Nourishing Kids, Shaping Systems","name":"Green & Healthy Schools + Food Policy: Nourishing Kids, Shaping Systems","application_link":"https://portal.justfund.us/f/application/40083","city":"Cincinnati","state":"OH","region":"Midwest","finalist_type":"NOFHumanitix","portfolio":"Nutrition Education & School Food","label":"Nutrition Education & School Food","focus":"Environmental Justice / Climate Justice / Nature, Food Justice","strategies":"Capacity Building / Org Development, Convening, Culture, Direct Action, Movement Building, Policy","scope":"Regional, Local","bipoc":"No","tax":"501c3","communities":"Black, Latino / Latina / Latinx, Women, Workers, Youth","budget":"$2,117,867","annual_budget":"$2,117,867","budget_value":2117867,"budget_bucket":"$1M–$5M","grant_req":"$50,000","grant_request_value":50000,"mission":"The mission of Green Umbrella is to lead cross-sector collaboration to accelerate climate change across Greater Cincinnati. We envision a vibrant region where climate planning is regional, collaborative, and guided by community voice, where education and resources are accessible and equitably distributed, and where out people, communities, and environments are interconnected and thriving. Everything we do at Green Umbrella is built around our core values of environmental stewardship, regional collaboration, community wellbeing, equity, and justice. Climate change is a threat multiplier. It intensifies issues such as public health inequities, unequal access to affordable housing, food insecurity, and poor environmental quality, and puts our most vulnerable populations at even greater risk. Low-income communities and communities of color suffer disproportionately from climate impacts, due to systemic issues and underinvestment. Green Umbrella is an opportunity multiplier -- we offer communities the opportunity to share knowledge, resources, and best practices. We enable collaboration on projects that impact the entire region. We are supporting our region through a massive transition -- a dramatic drawdown of emissions and investment in equity-focused resilience to the impacts of climate change. Our work is helping reduce emissions, build a resilient and equitable local food system, create and protect thriving greenspace, and support local communities to take action on their environmental and resilience priorities.","year_est":"2002","additional_questions":"Question: Question 1: Program Focus     Please check which of the following focus areas are primary elements of the proposed program.      Select the one that is most relevant to your program's focus. This selection will help us with assigning reviewers. Note: All eligible projects must primarily focus on children under the age of 18.  Learn more in our FAQs . Answer: Nutrition Education & School Food: Projects and policy work supporting kids learning, growing, and cooking healthy and culturally relevant foods; eating nutritious and culturally relevant school meals and integrating local food in schools; or improving access to school meals.\n\nQuestion: Question 2: Innovation     How does your proposed project offer both an innovative and impactful approach that advances food justice for kids?      \"Innovative\" doesn't necessarily mean new technology or a novel approach. Whether rooted in traditional knowledge, adapted from successful models in other communities, or offering a novel approach to persistent challenges, we want to understand what makes your approach unique and why you believe it will create meaningful change.   Please also share any evidence of past results, related outcomes, and/or qualitative or quantitative indicators that demonstrate the promise of your approach. Answer: Our project integrates school-based programming with systems-level policy changeâ€”linking Green & Healthy Schools (G&HS) with the Greater Cincinnati Food Policy Council (FPC), which are both programs of Green Umbrella, Greater Cincinnatiâ€™s Regional Climate Collaborative. This dual approach bridges hands-on food education (green schoolyards, nutrition education) with structural shifts in procurement, farm to school initiatives, and equitable access. The coordination of the G&HS model and the FPC creates a scalable framework for advancing food justice across entire school districts and regions - a model that can also be shared and scaled with food policy councils nationally.   The FPC strengthens this impact by addressing systemic barriers: supporting climate-friendly nutrition education, advocating for universal free school meals, and improving regional food distribution networks. By aligning education, procurement, and policy, our approach creates lasting changeâ€”ensuring all children, especially those in under-resourced communities, have access to fresh, healthy food.\n\nQuestion: Question 3: Community Power     How is your organization and/or project led by, collaborating with, and building power within the community you serve?     For example, how are children, caregivers, school leadership, and other relevant community leaders guiding your project and working in partnership in other aspects of your organizationâ€™s work? Answer: Through the Green & Healthy Schools framework, school districts, students, community members, and educators actively shape priorities, ensuring that nutrition education and access to healthy food reflect local needs and experiences. Schools function as community hubs, and this project strengthens their ability to convene community members, students, and staff in developing wellness policies and food initiatives that are both culturally relevant and responsive.   We build community power by creating networks that connect school leadership with public health agencies, nonprofits, and regional partners. Through workshops, toolkits, and regional convenings including our annual Green & Healthy Schools Symposium, we equip local leadersâ€”including educators and health practitionersâ€”to lead and sustain this work within their own communities. Partnerships with regional organizations like WeTHRIVE!, Interact for Health, and Civic Garden Center further embed community voice and expertise.   Our inclusive, networked approach ensures that those most impacted guide decision-making, strengthening equitable access to healthy food and long-term community resilience.","website":"https://greenumbrella.org/","smartie_summary":"This organization promotes nutrition education centered on foodservice, and food/access focused health agencies -- doing so supports the organization's goal of encouraging stakeholder collaboration across the region to improve equitable access to healthy foods.","smartie_goal_1":"From October 2026 to May 2027, we will engage 5 regional school districts in Green & Healthy Schools programming to convene a designated district nutrition education committee consisting of foodservice, curriculum and food/access focused health agencies. The goal is to ensure that health-based learning standards and nutrition education are included in the district wellness policy for students in grades K–12, with a focus on reaching at least 60% students from low-income families (as indicated by eligibility for free and reduced-price lunch). Programming will be co-designed with community partners, students, school staff, and through district wellness policy committees, ensuring equitable, culturally relevant approaches that build community power and support long-term systems change.\n\nSuccess Measures\nNumber of districts actively participating (target: 5) Committee Composition & Participation: Number and diversity of committee members (e.g., foodservice staff, educators, health agencies, students, caregivers), with documented meeting frequency and attendance Co-Design Evidence: Documentation of stakeholder input (meeting notes, surveys, or feedback) demonstrating meaningful participation from students, families, and community partners Policy Advancement: Number of districts that draft, revise, or adopt wellness policies that explicitly include nutrition education and health-based learning standards (target: all 5, with at least 3 adopting formal updates within the grant period) Number of students reached and demographic data (including % eligible for free/reduced lunch)","smartie_goal_2":"From October 2026 to May 2027, we will partner with 5 municipalities connected to participating school districts to advance community-informed food policy actions that improve equitable access to healthy food for children in grades K-12. In collaboration with community members, elected officials, and Food Policy Council partners, each municipality will identify and take action on at least one priority policy or systems change strategy (e.g. values-based procurement, support for farm-to-school, or expanded access to free school meals), strengthening alignment between local government and school food environments.\n\nSuccess Measures\nNumber of municipalities engaged (target: 5) Number and type of policy actions identified and initiated Evidence of community engagement in policy development (meetings, stakeholder participation, public input) Progress toward adoption or implementation of selected policy actions Increased alignment between municipal policies and school district food initiatives Qualitative feedback from partners on feasibility, equity impact, and sustainability of policy changes","smartie_goal_3":"","smartie_goals":["From October 2026 to May 2027, we will engage 5 regional school districts in Green & Healthy Schools programming to convene a designated district nutrition education committee consisting of foodservice, curriculum and food/access focused health agencies. The goal is to ensure that health-based learning standards and nutrition education are included in the district wellness policy for students in grades K–12, with a focus on reaching at least 60% students from low-income families (as indicated by eligibility for free and reduced-price lunch). Programming will be co-designed with community partners, students, school staff, and through district wellness policy committees, ensuring equitable, culturally relevant approaches that build community power and support long-term systems change.\n\nSuccess Measures\nNumber of districts actively participating (target: 5) Committee Composition & Participation: Number and diversity of committee members (e.g., foodservice staff, educators, health agencies, students, caregivers), with documented meeting frequency and attendance Co-Design Evidence: Documentation of stakeholder input (meeting notes, surveys, or feedback) demonstrating meaningful participation from students, families, and community partners Policy Advancement: Number of districts that draft, revise, or adopt wellness policies that explicitly include nutrition education and health-based learning standards (target: all 5, with at least 3 adopting formal updates within the grant period) Number of students reached and demographic data (including % eligible for free/reduced lunch)","From October 2026 to May 2027, we will partner with 5 municipalities connected to participating school districts to advance community-informed food policy actions that improve equitable access to healthy food for children in grades K-12. In collaboration with community members, elected officials, and Food Policy Council partners, each municipality will identify and take action on at least one priority policy or systems change strategy (e.g. values-based procurement, support for farm-to-school, or expanded access to free school meals), strengthening alignment between local government and school food environments.\n\nSuccess Measures\nNumber of municipalities engaged (target: 5) Number and type of policy actions identified and initiated Evidence of community engagement in policy development (meetings, stakeholder participation, public input) Progress toward adoption or implementation of selected policy actions Increased alignment between municipal policies and school district food initiatives Qualitative feedback from partners on feasibility, equity impact, and sustainability of policy changes"],"strategy_1":"Direct Service and Education","strategy_2":"","scope_of_work":"Regional","target_age_range":"Elementary - High School","special_populations":"All Youth","location":"Cincinnati, OH","note":"The mission of Green Umbrella is to lead cross-sector collaboration to accelerate climate change across Greater Cincinnati. We envision a vibrant region where climate planning is regional, collaborative, and guided by community voice, where education and resources are accessible and equitably distributed, and where out people, communities, and environments are interconnected and thriving. Everything we do at Green Umbrella is built around our core values of environmental stewardship, regional collaboration, community wellbeing, equity, and justice. Climate change is a threat multiplier. It intensifies issues such as public health inequities, unequal access to affordable housing, food insecurity, and poor environmental quality, and puts our most vulnerable populations at even greater risk. Low-income communities and communities of color suffer disproportionately from climate impacts, due to systemic issues and underinvestment. Green Umbrella is an opportunity multiplier -- we offer communities the opportunity to share knowledge, resources, and best practices. We enable collaboration on projects that impact the entire region. We are supporting our region through a massive transition -- a dramatic drawdown of emissions and investment in equity-focused resilience to the impacts of climate change. Our work is helping reduce emissions, build a resilient and equitable local food system, create and protect thriving greenspace, and support local communities to take action on their environmental and resilience priorities."},{"org":"Student Nutrition Services at San Francisco Unified School District","app":"Bridging the Refresh Gap -- Combatting School Food Stigma and Misinformation at SFUSD","name":"Bridging the Refresh Gap -- Combatting School Food Stigma and Misinformation at SFUSD","application_link":"https://portal.justfund.us/f/application/40478","city":"San Francisco","state":"CA","region":"Western","finalist_type":"NOFHumanitix","portfolio":"Nutrition Education & School Food","label":"Nutrition Education & School Food","focus":"Education, Healthcare / Wellness / Public Health, Food Justice","strategies":"Capacity Building / Org Development, Communications & Media, Culture, Direct Service, Education, Leadership Development","scope":"Local","bipoc":"No","tax":"Public School / Government Entity","communities":"Youth, Youth: High School","budget":"$31,000,000","annual_budget":"$31,000,000","budget_value":31000000,"budget_bucket":"$25M+","grant_req":"$37,380","grant_request_value":37380,"mission":"SFUSD's mission is to provide each and every student the quality instruction and equitable support required to thrive in the 21st century.   The district's core values include being Student-Centered, Fearless, United, committed to Social Justice, and Diversity-Driven.   Student Nutrition Services' mission is to nourish students every day with food that enables them to live healthy lives and thrive inside and outside the classroom. The department's 4 goals are: 1) Nourish our students with good food, 2) Create dignified built environments, 3) Support a thriving workforce, and 4) Build a strong food culture.","year_est":"1851","additional_questions":"Question: Question 1: Program Focus     Please check which of the following focus areas are primary elements of the proposed program.      Select the one that is most relevant to your program's focus. This selection will help us with assigning reviewers. Note: All eligible projects must primarily focus on children under the age of 18.  Learn more in our FAQs . Answer: Nutrition Education & School Food: Projects and policy work supporting kids learning, growing, and cooking healthy and culturally relevant foods; eating nutritious and culturally relevant school meals and integrating local food in schools; or improving access to school meals.\n\nQuestion: Question 2: Innovation     How does your proposed project offer both an innovative and impactful approach that advances food justice for kids?      \"Innovative\" doesn't necessarily mean new technology or a novel approach. Whether rooted in traditional knowledge, adapted from successful models in other communities, or offering a novel approach to persistent challenges, we want to understand what makes your approach unique and why you believe it will create meaningful change.   Please also share any evidence of past results, related outcomes, and/or qualitative or quantitative indicators that demonstrate the promise of your approach. Answer: SFUSDâ€™s Student Nutrition Servicesâ€™ (SNS) vision is to create a student-centered, equitable, and financially stable school food ecosystem with thriving employees that provides dignified meal experiences and engages all students in a positive food culture, through 4 central goals: 1) Nourish our students with good food, 2) Create dignified built environments, 3) Support a thriving workforce, and 4) Build a strong food culture. Currently, 20 of our middle and high schools, serving nearly 20,000 students, receive our Refresh meal program, in which meals are freshly prepared daily in the school kitchen, highlighting fresh, local, and sustainable ingredients. At many of these schools, SNS has made further infrastructural investments to support bulk line service and salad bars which feature seasonal produce. School meal programs are fundamentally food justice programs, bridging gaps in food access and increasing equity among students from diverse socioeconomic backgrounds. We know that eating school meals is associated with improved academic performance, reduced behavioral problems at school, and improved physical and emotional health, while saving time and money for families. Increasing participation in the school meal program also increases our programmatic funding, allowing us to continue to improve our offerings. And yet, we cannot assume that â€œif we build it, they will come.â€    SNSâ€™ Refresh program advances food justice for our students by providing fresh, healthy, and culturally relevant meals as part of a dignified dining experience. However, the overall average daily participation in school meals at these 19 schools is only about 30% for lunch (and lower for breakfast and supper). This means that about 70% of our students at Refresh sites have access to free, freshly prepared meals every school day but do not eat them. Persistent school food stigma, coupled with misinformation, are central barriers to accessing school meals. For decades, popular culture, media, and public opinion have posited that school food is low quality, unhealthy, uncool, and associated with low socioeconomic status. Until California implemented School Meals for All in 2021, all public school students were subjected to a stratified system that designates students as paid, reduced, or free lunch recipients, furthering stigma. In addition, many of our students and site staff do not have accurate information about our programâ€™s offerings. For example, we often find that teachers at Refresh sites do not know that the food at their own school is prepared fresh onsite. All SFUSD elementary schools receive pre-packaged vended meals, and many students do not realize when moving to middle or high school that their school food menu is different. We sometimes hear middle school students say they donâ€™t like the food, and upon further inquiry, learn they have not tried the food in years. In order to address these barriers and improve school food culture, our team seeks to use the Food Justice for Kids funding to launch an engagement and awareness campaign based on a student-centered design approach.    In order to address the school food stigma that poses a barrier to access, we plan to utilize peer-to-peer education and outreach that uplifts students as influencers in their communities and shares accurate information about school food from a recognized and trusted source. In past engagements with student leadership groups, we have repeatedly heard a call to â€œmake school food coolâ€ through youth-generated short-form content on Tiktok and Instagram. High school students from SFUSDâ€™s Student Advisory Council suggested that many students perceive free meals as undesirable and that peer perception around school food plays a large role in student behavior. They asked how we can continue to demonstrate tangible improvements, show â€œbehind the scenesâ€ of the Refresh program, and shift the negative culture around school food. Understanding that students have an interest in this culture change, our proposal is to partner with 3-4 middle and high schools that currently receive the Refresh menu to deeply understand their school food culture and then collaborate with students to launch a multi-media engagement and promotional campaign to raise awareness and excitement about this meal program. Schools will be selected based on a variety of factors, including socio-economic data, existing student leadership structures, and demonstrated student interest in participating.    Our team has seen success with engaging youth as peer educators in this way through student-led school food tastings, in which student leaders were able to prepare, serve, and promote school food samples to their classmates. During these tastings, we have heard students explaining school meals to their friends in other languages, encouraging peers to try something new, and taking pride in food they might otherwise dismiss, saying things like, â€œtry this, I helped make it.â€ By empowering students with information and a sense of ownership over the food they eat, we can both transform their individual relationships with school food and also see the ripple effect of students speaking positively and sharing excitement about the meal program. Additionally, this approach has the potential to shift shared narratives around school food, combatting stigma associated with social welfare programs and instead reframing the program as a perk and privilege for our students. By directly addressing school food stigma and misinformation, we acknowledge the many factors that influence our studentsâ€™ eating experiences beyond just the taste of the food.\n\nQuestion: Question 3: Community Power     How is your organization and/or project led by, collaborating with, and building power within the community you serve?     For example, how are children, caregivers, school leadership, and other relevant community leaders guiding your project and working in partnership in other aspects of your organizationâ€™s work? Answer: In order to develop the specific deliverables of this project, we first intend to enter a stage of fact-finding and trust building with student participants. Our team will harness existing relationships with staff and student groups at schools and host 2 collaborative workshops per school using human-centered design, â€œa creative problem-solving approach grounded in empathy, iteration, and collaborationâ€ (IDEO, 2025). Within these workshops, we will use design thinking tools to highlight school food stigma and collaboratively develop central questions and opportunities to challenge community perceptions. These workshops will honor the power of studentsâ€™ lived experiences with school meals and their own personal relationships with school food stigma, treating students as subject matter experts in this area.    After this workshopping stage, we will collaborate with these student groups to host 1-2 full school tastings per site, in which student leaders will help prepare, plate, and serve school food samples. As discussed above, this helps students feel a sense of ownership and pride in the food they are serving to peers. Alongside these tastings, we will build a digital communications and social media campaign based upon the findings from the workshops. This may include student-led interviews with Dining Staff, tours of school kitchens, cooking demonstrations, and more. Whenever possible, we want to highlight the student perspective, asking students to create content from their point of view, and potentially using the PhotoVoice method, a participatory visual qualitative research method in which participants take photographs to narratively document their lived experiences.    The purpose of this campaign is to capture the ideas and perspectives from these youth in order to build engaging communications that can encourage their peers to try school food, as well as dispel misinformation by sharing knowledge from trusted sources. The central goal of this project is to build power, engagement, and excitement among students and create trusting relationships between students and our team. While initially focusing on the specific needs of 3-4 schools, we hope to scale these insights into a campaign that reaches all 20 Refresh schools.","website":"https://www.sfusd.edu/departments/student-nutrition-services","smartie_summary":"This organization connects with youth to facilitate student-led tasting events at partnered schools to promote student connection to food, curate content related to school food engagement, and improve student perceptions of school meals.","smartie_goal_1":"From September 2026 to January 2027, conduct 6-8 design workshops with at least 40 total student participants across 3-4 middle and high schools in partnership with site administrators and staff. Workshops will use human-centered design approaches and be co-designed with a trusted staff leader at the school, such as a Community Health Outreach Worker, Community Schools Coordinator, or School Social Worker. Middle and high school workshops will be modified to be age appropriate for each group (ages 11-13 and 14-18, respectively). We will partner with the identified schools to select a diversity of students both in cultural and racial background as well as with their current relationship to school food. After student workshops are completed, from January 2027 to April 2027, we will host 1-2 student-led tasting events at each participating school site highlighting studentselected school menu items, both those currently on the menu and potential new menu items. Students will have the opportunity to help prepare, plate, and serve samples to their peers, with a goal of reaching 500 students across 3-4 school sites. Feedback methods will be co-designed with student participants. These events will involve students ages 11-18 across two grade cohorts (middle school and high school).\n\nSuccess Measures\n- Student workshops will provide qualitative feedback on school meal programs as well as on this process; student feedback will guide continuous improvement of process and adjustment of project deliverables. \n- Across participating school populations, we will conduct a preand post-intervention survey to track satisfaction with school meals, accurate knowledge about school food, perceptions about school meals, sense of agency in menu decision making, and sense of belonging in dining spaces. We will also track Average Daily Participation (ADP) in the school lunch program at these schools for 3-4 weeks after tasting events and compare to and compare to previous 4 weeks of data.","smartie_goal_2":"From December 2026 to June 2027, students will work with SNS Marketing and Communications Specialist to create up to 20 distinct content and/or digital communication deliverables including content directly from the student point-of-view. Content will be codesigned and co-created with student leaders ages 11-18 across two grade cohorts (middle school and high school).\n\nSuccess Measures\n- We will track engagement with social media content including follows, views, likes, shares, and comments, as well as engagement with other digital communications as applicable, including opens, clicks, and subscriptions to newsletters.","smartie_goal_3":"From August 2026 to June 2027, we will track anticipated increases in school lunch ADP across the 3-4 participating schools. By June 2027, survey results will indicate an increase in positive student perception of school meals as well as an increase in accurate knowledge of key school food facts, including nutritional value of the meals and the fact that they are freshly prepared daily.\n\nSuccess Measures\n- SNS regularly collects and reports on ADP by school and meal time. Our team will analyze any increases at participating sites over time. Pre- and post-intervention surveys will track satisfaction with school meals, accurate knowledge about school food, perceptions about school meals, sense of agency in menu decision making, and sense of belonging in dining spaces.","smartie_goals":["From September 2026 to January 2027, conduct 6-8 design workshops with at least 40 total student participants across 3-4 middle and high schools in partnership with site administrators and staff. Workshops will use human-centered design approaches and be co-designed with a trusted staff leader at the school, such as a Community Health Outreach Worker, Community Schools Coordinator, or School Social Worker. Middle and high school workshops will be modified to be age appropriate for each group (ages 11-13 and 14-18, respectively). We will partner with the identified schools to select a diversity of students both in cultural and racial background as well as with their current relationship to school food. After student workshops are completed, from January 2027 to April 2027, we will host 1-2 student-led tasting events at each participating school site highlighting studentselected school menu items, both those currently on the menu and potential new menu items. Students will have the opportunity to help prepare, plate, and serve samples to their peers, with a goal of reaching 500 students across 3-4 school sites. Feedback methods will be co-designed with student participants. These events will involve students ages 11-18 across two grade cohorts (middle school and high school).\n\nSuccess Measures\n- Student workshops will provide qualitative feedback on school meal programs as well as on this process; student feedback will guide continuous improvement of process and adjustment of project deliverables. \n- Across participating school populations, we will conduct a preand post-intervention survey to track satisfaction with school meals, accurate knowledge about school food, perceptions about school meals, sense of agency in menu decision making, and sense of belonging in dining spaces. We will also track Average Daily Participation (ADP) in the school lunch program at these schools for 3-4 weeks after tasting events and compare to and compare to previous 4 weeks of data.","From December 2026 to June 2027, students will work with SNS Marketing and Communications Specialist to create up to 20 distinct content and/or digital communication deliverables including content directly from the student point-of-view. Content will be codesigned and co-created with student leaders ages 11-18 across two grade cohorts (middle school and high school).\n\nSuccess Measures\n- We will track engagement with social media content including follows, views, likes, shares, and comments, as well as engagement with other digital communications as applicable, including opens, clicks, and subscriptions to newsletters.","From August 2026 to June 2027, we will track anticipated increases in school lunch ADP across the 3-4 participating schools. By June 2027, survey results will indicate an increase in positive student perception of school meals as well as an increase in accurate knowledge of key school food facts, including nutritional value of the meals and the fact that they are freshly prepared daily.\n\nSuccess Measures\n- SNS regularly collects and reports on ADP by school and meal time. Our team will analyze any increases at participating sites over time. Pre- and post-intervention surveys will track satisfaction with school meals, accurate knowledge about school food, perceptions about school meals, sense of agency in menu decision making, and sense of belonging in dining spaces."],"strategy_1":"Direct Service and Education","strategy_2":"Youth training and development","scope_of_work":"Local","target_age_range":"Middle-High School","special_populations":"Youth of Color","location":"San Francisco, CA","note":"SFUSD's mission is to provide each and every student the quality instruction and equitable support required to thrive in the 21st century.   The district's core values include being Student-Centered, Fearless, United, committed to Social Justice, and Diversity-Driven.   Student Nutrition Services' mission is to nourish students every day with food that enables them to live healthy lives and thrive inside and outside the classroom. The department's 4 goals are: 1) Nourish our students with good food, 2) Create dignified built environments, 3) Support a thriving workforce, and 4) Build a strong food culture."},{"org":"Umpqua Valley Farm to School","app":"Food Justice through Shared Knowledge and Collaboration","name":"Food Justice through Shared Knowledge and Collaboration","application_link":"https://portal.justfund.us/f/application/38332","city":"Roseburg","state":"OR","region":"Western","finalist_type":"NOFHumanitix","portfolio":"Nutrition Education & School Food","label":"Nutrition Education & School Food","focus":"Environmental Justice / Climate Justice / Nature, Education, Food Justice","strategies":"","scope":"Regional, Local","bipoc":"No","tax":"501c3","communities":"Indigenous, People with Disabilities, Rural, Youth","budget":"$385,000","annual_budget":"$385,000","budget_value":385000,"budget_bucket":"Under $500K","grant_req":"$75,000","grant_request_value":75000,"mission":"We believe food security begins with a strong community connection to the land and its food. By supporting local food systems and providing education to Douglas County youth, UVF2S cultivates skills and passion to build food-community connections. UVF2S aims to achieve an equitable and sustainable food system that nurtures and strengthens Douglas Countyâ€™s people and economy.","year_est":"2010","additional_questions":"Question: Question 1: Program Focus     Please check which of the following focus areas are primary elements of the proposed program.      Select the one that is most relevant to your program's focus. This selection will help us with assigning reviewers. Note: All eligible projects must primarily focus on children under the age of 18.  Learn more in our FAQs . Answer: Nutrition Education & School Food: Projects and policy work supporting kids learning, growing, and cooking healthy and culturally relevant foods; eating nutritious and culturally relevant school meals and integrating local food in schools; or improving access to school meals.\n\nQuestion: Question 2: Innovation     How does your proposed project offer both an innovative and impactful approach that advances food justice for kids?      \"Innovative\" doesn't necessarily mean new technology or a novel approach. Whether rooted in traditional knowledge, adapted from successful models in other communities, or offering a novel approach to persistent challenges, we want to understand what makes your approach unique and why you believe it will create meaningful change.   Please also share any evidence of past results, related outcomes, and/or qualitative or quantitative indicators that demonstrate the promise of your approach. Answer: Food Justice through Shared Knowledge  advances food justice by integrating cultural identity, Indigenous knowledge, and hands-on food access into daily school experiences. UVF2S centers shared knowledgeâ€”especially through partnership with the Cow Creek Band of Umpqua Tribe of Indiansâ€”bringing awareness to native plants, Takelma language, and Tribal history alongside school gardens and cafeteria tastings. We celebrate Black agricultural innovation, Hispanic/Latinx food traditions, and other cultural contributions through heritage month programming and culturally relevant crops grown and tasted by students. Students have the opportunity to learn about the history of agriculture through various cultures and taste foods from those cultures throughout lessons.    This approach increases access to healthy foods, strengthens cultural belonging, and builds systems awareness. Students become growers, storytellers, and informed participants in food systemsâ€”connecting food, culture, and justice in meaningful, lasting ways.\n\nQuestion: Question 3: Community Power     How is your organization and/or project led by, collaborating with, and building power within the community you serve?     For example, how are children, caregivers, school leadership, and other relevant community leaders guiding your project and working in partnership in other aspects of your organizationâ€™s work? Answer: UVF2S grounds its work in continuous community feedback and shared leadership. We gather input from students, caregivers, teachers, and school administrators to shape lessons, tastings, and garden activities that reflect the cultures and needs of low-income, diverse communities. Student reflections and classroom feedback directly inform curriculum updates and cultural food selections. Our board includes members whose lived experiences mirror those of the families we serve, and includes school staff, farmers, and youth advocacy leaders, ensuring decisions are guided by community voice. We collaborate closely with school leadership, Tribal leaders, and local partners to co-design programming, building trust, shared ownership, and long-term community power around food justice and education.","website":"https://uvf2s.org/","smartie_summary":"This organization aims to create local produce tastings for local schools, featuring recipes produced by local farmers in alignment with the National School Lunch Program nutrition requirements. This organization additionally will nurture a partnership with their local Tribe to pass on cultural traditions and connect students with nutrition education and hands-on cooking experiences.","smartie_goal_1":"Increase Access & Cultural Food Exposure \nGoal: By the end of 12 months, UVF2S will deliver at least 18 Harvest of the Month tastings featuring culturally relevant specialty crops to 2,500 K–8 students (ages 5–14) in low-income Douglas County schools. Recipes will feature an item from a local producer each month and recipes will be suited for the National School Lunch Program nutrition requirements. HOM tastings will also feature foods that showcase national heritage months, for insurance Black History Month, Native American Heritage Month, and Asian American Pacific Islander Heritage Month.\n\nSuccess Measures\nTracking the number of tastings, student participation totals, and collecting data from each tasting in the form of magnet boards that students will participate in, measuring willingness to try new fruits and vegetables, aiming for a 20% increase in students reporting openness to new foods. \nMagnet boards also track whether students: ● Liked it ● Loved it ● Not sure yet \nAbout each recipe. We utilize “not sure yet” based on research that it takes several times trying a new food before deciding if someone likes it or not.","smartie_goal_2":"Strengthen Cultural & Nutrition Knowledge \nGoal: Within 12 months, UVF2S will provide garden-based cultural food lessons to 1,500 K–8 students (ages 5–14), featuring plants suited to the Southwestern Oregon climate and connected to diverse food traditions. UVF2S has created a Takelma Language Project in partnership with our local Tribe which will be used to discuss and learn about cultural traditions from our area while helping to preserve cultural languages and plants. UVF2S also has close ties to nutrition services at each of our four school districts so that we can add produce grown in the gardens into school meals.\n\nSuccess Measures\nPre/post assessments will measure gains in knowledge of nutrition, cultural food origins, and plant life cycles, with at least 70% of students demonstrating increased understanding. Students will be able to demonstrate their knowledge while working in the garden and identifying native plants and their purpose in the ecosystem and the traditional uses for each plant based on the Takelma Language signs. Students will be able to identify nutritious foods versus foods that lack nutrition and show improved interest in nutritious foods based on pre and post surveys.","smartie_goal_3":"Advance Pillars of Wellness \nGoal: Over 12 months, 1,500 K–8 students (ages 5–14) will participate in lessons integrating UVF2S’s three Pillars of Wellness—nutrition, physical activity, and mindfulness—through gardening, movement-based learning, and reflection practices. Lessons will include cooking, gardening, mindfulness exercises, and local agriculture experiences in the form of farm field trips and experiences relating school gardens to larger agriculture in our area.\n\nSuccess Measures\nEducator observation tools and student reflections will document participation, with 75% of teachers reporting improved student engagement and wellness behaviors. Students will show in garden lessons their own ability to regulate using practices rooted in Social Emotional Learning for mindfulness. They will be able to identify nutritious foods, and exhibit physical activity when working in gardens. Surveys will be used with classroom teachers and school staff to gauge change in student behavior around social emotional learning and mindfulness to assess successes in our wellness program.","smartie_goals":["Increase Access & Cultural Food Exposure \nGoal: By the end of 12 months, UVF2S will deliver at least 18 Harvest of the Month tastings featuring culturally relevant specialty crops to 2,500 K–8 students (ages 5–14) in low-income Douglas County schools. Recipes will feature an item from a local producer each month and recipes will be suited for the National School Lunch Program nutrition requirements. HOM tastings will also feature foods that showcase national heritage months, for insurance Black History Month, Native American Heritage Month, and Asian American Pacific Islander Heritage Month.\n\nSuccess Measures\nTracking the number of tastings, student participation totals, and collecting data from each tasting in the form of magnet boards that students will participate in, measuring willingness to try new fruits and vegetables, aiming for a 20% increase in students reporting openness to new foods. \nMagnet boards also track whether students: ● Liked it ● Loved it ● Not sure yet \nAbout each recipe. We utilize “not sure yet” based on research that it takes several times trying a new food before deciding if someone likes it or not.","Strengthen Cultural & Nutrition Knowledge \nGoal: Within 12 months, UVF2S will provide garden-based cultural food lessons to 1,500 K–8 students (ages 5–14), featuring plants suited to the Southwestern Oregon climate and connected to diverse food traditions. UVF2S has created a Takelma Language Project in partnership with our local Tribe which will be used to discuss and learn about cultural traditions from our area while helping to preserve cultural languages and plants. UVF2S also has close ties to nutrition services at each of our four school districts so that we can add produce grown in the gardens into school meals.\n\nSuccess Measures\nPre/post assessments will measure gains in knowledge of nutrition, cultural food origins, and plant life cycles, with at least 70% of students demonstrating increased understanding. Students will be able to demonstrate their knowledge while working in the garden and identifying native plants and their purpose in the ecosystem and the traditional uses for each plant based on the Takelma Language signs. Students will be able to identify nutritious foods versus foods that lack nutrition and show improved interest in nutritious foods based on pre and post surveys.","Advance Pillars of Wellness \nGoal: Over 12 months, 1,500 K–8 students (ages 5–14) will participate in lessons integrating UVF2S’s three Pillars of Wellness—nutrition, physical activity, and mindfulness—through gardening, movement-based learning, and reflection practices. Lessons will include cooking, gardening, mindfulness exercises, and local agriculture experiences in the form of farm field trips and experiences relating school gardens to larger agriculture in our area.\n\nSuccess Measures\nEducator observation tools and student reflections will document participation, with 75% of teachers reporting improved student engagement and wellness behaviors. Students will show in garden lessons their own ability to regulate using practices rooted in Social Emotional Learning for mindfulness. They will be able to identify nutritious foods, and exhibit physical activity when working in gardens. Surveys will be used with classroom teachers and school staff to gauge change in student behavior around social emotional learning and mindfulness to assess successes in our wellness program."],"strategy_1":"Direct Service and Education","strategy_2":"","scope_of_work":"Local","target_age_range":"Elementary - Middle School","special_populations":"Youth of Color","location":"Roseburg, OR","note":"We believe food security begins with a strong community connection to the land and its food. By supporting local food systems and providing education to Douglas County youth, UVF2S cultivates skills and passion to build food-community connections. UVF2S aims to achieve an equitable and sustainable food system that nurtures and strengthens Douglas Countyâ€™s people and economy."},{"org":"Pilot Light","app":"Taking a Bite out of Food Inequity: Building Lasting Classroom Connections to Boost Childrenâ€™s Produce Consumption","name":"Taking a Bite out of Food Inequity: Building Lasting Classroom Connections to Boost Childrenâ€™s Produce Consumption","application_link":"https://portal.justfund.us/f/application/39734","city":"Chicago","state":"IL","region":"Midwest","finalist_type":"NOFHumanitix","portfolio":"Nutrition Education & School Food","label":"Nutrition Education & School Food","focus":"Education, Healthcare / Wellness / Public Health, Food Justice","strategies":"Culture, Direct Service, Education, Leadership Development, Policy","scope":"National, Local","bipoc":"No","tax":"501c3","communities":"Black, Latino / Latina / Latinx, Youth","budget":"$1,757,000","annual_budget":"$1,757,000","budget_value":1757000,"budget_bucket":"$1M–$5M","grant_req":"$49,484","grant_request_value":49484,"mission":"Founded over a decade ago on the belief that equitable access to food education is vital to childrenâ€™s health, agency, and well-being, Pilot Light advances food justice through innovative, school-based programs that center youth as informed decision-makers and advocates. We prioritize serving students in historically under-resourced communities, ensuring all young peopleâ€”regardless of backgroundâ€”have the knowledge and skills to navigate and challenge food system inequities.   Aware of the many demands on our nationâ€™s teachers, Pilot Light supports them with high-quality professional development to integrate culturally relevant, standards-aligned lessons about food into core academic subjects like math and science, thereby eliminating the need for additional instructional time. This sustainable model deepens studentsâ€™ understanding of nutrition, food systems, and their own lived experiences while building real-world connections between classroom learning and the food students encounter dailyâ€”on their lunch trays, at home, and in their rural, suburban, and urban communities. Recent cuts to programs like SNAP-Ed have elevated the importance of Pilot Lightâ€™s work for sustainability and impact, and illuminated our role in filling the resulting gaps.   With Pilot Light, students build critical literacy and STEM skills alongside the ability to make informed food choices, identify food equity barriers, and advocate for more just food environments. Our innovative, food-integrated approach fosters the curiosity and inquiry that inspires youth to become agents of change who advocate for food justice for themselves and future generations.","year_est":"2010","additional_questions":"Question: Question 1: Program Focus     Please check which of the following focus areas are primary elements of the proposed program.      Select the one that is most relevant to your program's focus. This selection will help us with assigning reviewers. Note: All eligible projects must primaril
